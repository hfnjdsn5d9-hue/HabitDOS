<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HabitDOS">
<title>HabitDOS HTML v2.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e6e6e6;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Courier New",monospace;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:90px}
main{max-width:640px;margin:auto;padding:22px 18px}

/* ── Brand & Prompt ── */
.brand{font-size:11px;font-weight:800;letter-spacing:.25em;color:#555;margin-bottom:4px}
h1{font-size:22px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 .prompt{color:#00ff41;font-weight:800}
.cursor{display:inline-block;width:10px;height:22px;background:#00ff41;animation:blink 1.1s steps(1) infinite;vertical-align:-3px;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.sub{font-size:12px;color:#777;letter-spacing:.06em;margin-bottom:6px}
small,.hint{font-size:11px;color:#666;letter-spacing:.02em}
hr{border:0;border-top:1px solid #2a2a2a;margin:18px 0 22px}

/* ── Hero / Summary ── */
.hero{background:#111;border:1px solid #2a2a2a;border-left:4px solid #00ff41;padding:24px 20px;margin:0 0 20px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.hero-top small{letter-spacing:.2em;font-size:10px;color:#555;font-weight:800}
.hero-pct{font-size:64px;font-weight:800;line-height:.85;letter-spacing:-.03em;color:#fff}
.hero-bar{font-size:18px;letter-spacing:2px;line-height:1;margin-bottom:14px;word-break:break-all;color:#00ff41}
.hero-sub{letter-spacing:.04em;font-size:13px;color:#888}

/* ── Milestone ── */
.milestone{background:#111;border:1px dashed #00ff41;padding:14px 16px;margin:0 0 20px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.14em;color:#00ff41;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ── Cards ── */
.card{width:100%;display:block;text-align:left;background:#111;color:#e6e6e6;border:1px solid #2a2a2a;padding:18px;margin:0 0 12px;transition:none;position:relative}
.card:active{background:#1a1a1a;border-color:#444}
.card:disabled{opacity:.4;border-color:#222}
.card:disabled .chk{color:#444!important}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row b{font-size:16px;font-weight:800;letter-spacing:.02em}
.chk{font-size:20px;font-weight:800;letter-spacing:1px;padding:2px 0}
.chk.na{color:#444;font-weight:400}
.chk.donegreen{color:#00ff41!important;text-shadow:0 0 12px rgba(0,255,65,.4)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:14px;font-size:11px;color:#666}
.mbar{letter-spacing:2px;color:#00ff41;font-size:14px;font-weight:800}

/* ── Buttons ── */
.wide{width:100%;min-height:56px;background:#0a0a0a;color:#e6e6e6;border:1px solid #333;padding:14px;margin-top:10px;font-weight:800;letter-spacing:.08em;font-size:11px;text-transform:uppercase;transition:none;position:relative}
.wide:active{background:#1a1a1a;border-color:#555}
.wide.secondary{margin-top:10px;font-weight:400;letter-spacing:.04em;border-color:#222;color:#888}
.wide.secondary:active{border-color:#444}
.file{display:block;text-align:center}.file input{display:none}

/* ── Navigation ── */
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#0a0a0a;border-top:2px solid #1a1a1a;display:flex;padding:8px max(6px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:#555;padding:14px 2px;font:inherit;font-size:10px;letter-spacing:.06em;font-weight:800;text-transform:uppercase;transition:none;position:relative}
nav button.sel{color:#00ff41;font-weight:800;background:#111;border-top:2px solid #00ff41;margin-top:-2px}
nav button.sel::before{content:"> "}
nav button:active{color:#888;background:#151515}

.nav-more{flex:1;position:relative}
.nav-more>button{width:100%}
.nav-pop{position:absolute;bottom:58px;right:4px;background:#0a0a0a;border:1px solid #333;min-width:140px;padding:4px;box-shadow:0 4px 20px rgba(0,0,0,.8)}
.nav-pop button{display:block;width:100%;text-align:left;background:#111;color:#888;border:0;padding:12px;font:inherit;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.nav-pop button.sel{color:#00ff41;background:#1a1a1a}
.nav-pop button:active{background:#222}

/* ── Table / Week ── */
.table{overflow:auto}.wh,.wr{display:grid;grid-template-columns:120px repeat(7,42px);align-items:center;min-width:420px}
.wh{font-size:10px;color:#555;margin-bottom:10px;letter-spacing:.08em;font-weight:800}.wh span{text-align:center}
.wr{border-bottom:1px solid #1a1a1a;padding:14px 0}.wr>span{text-align:center;font-size:16px}
.wr div{display:flex;flex-direction:column;gap:4px}.wr b{font-size:13px;font-weight:800}
.wr small{color:#555;font-size:10px}

/* ── Month Nav ── */
.monthnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.monthnav button{font-size:28px;color:#fff;background:none;border:0;padding:8px 20px;font-weight:800}
.monthnav button:active{color:#00ff41}
.monthnav b{font-size:15px;letter-spacing:.06em;font-weight:800}
.monthnav .back{font-size:11px;padding:10px 12px;color:#888;border:1px solid #222}

/* ── Modal / Dialog ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;display:flex;align-items:flex-end}
.dialog{width:100%;max-width:620px;margin:auto;background:#0a0a0a;border:1px solid #333;border-top:3px solid #00ff41;padding:24px 20px;max-height:92vh;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.top b{font-size:14px;letter-spacing:.1em;font-weight:800}
.top button{color:#888;font-size:11px;letter-spacing:.06em;background:none;border:1px solid #333;padding:10px 14px;font-weight:800}
.top button:active{border-color:#555}
.dialog label{display:block;font-size:11px;color:#555;margin:18px 0;letter-spacing:.06em;font-weight:800}
.dialog input{display:block;width:100%;margin-top:10px;background:#111;border:1px solid #333;color:#fff;padding:16px;font:inherit;font-size:16px}
.dialog input:focus{outline:none;border-color:#00ff41}
.label{font-size:11px;color:#555;margin:20px 0 10px;letter-spacing:.06em;font-weight:800}

/* ── Segmented Controls ── */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button,.days button{background:#111;color:#888;border:1px solid #222;padding:14px 6px;font:inherit;font-size:10px;letter-spacing:.04em;min-height:48px;font-weight:800;text-transform:uppercase}
.seg button.sel,.days button.sel{color:#00ff41;border-color:#00ff41;background:#111}
.seg button:active,.days button:active{background:#1a1a1a}

.counter{display:flex;justify-content:space-between;align-items:center;border:1px solid #222;padding:8px}
.counter button{background:none;border:0;color:#fff;font-size:28px;padding:8px 24px;font-weight:800}
.counter b{font-size:16px;font-weight:800}

.days{border:1px solid #222}
.days button{width:100%;text-align:left;border:0;border-bottom:1px solid #1a1a1a;padding:16px 14px;font-size:11px;font-weight:800;color:#888}
.days button:last-child{border:0}
.days button.sel{color:#00ff41}

.danger{margin-top:14px;color:#ff5555;border-color:#442222}

/* ── Matrix / TODO ── */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.quad{background:#111;border:1px solid #222;padding:14px}
.qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;border-bottom:1px solid #1a1a1a;padding-bottom:10px;gap:8px}
.qh b{font-size:10px;letter-spacing:.04em;line-height:1.3;font-weight:800;color:#888}
.qh small{letter-spacing:0;font-size:10px;white-space:nowrap;color:#555}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #1a1a1a}
.todo-item:last-child{border:0}
.todo-item.done .ttext{color:#444;text-decoration:line-through}
.tbox{background:none;border:0;padding:6px 6px 6px 0;margin:-6px 0 -6px -2px;color:#fff;line-height:1;font-size:14px;font-weight:800;cursor:pointer}
.ttext{flex:1;font-size:12px;line-height:1.5;word-break:break-word;padding-top:4px;color:#ccc}
.tdel{background:none;border:0;color:#444;font-size:20px;padding:4px 6px;margin:-4px -6px -4px 0;line-height:1;cursor:pointer}
.tdel:active{color:#ff5555}
.qempty{font-size:11px;color:#333}

.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{background:#111;color:#888;border:1px solid #222;padding:14px 10px;font:inherit;font-size:10px;text-align:left;line-height:1.4;letter-spacing:.02em;min-height:48px;font-weight:800}
.seg2 button.sel{color:#00ff41;border-color:#00ff41;background:#111}

/* ── v1.5+ History / Stats ── */
.donegreen{color:#00ff41!important;text-shadow:0 0 12px rgba(0,255,65,.35)}
.card.archived{border-color:#222;opacity:.9}
.archive-label{font-size:10px;color:#444;letter-spacing:.14em;font-weight:800}
.history-group{margin:0 0 24px}
.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111;border:1px solid #222;padding:16px 14px;margin:0 0 10px;text-align:left;width:100%;color:#e6e6e6;font:inherit;cursor:pointer}
.history-row:active{background:#1a1a1a;border-color:#333}
.history-row b{font-size:13px;font-weight:800}
.history-row small{display:block;margin-top:4px;color:#555}
.history-pct{font-size:18px;font-weight:800;white-space:nowrap;color:#fff}
.section-title{font-size:10px;color:#555;letter-spacing:.18em;margin:24px 0 10px;font-weight:800}
.year-row{display:grid;grid-template-columns:40px 48px 1fr;gap:10px;align-items:center;border-bottom:1px solid #1a1a1a;padding:12px 0;font-size:11px}
.year-row .yp{font-weight:800;text-align:right;color:#fff}
.year-row .yb{font-size:11px;letter-spacing:0;color:#888}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#111;border:1px solid #222;padding:16px}
.stat small{display:block;margin-bottom:8px;letter-spacing:.1em;color:#555;font-weight:800}
.stat b{font-size:22px;font-weight:800;color:#fff}
.readonly{border-top:1px solid #222;border-bottom:1px solid #222;padding:10px 0;margin:0 0 18px;font-size:10px;letter-spacing:.14em;color:#444;font-weight:800}

/* ── v1.6+ refinements ── */
.todayline{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 18px;color:#555;font-size:10px;letter-spacing:.08em;font-weight:800}
.tap-hint{color:#444;font-size:9px;letter-spacing:.06em}
.archive-current{border-left:3px solid #00ff41}
.detail-card{background:#111;border:1px solid #222;padding:16px;margin-bottom:12px}
.detail-card .big{font-size:28px;font-weight:800;color:#fff}
.mini-bar{font-size:13px;letter-spacing:1px;margin-top:10px;color:#00ff41;font-weight:800}
.green{color:#00ff41!important;text-shadow:0 0 10px rgba(0,255,65,.3)}

/* ── v1.7 Terminal additions ── */
.sysline{font-size:11px;color:#444;letter-spacing:.08em;font-weight:800;margin-bottom:8px}
.sysline .sysvar{color:#00ff41}
.prompt-line{font-size:13px;color:#555;margin-bottom:16px;font-weight:800;letter-spacing:.04em}
.prompt-line .path{color:#00ff41}

/* ── Swipe transition ── */
.view-wrap{transition:transform .12s ease-out,opacity .12s ease-out}
.view-wrap.swipe-left{transform:translateX(-30px);opacity:.6}
.view-wrap.swipe-right{transform:translateX(30px);opacity:.6}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#222}
::-webkit-scrollbar-thumb:hover{background:#333}

/* ── v1.8 additions ── */
.status-tag{display:inline-block;font-size:9px;letter-spacing:.14em;padding:2px 7px;border:1px solid #4a4a4a;color:#888;margin-left:8px;vertical-align:2px}
.status-tag.current{border-color:#69ff69;color:#69ff69}
.status-tag.future{border-color:#7a7a7a;color:#999}
.periodnav{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;gap:10px}
.periodnav button{font-size:26px;color:#e6e6e6;background:none;border:1px solid #4a4a4a;padding:2px 16px;min-height:44px;transition:background .1s}
.periodnav button:active{background:#252525}
.periodnav .pmid{flex:1;text-align:center;font-size:13px;letter-spacing:.06em;font-weight:800}
.periodnav .pmid small{display:block;font-weight:400;margin-top:3px;letter-spacing:.02em}
.completebar{border:1px solid #4a4a4a;padding:14px;margin:0 0 16px;text-align:center}
.completebar .cbig{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.01em}
.completebar .cstat{font-size:11px;letter-spacing:.16em;margin-top:8px}
.completebar.done{border-color:#69ff69}
.completebar.done .cbig,.completebar.done .cstat{color:#69ff69;text-shadow:0 0 8px rgba(105,255,105,.3)}
.weekrows{margin:0 0 8px}
.weekrow{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #2a2a2a;font-size:12px}
.weekrow:last-child{border:0}
.weekrow .wlabel{color:#999;letter-spacing:.04em}
.weekrow .wbar{letter-spacing:1px;color:#69ff69;font-size:13px;white-space:nowrap;overflow:hidden}
.weekrow .wpct{text-align:right;font-weight:800}
.weekrow.cur .wlabel{color:#69ff69}
.cmp-row{display:grid;grid-template-columns:1fr 60px 60px;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid #2a2a2a;font-size:13px}
.cmp-row .cmp-m{letter-spacing:.06em}
.cmp-row .cmp-p{text-align:right;font-weight:800}
.cmp-row .cmp-d{text-align:right;font-size:11px;color:#888}
.cmp-row .cmp-d.up{color:#69ff69}
.cmp-row .cmp-d.down{color:#c88}
.superlate{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:6px 0;font-size:11px;letter-spacing:.04em;color:#999}
.superlate b{color:#e6e6e6}
.heatmap{margin:6px 0 10px}
.heat-row{display:grid;grid-template-columns:40px 1fr 38px;gap:9px;align-items:center;padding:6px 0;font-size:12px}
.heat-row .hm{color:#999;letter-spacing:.04em}
.heat-row .hbar{letter-spacing:1px;font-size:13px;white-space:nowrap;overflow:hidden}
.heat-row .hp{text-align:right;font-weight:800;font-size:11px}
.habit-pick{display:block;width:100%;text-align:left;background:#202020;border:1px solid #4a4a4a;color:#e6e6e6;padding:13px;margin:0 0 8px;font:inherit;font-size:13px;transition:background .1s}
.habit-pick:active{background:#292929}
.habit-hist-row{display:grid;grid-template-columns:52px 1fr 44px;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid #2a2a2a;font-size:12px}
.habit-hist-row .hh-m{color:#999}
.habit-hist-row .hh-bar{letter-spacing:1px;color:#69ff69;font-size:12px;white-space:nowrap;overflow:hidden}
.habit-hist-row .hh-p{text-align:right;font-weight:800}
/* v1.9: flexible habit cards on TODAY read as optional */
.card.flex{border-style:dashed;border-color:#4a4a4a}
.card.flex .mbar{color:#888}
.card.flex.flexdone{border-color:#4ea84e}
.card.flex.flexdone .mbar{color:#69ff69}
/* v2.0: limit habit cards (fewer = better) */
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.card.limit{border-color:#4ea84e}
.card.limit.limitedge{border-color:#c9a94e}
.card.limit.limitover{border-color:#c85a5a}
.chk.limitred{color:#ff6b6b}
.counter.limitctr{margin-top:12px}
.counter.limitctr button{font-size:28px;min-width:64px}
.counter.limitctr b{font-size:15px}
</style>
<base target="_blank">
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   HABITDOS v2.0 — Terminal Habit Tracker
   ═══════════════════════════════════════════════════════════════ */

const HKEY="habitdos.v1_5.habits",RKEY="habitdos.v1_5.records",TKEY="habitdos.v1_5.todos",MEM={};
const SCROLLKEY="habitdos.v1_7.scroll";
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");

function getStore(k,f){try{let v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}try{let v=sessionStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return MEM[k]??f}
function putStore(k,v){MEM[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}}

const uid=()=>Date.now()+"-"+Math.random().toString(36).slice(2);
const APP_VERSION="2.0";
const cloneFreq=f=>JSON.parse(JSON.stringify(f));
const isoDate=d=>k(d);

function freqForDate(h,d){
  if(h.versions&&h.versions.length){
    let best=h.versions[0];
    h.versions.forEach(v=>{if(v.from<=isoDate(d)&&v.from>=best.from)best=v});
    return best.freq;
  }
  return h.freq;
}
function dueWithFreq(freq,d){
  if(freq.type==="daily")return true;
  if(freq.type==="times")return true;
  if(freq.type==="limit")return true;
  return Array.isArray(freq.days)&&freq.days.includes(d.getDay()+1);
}
function isPast(d){return isoDate(d)<isoDate(today())}
function weekStartKey(d){return isoDate(mon(d))}
function weekBelongsToMonth(d,m){
  return mon(d).getMonth()===m.getMonth() && mon(d).getFullYear()===m.getFullYear();
}
function monthWeekStarts(m){
  const first=monthDays(m)[0], last=monthDays(m).at(-1);
  let out=[], w=mon(first);
  while(w<=last){
    if(weekBelongsToMonth(w,m))out.push(new Date(w));
    w=add(w,7);
  }
  return out;
}
function weekProgVersioned(h,d){
  const ds=week(d), groups={};
  ds.forEach(x=>{
    const f=freqForDate(h,x), key=JSON.stringify(f);
    (groups[key]??={freq:f,days:[]}).days.push(x);
  });
  let doneN=0,target=0;
  Object.values(groups).forEach(g=>{
    if(g.freq.type==="times"){
      const n=g.days.filter(x=>done(h,x)).length;
      doneN+=Math.min(n,g.freq.count); target+=g.freq.count;
    }else if(g.freq.type==="limit"){
      // success = days at or under the limit (only count days up to today)
      const days=g.days.filter(x=>!isFuture(x));
      doneN+=days.filter(x=>limitOk(h,x)).length; target+=days.length;
    }else{
      const dueDays=g.freq.type==="daily"?g.days:g.days.filter(x=>dueWithFreq(g.freq,x));
      doneN+=dueDays.filter(x=>done(h,x)).length; target+=dueDays.length;
    }
  });
  return {done:doneN,target};
}
function isFuture(d){return isoDate(d)>isoDate(today())}
function habitStats(h){
  if(isLimit(h)){
    // For a limit habit, a "successful" day = at or under the max, counted from
    // the first logged day up to today. Streak = consecutive successful days.
    const logged=records.filter(r=>r.h===h.id&&typeof r.count==="number").map(r=>parse(r.d)).sort((a,b)=>a-b);
    const firstDay=logged.length?logged[0]:today();
    let best=0,run=0,dd=day(firstDay);
    while(!isFuture(dd)){
      if(limitOk(h,dd)){run++;best=Math.max(best,run);}else run=0;
      dd=add(dd,1);
    }
    let current=0,d=today();
    while(!isFuture(d)&&limitOk(h,d)&&d>=firstDay){current++;d=add(d,-1);}
    const overDays=logged.filter(x=>!limitOk(h,x)).length;
    const totalCount=records.filter(r=>r.h===h.id&&typeof r.count==="number").reduce((s,r)=>s+r.count,0);
    let targets=0,fulfilled=0;
    for(let y=firstDay.getFullYear(); y<=today().getFullYear(); y++){
      for(let m=0;m<12;m++){
        const mm=new Date(y,m,1);
        if(mm>today())continue;
        monthWeekStarts(mm).forEach(w=>{const p=weekProgVersioned(h,w);targets+=p.target;fulfilled+=p.done;});
      }
    }
    return {current,best,totalDone:overDays,totalCount,p:targets?Math.round(fulfilled/targets*100):0,limit:true};
  }
  const all=records.filter(r=>r.h===h.id&&r.ok).map(r=>parse(r.d)).sort((a,b)=>a-b);
  let best=0,run=0,prev=null;
  all.forEach(d=>{
    if(prev&&k(add(prev,1))===k(d))run++; else run=1;
    best=Math.max(best,run);prev=d;
  });
  let current=0,d=today();
  while(done(h,d)){current++;d=add(d,-1)}
  let totalDone=all.length;
  let targets=0,fulfilled=0;
  for(let y=all.length?all[0].getFullYear():today().getFullYear(); y<=today().getFullYear(); y++){
    for(let m=0;m<12;m++){
      const mm=new Date(y,m,1);
      if(mm>today())continue;
      monthWeekStarts(mm).forEach(w=>{
        const p=weekProgVersioned(h,w);
        targets+=p.target; fulfilled+=p.done;
      });
    }
  }
  return {current,best,totalDone,p:targets?Math.round(fulfilled/targets*100):0};
}
function monthProgVersioned(h,m){
  let doneN=0,target=0;
  monthDays(m).forEach(d=>{
    if(isFuture(d))return;
    const f=freqForDate(h,d);
    if(f.type==="limit"){
      target++; if(limitOk(h,d))doneN++;
    }else if(f.type!=="times"){
      if(dueWithFreq(f,d)){target++;if(done(h,d))doneN++}
    }
  });
  monthWeekStarts(m).forEach(w=>{
    const ds=week(w).filter(d=>d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear());
    const groups={};
    ds.forEach(x=>{const f=freqForDate(h,x),key=JSON.stringify(f);(groups[key]??={freq:f,days:[]}).days.push(x)});
    Object.values(groups).forEach(g=>{
      if(g.freq.type==="times"){
        target+=g.freq.count;
        doneN+=Math.min(g.days.filter(x=>done(h,x)).length,g.freq.count);
      }
    });
  });
  return {done:doneN,target,p:target?Math.round(doneN/target*100):0};
}
function monthOverall(m){
  const ps=active().map(h=>monthProgVersioned(h,m));
  return total(ps);
}
function yearOverall(y){
  let vals=[];
  for(let m=0;m<12;m++){
    const d=new Date(y,m,1);
    if(d>today())break;
    vals.push({month:d,p:monthOverall(d)});
  }
  return vals;
}

const mon=d=>{let x=day(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x};
const today=()=>day(new Date()),weekdays=["SO","MO","DI","MI","DO","FR","SA"];

/* ── v2.0: limit-type habits (fewer = better) ── */
function isLimit(h,d=today()){return freqForDate(h,d).type==="limit";}
function limitMax(h,d=today()){const f=freqForDate(h,d);return f.type==="limit"?(f.max??0):0;}
// daily count for a limit habit (records carry {count} instead of {ok})
function limitCount(h,d){
  const r=records.find(r=>r.h===h.id&&r.d===k(d)&&typeof r.count==="number");
  return r?r.count:0;
}
function limitSetCount(h,d,n){
  n=Math.max(0,n);
  let i=records.findIndex(r=>r.h===h.id&&r.d===k(d)&&typeof r.count==="number");
  if(i>=0){ if(n===0)records.splice(i,1); else records[i].count=n; }
  else if(n>0)records.push({h:h.id,d:k(d),count:n});
  save();render();
}
function limitInc(h,d=today()){limitSetCount(h,d,limitCount(h,d)+1);}
function limitDec(h,d=today()){limitSetCount(h,d,limitCount(h,d)-1);}
// "success" for a limit habit on a day = stayed at or under the max
function limitOk(h,d){return limitCount(h,d)<=limitMax(h,d);}
function toggle(h,d=today()){
  if(!due(h,d))return;
  let i=records.findIndex(r=>r.h===h.id&&r.d===k(d));
  if(i>=0)records[i].ok=!records[i].ok;
  else records.push({h:h.id,d:k(d),ok:true});

}
function week(d){let m=mon(d);return Array.from({length:7},(_,i)=>add(m,i))}

  let a=ps.reduce((s,x)=>s+x.done,0),b=ps.reduce((s,x)=>s+x.target,0);

}
function dayComplete(d){
  // v1.9/2.0: a day counts as complete when today's obligations
  // (daily / fixed-weekday / limit) all succeed. Flexible weekly-count habits
  // do NOT gate the daily streak. Limit habits succeed by staying under max.
  let dueH=active().filter(h=>!isFlexible(h,d)&&due(h,d));
  if(!dueH.length)return false;
  return dueH.every(h=>successToday(h,d));
}
function globalStreak(){
  let n=0,d=today();
  while(dayComplete(d)){n++;d=add(d,-1)}

}
function mark(h,d){
  if(isLimit(h,d)){
    const c=limitCount(h,d), mx=limitMax(h,d);
    const rec=records.some(r=>r.h===h.id&&r.d===k(d)&&typeof r.count==="number");
    if(!rec)return'<span class="chk na">·</span>';
    return c<=mx?`<span class="chk donegreen">${c}</span>`:`<span class="chk limitred">${c}</span>`;
  }
  if(done(h,d))return'<span class="chk donegreen">[X]</span>';
  if(!due(h,d))return'<span class="chk na">[–]</span>';
  return'<span class="chk">[ ]</span>';
}

function progLabel(h,p){

/* ── v1.9: TODAY = only today's obligations (Option C) ── */
// A habit is "flexible" if today's active frequency is a weekly-count goal.
function isFlexible(h,d=today()){return freqForDate(h,d).type==="times";}
// v2.0: unified "success today" — limit habits succeed by staying under max.
function successToday(h,d=today()){return isLimit(h,d)?limitOk(h,d):done(h,d);}
// Obligations = daily + fixed-weekday + limit habits that are due today (not flexible).
function todayObligations(){return active().filter(h=>!isFlexible(h)&&due(h,today()));}
// Flexible habits still open this week (shown as optional chips).
function todayFlexibles(){return active().filter(h=>isFlexible(h));}

function todayProgress(){
  const obl=todayObligations();

}

function monthProg(h,m){
  let ds=monthDays(m),f=h.freq;
  if(f.type==="times"){
    let first=new Date(m.getFullYear(),m.getMonth(),1),last=new Date(m.getFullYear(),m.getMonth()+1,0),fm=mon(first),lm=mon(last),target=0,doneN=0;
    for(let w=new Date(fm);w<=lm;w=add(w,7)){

      let n=week(w).filter(d=>done(h,d)).length;
      target+=f.count;doneN+=Math.min(f.count,n);
    }
    return{done:doneN,target,p:target?Math.round(doneN/target*100):0};
  }
  let dueDays=f.type==="daily"?ds:ds.filter(d=>f.days.includes(d.getDay()+1)),dn=dueDays.filter(d=>done(h,d)).length;
  return{done:dn,target:dueDays.length,p:dueDays.length?Math.round(dn/dueDays.length*100):0};
}

/* best & worst overall month across recorded history (12) */
function bestWorstMonths(){
  if(!records.length)return null;
  const dates=records.filter(r=>r.ok).map(r=>parse(r.d));
  if(!dates.length)return null;
  let min=dates[0],max=dates[0];
  dates.forEach(d=>{if(d<min)min=d;if(d>max)max=d;});
  let vals=[];
  let m=new Date(min.getFullYear(),min.getMonth(),1);
  const end=new Date(today().getFullYear(),today().getMonth(),1);
  while(m<=end){
    const o=monthOverall(m);
    if(o.target>0)vals.push({label:m.toLocaleDateString("de-DE",{month:"short",year:"numeric"}).toUpperCase(),p:o.p});
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  if(!vals.length)return null;
  let best=vals[0],worst=vals[0];
  vals.forEach(v=>{if(v.p>best.p)best=v;if(v.p<worst.p)worst=v;});
  return{best,worst};
}

  // Year heatmap (14): one row per month, ASCII bar

      const o=monthOverall(mm);

    }).join("")
  }</div>`;
  return `<main>${header("HISTORY",`Archiv · ${y}`)}<div class="periodnav"><button onclick="historyYearChange(-1)">‹</button><div class="pmid">${y}</div><button onclick="historyYearChange(1)">›</button></div>${heat}<div class="section-title">MONATE</div>${months.length?months.map(v=>{let label=v.month.toLocaleDateString("de-DE",{month:"short"}).toUpperCase();return`<button class="history-row" onclick="openHistoryMonth(${v.month.getFullYear()},${v.month.getMonth()})"><span><b>${label}</b><small>${v.p.done} / ${v.p.target}</small></span><span class="history-pct">${v.p.p}%</span></button>`}).join(""):'<div class="hint">NO ARCHIVE</div>'}<div class="section-title">WOCHEN</div>${historyWeeks(y).map(w=>`<button class="history-row" onclick="openHistoryWeek('${k(w)}')"><span><b>WEEK ${weekNumber(w)}</b><small>${w.toLocaleDateString("de-DE",{day:"numeric",month:"short"})} – ${add(w,6).toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</small></span><span class="history-pct">${total(active().map(h=>weekProgVersioned(h,w))).p}%</span></button>`).join("")}<button class="wide" onclick="setTab('today')">TODAY</button></main>`;
}

function weekNumber(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));
  const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil((((x-y)/86400000)+1)/7);
}

function historyWeeks(y){
  let out=[];
  const start=new Date(y,0,1), end=new Date(y,11,31), w=mon(start);
  for(let d=new Date(w);d<=end;d=add(d,7)){
    if(d<today() && d.getFullYear()===y && d.getMonth()>=0) out.push(d);
  }
  return out.reverse();
}

/* v1.8: all-time aggregate metrics */
function allTimeStats(){
  const okRecs=records.filter(r=>r.ok);
  const checks=okRecs.length;
  if(!checks)return{checks:0,p:0,bestStreak:0,weeks100:0,months100:0};
  const dates=okRecs.map(r=>parse(r.d));
  let min=dates[0];dates.forEach(d=>{if(d<min)min=d});
  let targets=0,fulfilled=0,weeks100=0,months100=0;
  const acts=active();
  // iterate months from first record to current
  let m=new Date(min.getFullYear(),min.getMonth(),1);
  const end=new Date(today().getFullYear(),today().getMonth(),1);
  while(m<=end){
    const mo=monthOverall(m);
    if(mo.target>0){targets+=mo.target;fulfilled+=mo.done;if(mo.p===100)months100++;}
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  // count 100% weeks
  let w=mon(min);
  const wend=mon(today());
  while(w<=wend){
    const wo=total(acts.map(h=>weekProgVersioned(h,w)));
    if(wo.target>0&&wo.p===100)weeks100++;
    w=add(w,7);
  }
  const bestStreak=acts.reduce((a,h)=>Math.max(a,habitStats(h).best),0);
  return{checks,p:targets?Math.round(fulfilled/targets*100):0,bestStreak,weeks100,months100};
}

/* ── Swipe Navigation ── */
let touchStartX=0,touchStartY=0,touchStartTime=0;
const SWIPE_THRESHOLD=60;  // min horizontal px
const SWIPE_MAX_Y=80;      // max vertical drift
const SWIPE_MAX_TIME=400;  // max duration ms

document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchStartTime=Date.now();
},{passive:true});

document.addEventListener("touchend",e=>{
  if(!touchStartX && !touchStartY)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  touchStartX=touchStartY=0;
  if(dt>SWIPE_MAX_TIME)return;
  if(Math.abs(dy)>SWIPE_MAX_Y)return;
  if(Math.abs(dx)<SWIPE_THRESHOLD)return;
  // v1.8: on WEEK / MONTH, horizontal swipe navigates the period, not the tab
  if(tab==="week"){
    if(dx<0)animateSwipe("left",()=>weekNav(1));
    else animateSwipe("right",()=>weekNav(-1));
    return;
  }
  if(tab==="month"){
    if(dx<0)animateSwipe("left",()=>changeMonth(1));
    else animateSwipe("right",()=>changeMonth(-1));
    return;
  }
  // Otherwise: switch tabs
  const idx=TAB_ORDER.indexOf(tab);
  if(idx<0)return;
  if(dx<0 && idx<TAB_ORDER.length-1){
    animateSwipe("left",()=>setTab(TAB_ORDER[idx+1]));
  }else if(dx>0 && idx>0){
    animateSwipe("right",()=>setTab(TAB_ORDER[idx-1]));
  }
},{passive:true});

function animateSwipe(dir,cb){
  const main=document.querySelector("main");
  if(!main){cb();return;}
  main.classList.add(dir==="left"?"swipe-left":"swipe-right");
  setTimeout(()=>{
    cb();
    requestAnimationFrame(()=>{
      const m=document.querySelector("main");
      if(m){m.classList.remove("swipe-left","swipe-right");}
    });
  },120);
}

/* ── Keyboard shortcuts ── */
document.addEventListener("keydown",e=>{
  const idx=TAB_ORDER.indexOf(tab);
  if(e.key==="ArrowRight" && idx<TAB_ORDER.length-1){e.preventDefault();setTab(TAB_ORDER[idx+1]);}
  else if(e.key==="ArrowLeft" && idx>0){e.preventDefault();setTab(TAB_ORDER[idx-1]);}
});

}

function render(){

    case "today":html=todayView();break;

/* ── Habit Editor ── */
let editId=null,editFreq={type:"daily"},editDays=[];

function editor(id){
  editId=id||null;
  if(editId){
    let h=habits.find(x=>x.id===editId);
    if(!h)return;
    editFreq=cloneFreq(h.freq);
    editDays=editFreq.type==="days"?[...editFreq.days]:[];
  }else{
    editFreq={type:"daily"};editDays=[];
  }

}

function renderEditor(){
  let h=editId?habits.find(x=>x.id===editId):null;
  let name=h?h.name:"";
  let title=editId?"HABIT BEARBEITEN":"NEUER HABIT";
  let delBtn=editId?`<button class="wide danger" onclick="deleteHabit()">HABIT LÖSCHEN</button>`:"";
  let archBtn=editId&&!h.arch?`<button class="wide secondary" onclick="archiveHabit()">ARCHIVIEREN</button>`:"";
  let unarchBtn=editId&&h.arch?`<button class="wide secondary" onclick="unarchiveHabit()">REAKTIVIEREN</button>`:"";

  let freqSeg=`
    <div class="label">FREQUENZ</div>
    <div class="seg seg4">
      <button class="${editFreq.type==="daily"?"sel":""}" onclick="setFreqType('daily')">TÄGLICH</button>
      <button class="${editFreq.type==="times"?"sel":""}" onclick="setFreqType('times')">FLEXIBEL</button>
      <button class="${editFreq.type==="days"?"sel":""}" onclick="setFreqType('days')">WOCHENTAGE</button>
      <button class="${editFreq.type==="limit"?"sel":""}" onclick="setFreqType('limit')">LIMIT</button>
    </div>
  `;

  let timesCtrl=editFreq.type==="times"?`
    <div class="label">ANZAHL PRO WOCHE</div>
    <div class="counter">
      <button onclick="changeCount(-1)">−</button>
      <b>${editFreq.count||3}</b>
      <button onclick="changeCount(1)">+</button>
    </div>
  `:"";

  let limitCtrl=editFreq.type==="limit"?`
    <div class="label">MAXIMUM PRO TAG</div>
    <div class="counter">
      <button onclick="changeLimit(-1)">−</button>
      <b>${editFreq.max??5}×</b>
      <button onclick="changeLimit(1)">+</button>
    </div>
    <div class="hint">LIMIT-HABIT · weniger ist besser. Jeder Tipp auf + zählt eins. Ein Tag gilt als geschafft, solange du auf oder unter dem Maximum bleibst.</div>
  `:"";

  let daysCtrl=editFreq.type==="days"?`
    <div class="label">TAGE</div>
    <div class="days">
      ${[1,2,3,4,5,6,7].map(d=>`<button class="${editDays.includes(d)?"sel":""}" onclick="toggleDay(${d})">${weekdays[d-1]}</button>`).join("")}
    </div>
  `:"";

  document.body.innerHTML=`
    <main>
      ${header(title)}
      <div class="top"><b>${title}</b><button onclick="cancelEditor()">ABBRECHEN</button></div>
      <label>NAME<input id="ename" value="${esc(name)}" placeholder="z.B. Lesen, Sport..."></label>
      ${freqSeg}${timesCtrl}${daysCtrl}${limitCtrl}
      <button class="wide" onclick="saveHabit()">${editId?"SPEICHERN":"HABIT ERSTELLEN"}</button>
      ${archBtn}${unarchBtn}${delBtn}
    </main>
  `;
}

function setFreqType(t){
  editFreq={type:t};
  if(t==="times")editFreq.count=3;
  if(t==="days")editDays=[];
  if(t==="limit")editFreq.max=5;
  renderEditor();
}
function changeCount(n){
  editFreq.count=Math.max(1,Math.min(7,(editFreq.count||3)+n));
  renderEditor();
}
function changeLimit(n){
  editFreq.max=Math.max(0,Math.min(99,(editFreq.max??5)+n));
  renderEditor();
}
function toggleDay(d){
  if(editDays.includes(d))editDays=editDays.filter(x=>x!==d);
  else editDays.push(d);
  editDays.sort((a,b)=>a-b);
  renderEditor();
}
function cancelEditor(){render();}
function saveHabit(){
  let name=$("#ename").value.trim();
  if(!name){alert("Name erforderlich.");return;}
  let freq=cloneFreq(editFreq);
  if(freq.type==="days")freq.days=[...editDays];
  if(editId){
    let h=habits.find(x=>x.id===editId);
    if(h){
      let oldFreq=JSON.stringify(h.freq);
      let newFreq=JSON.stringify(freq);
      if(oldFreq!==newFreq){
        if(!h.versions)h.versions=[{from:"2000-01-01",freq:cloneFreq(h.freq)}];
        h.versions.push({from:k(today()),freq:cloneFreq(freq)});
      }
      h.name=name;h.freq=freq;
    }
  }else{
    habits.push({id:uid(),name,freq,arch:false,versions:[{from:"2000-01-01",freq:cloneFreq(freq)}]});
  }
  save();render();
}
function deleteHabit(){
  if(!confirm("Habit wirklich löschen? Alle Daten gehen verloren."))return;
  habits=habits.filter(x=>x.id!==editId);
  records=records.filter(r=>r.h!==editId);
  save();render();
}
function archiveHabit(){
  let h=habits.find(x=>x.id===editId);
  if(h){h.arch=true;save();render();}
}
function unarchiveHabit(){
  let h=habits.find(x=>x.id===editId);
  if(h){h.arch=false;save();render();}
}

        <button onclick="addTodo(4)">4 · WEDER NOCH<br><small>STREICHEN</small></button>
      </div>
    </main>
  `;
}
function addTodo(q){
  let text=$("#tdesc").value.trim();
  if(!text){alert("Beschreibung erforderlich.");return;}
  todos.push({id:uid(),text,q,done:false});
  save();render();
}

/* ── Init ── */
save();render();
</script>
