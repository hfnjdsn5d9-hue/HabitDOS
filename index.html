<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HabitDOS">
<title>HabitDOS HTML v3.2</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:#0a0a0a;color:#e6e6e6;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Courier New",monospace;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:90px}
main{max-width:640px;margin:auto;padding:22px 18px}

/* ── Brand & Prompt ── */
.brand{font-size:11px;font-weight:800;letter-spacing:.25em;color:#555;margin-bottom:4px}
h1{font-size:22px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 .prompt{color:#00ff41;font-weight:800}
.cursor{display:inline-block;width:10px;height:22px;background:#00ff41;animation:blink 1.1s steps(1) infinite;vertical-align:-3px;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.sub{font-size:12px;color:#777;letter-spacing:.06em;margin-bottom:6px}
small,.hint{font-size:11px;color:#666;letter-spacing:.02em}
hr{border:0;border-top:1px solid #2a2a2a;margin:18px 0 22px}

/* ── Hero / Summary ── */
.hero{background:#111;border:1px solid #2a2a2a;border-left:4px solid #00ff41;padding:24px 20px;margin:0 0 20px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.hero-top small{letter-spacing:.2em;font-size:10px;color:#555;font-weight:800}
.hero-pct{font-size:64px;font-weight:800;line-height:.85;letter-spacing:-.03em;color:#fff}
.hero-bar{font-size:18px;letter-spacing:2px;line-height:1;margin-bottom:14px;word-break:break-all;color:#00ff41}
.hero-sub{letter-spacing:.04em;font-size:13px;color:#888}

/* ── Milestone ── */
.milestone{background:#111;border:1px dashed #00ff41;padding:14px 16px;margin:0 0 20px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.14em;color:#00ff41;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

/* ── Cards ── */
.card{width:100%;display:block;text-align:left;background:#111;color:#e6e6e6;border:1px solid #2a2a2a;padding:18px;margin:0 0 12px;transition:none;position:relative}
.card:active{background:#1a1a1a;border-color:#444}
.card:disabled{opacity:.4;border-color:#222}
.card:disabled .chk{color:#444!important}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row b{font-size:16px;font-weight:800;letter-spacing:.02em}
.chk{font-size:20px;font-weight:800;letter-spacing:1px;padding:2px 0}
.chk.na{color:#444;font-weight:400}
.chk.donegreen{color:#00ff41!important;text-shadow:0 0 12px rgba(0,255,65,.4)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:14px;font-size:11px;color:#666}
.mbar{letter-spacing:2px;color:#00ff41;font-size:14px;font-weight:800}

/* ── Buttons ── */
.wide{width:100%;min-height:56px;background:#0a0a0a;color:#e6e6e6;border:1px solid #333;padding:14px;margin-top:10px;font-weight:800;letter-spacing:.08em;font-size:11px;text-transform:uppercase;transition:none;position:relative}
.wide:active{background:#1a1a1a;border-color:#555}
.wide.secondary{margin-top:10px;font-weight:400;letter-spacing:.04em;border-color:#222;color:#888}
.wide.secondary:active{border-color:#444}
.file{display:block;text-align:center}.file input{display:none}

/* ── Navigation ── */
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:#0a0a0a;border-top:2px solid #1a1a1a;display:flex;padding:8px max(6px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:#555;padding:13px 1px;font:inherit;font-size:13.5px;letter-spacing:.02em;font-weight:800;text-transform:uppercase;transition:none;position:relative;white-space:nowrap;overflow:hidden}
nav button.sel{color:#00ff41;font-weight:800;background:#111;border-top:2px solid #00ff41;margin-top:-2px}
nav button.sel::before{content:"> "}
/* v3.0: die Seite hinter dem offenen Menü — erkennbar, aber nicht als "angetippt" */
nav button.cur{color:#2e7d3f;background:#0d0d0d;border-top:2px solid #1f5c2c;margin-top:-2px}
nav button.cur::before{content:"> "}
nav button:active{color:#888;background:#151515}

.nav-more{flex:1;position:relative}
.nav-more>button{width:100%}
.nav-pop{position:absolute;bottom:58px;right:4px;background:#0a0a0a;border:1px solid #333;min-width:140px;padding:4px;box-shadow:0 4px 20px rgba(0,0,0,.8)}
.nav-pop button{display:block;width:100%;text-align:left;background:#111;color:#888;border:0;padding:13px;font:inherit;font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.nav-pop button.sel{color:#00ff41;background:#1a1a1a}
.nav-pop button:active{background:#222}

/* ── Table / Week ── */
.table{overflow:auto}.wh,.wr{display:grid;grid-template-columns:120px repeat(7,42px);align-items:center;min-width:420px}
.wh{font-size:10px;color:#555;margin-bottom:10px;letter-spacing:.08em;font-weight:800}.wh span{text-align:center}
.wr{border-bottom:1px solid #1a1a1a;padding:14px 0}.wr>span{text-align:center;font-size:16px}
.wr div{display:flex;flex-direction:column;gap:4px}.wr b{font-size:13px;font-weight:800}
.wr small{color:#555;font-size:10px}

/* ── Month Nav ── */
.monthnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.monthnav button{font-size:28px;color:#fff;background:none;border:0;padding:8px 20px;font-weight:800}
.monthnav button:active{color:#00ff41}
.monthnav b{font-size:15px;letter-spacing:.06em;font-weight:800}
.monthnav .back{font-size:11px;padding:10px 12px;color:#888;border:1px solid #222}

/* ── Modal / Dialog ── */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:30;display:flex;align-items:flex-end}
.dialog{width:100%;max-width:620px;margin:auto;background:#0a0a0a;border:1px solid #333;border-top:3px solid #00ff41;padding:24px 20px;max-height:92vh;overflow:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.top b{font-size:14px;letter-spacing:.1em;font-weight:800}
.top button{color:#888;font-size:11px;letter-spacing:.06em;background:none;border:1px solid #333;padding:10px 14px;font-weight:800}
.top button:active{border-color:#555}
.dialog label{display:block;font-size:11px;color:#555;margin:18px 0;letter-spacing:.06em;font-weight:800}
.dialog input{display:block;width:100%;margin-top:10px;background:#111;border:1px solid #333;color:#fff;padding:16px;font:inherit;font-size:16px}
.dialog input:focus{outline:none;border-color:#00ff41}
.label{font-size:11px;color:#555;margin:20px 0 10px;letter-spacing:.06em;font-weight:800}

/* ── Segmented Controls ── */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button,.days button{background:#111;color:#888;border:1px solid #222;padding:14px 6px;font:inherit;font-size:10px;letter-spacing:.04em;min-height:48px;font-weight:800;text-transform:uppercase}
.seg button.sel,.days button.sel{color:#00ff41;border-color:#00ff41;background:#111}
.seg button:active,.days button:active{background:#1a1a1a}

.counter{display:flex;justify-content:space-between;align-items:center;border:1px solid #222;padding:8px}
.counter button{background:none;border:0;color:#fff;font-size:28px;padding:8px 24px;font-weight:800}
.counter b{font-size:16px;font-weight:800}

.days{border:1px solid #222}
.days button{width:100%;text-align:left;border:0;border-bottom:1px solid #1a1a1a;padding:16px 14px;font-size:11px;font-weight:800;color:#888}
.days button:last-child{border:0}
.days button.sel{color:#00ff41}

.danger{margin-top:14px;color:#ff5555;border-color:#442222}

/* ── Matrix / TODO ── */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.quad{background:#111;border:1px solid #222;padding:14px}
.qh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;border-bottom:1px solid #1a1a1a;padding-bottom:10px;gap:8px}
.qh b{font-size:10px;letter-spacing:.04em;line-height:1.3;font-weight:800;color:#888}
.qh small{letter-spacing:0;font-size:10px;white-space:nowrap;color:#555}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #1a1a1a}
.todo-item:last-child{border:0}
.todo-item.done .ttext{color:#444;text-decoration:line-through}
.tbox{background:none;border:0;padding:6px 6px 6px 0;margin:-6px 0 -6px -2px;color:#fff;line-height:1;font-size:14px;font-weight:800;cursor:pointer}
.ttext{flex:1;font-size:12px;line-height:1.5;word-break:break-word;padding-top:4px;color:#ccc}
.tdel{background:none;border:0;color:#444;font-size:20px;padding:4px 6px;margin:-4px -6px -4px 0;line-height:1;cursor:pointer}
.tdel:active{color:#ff5555}
.qempty{font-size:11px;color:#333}

.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{background:#111;color:#888;border:1px solid #222;padding:14px 10px;font:inherit;font-size:10px;text-align:left;line-height:1.4;letter-spacing:.02em;min-height:48px;font-weight:800}
.seg2 button.sel{color:#00ff41;border-color:#00ff41;background:#111}

/* ── v1.5+ History / Stats ── */
.donegreen{color:#00ff41!important;text-shadow:0 0 12px rgba(0,255,65,.35)}
.card.archived{border-color:#222;opacity:.9}
.archive-label{font-size:10px;color:#444;letter-spacing:.14em;font-weight:800}
.history-group{margin:0 0 24px}
.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#111;border:1px solid #222;padding:16px 14px;margin:0 0 10px;text-align:left;width:100%;color:#e6e6e6;font:inherit;cursor:pointer}
.history-row:active{background:#1a1a1a;border-color:#333}
.history-row b{font-size:13px;font-weight:800}
.history-row small{display:block;margin-top:4px;color:#555}
.history-pct{font-size:18px;font-weight:800;white-space:nowrap;color:#fff}
.section-title{font-size:10px;color:#555;letter-spacing:.18em;margin:24px 0 10px;font-weight:800}
.year-row{display:grid;grid-template-columns:40px 48px 1fr;gap:10px;align-items:center;border-bottom:1px solid #1a1a1a;padding:12px 0;font-size:11px}
.year-row .yp{font-weight:800;text-align:right;color:#fff}
.year-row .yb{font-size:11px;letter-spacing:0;color:#888}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat{background:#111;border:1px solid #222;padding:16px}
.stat small{display:block;margin-bottom:8px;letter-spacing:.1em;color:#555;font-weight:800}
.stat b{font-size:22px;font-weight:800;color:#fff}
.readonly{border-top:1px solid #222;border-bottom:1px solid #222;padding:10px 0;margin:0 0 18px;font-size:10px;letter-spacing:.14em;color:#444;font-weight:800}

/* ── v1.6+ refinements ── */
.todayline{display:flex;justify-content:space-between;align-items:center;margin:-4px 0 18px;color:#555;font-size:10px;letter-spacing:.08em;font-weight:800}
.tap-hint{color:#444;font-size:9px;letter-spacing:.06em}
.archive-current{border-left:3px solid #00ff41}
.detail-card{background:#111;border:1px solid #222;padding:16px;margin-bottom:12px}
.detail-card .big{font-size:28px;font-weight:800;color:#fff}
.mini-bar{font-size:13px;letter-spacing:1px;margin-top:10px;color:#00ff41;font-weight:800}
.green{color:#00ff41!important;text-shadow:0 0 10px rgba(0,255,65,.3)}

/* ── v1.7 Terminal additions ── */
.sysline{font-size:11px;color:#444;letter-spacing:.08em;font-weight:800;margin-bottom:8px}
.sysline .sysvar{color:#00ff41}
.prompt-line{font-size:13px;color:#555;margin-bottom:16px;font-weight:800;letter-spacing:.04em}
.prompt-line .path{color:#00ff41}

/* ── Swipe transition ── */
.view-wrap{transition:transform .12s ease-out,opacity .12s ease-out}
.view-wrap.swipe-left{transform:translateX(-30px);opacity:.6}
.view-wrap.swipe-right{transform:translateX(30px);opacity:.6}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#222}
::-webkit-scrollbar-thumb:hover{background:#333}

/* ── v1.8 additions ── */
.status-tag{display:inline-block;font-size:9px;letter-spacing:.14em;padding:2px 7px;border:1px solid #4a4a4a;color:#888;margin-left:8px;vertical-align:2px}
.status-tag.current{border-color:#69ff69;color:#69ff69}
.status-tag.future{border-color:#7a7a7a;color:#999}
.periodnav{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;gap:10px}
.periodnav button{font-size:26px;color:#e6e6e6;background:none;border:1px solid #4a4a4a;padding:2px 16px;min-height:44px;transition:background .1s}
.periodnav button:active{background:#252525}
.periodnav .pmid{flex:1;text-align:center;font-size:13px;letter-spacing:.06em;font-weight:800}
.periodnav .pmid small{display:block;font-weight:400;margin-top:3px;letter-spacing:.02em}
.completebar{border:1px solid #4a4a4a;padding:14px;margin:0 0 16px;text-align:center}
.completebar .cbig{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.01em}
.completebar .cstat{font-size:11px;letter-spacing:.16em;margin-top:8px}
.completebar.done{border-color:#69ff69}
.completebar.done .cbig,.completebar.done .cstat{color:#69ff69;text-shadow:0 0 8px rgba(105,255,105,.3)}
.weekrows{margin:0 0 8px}
.weekrow{display:grid;grid-template-columns:42px 1fr 42px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #2a2a2a;font-size:12px}
.weekrow:last-child{border:0}
.weekrow .wlabel{color:#999;letter-spacing:.04em}
.weekrow .wbar{letter-spacing:1px;color:#69ff69;font-size:13px;white-space:nowrap;overflow:hidden}
.weekrow .wpct{text-align:right;font-weight:800}
.weekrow.cur .wlabel{color:#69ff69}
.cmp-row{display:grid;grid-template-columns:1fr 60px 60px;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid #2a2a2a;font-size:13px}
.cmp-row .cmp-m{letter-spacing:.06em}
.cmp-row .cmp-p{text-align:right;font-weight:800}
.cmp-row .cmp-d{text-align:right;font-size:11px;color:#888}
.cmp-row .cmp-d.up{color:#69ff69}
.cmp-row .cmp-d.down{color:#c88}
.superlate{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:6px 0;font-size:11px;letter-spacing:.04em;color:#999}
.superlate b{color:#e6e6e6}
.heatmap{margin:6px 0 10px}
.heat-row{display:grid;grid-template-columns:40px 1fr 38px;gap:9px;align-items:center;padding:6px 0;font-size:12px}
.heat-row .hm{color:#999;letter-spacing:.04em}
.heat-row .hbar{letter-spacing:1px;font-size:13px;white-space:nowrap;overflow:hidden}
.heat-row .hp{text-align:right;font-weight:800;font-size:11px}
.habit-pick{display:block;width:100%;text-align:left;background:#202020;border:1px solid #4a4a4a;color:#e6e6e6;padding:13px;margin:0 0 8px;font:inherit;font-size:13px;transition:background .1s}
.habit-pick:active{background:#292929}
.habit-hist-row{display:grid;grid-template-columns:52px 1fr 44px;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid #2a2a2a;font-size:12px}
.habit-hist-row .hh-m{color:#999}
.habit-hist-row .hh-bar{letter-spacing:1px;color:#69ff69;font-size:12px;white-space:nowrap;overflow:hidden}
.habit-hist-row .hh-p{text-align:right;font-weight:800}
/* v1.9: flexible habit cards on TODAY read as optional */
.card.flex{border-style:dashed;border-color:#4a4a4a}
.card.flex .mbar{color:#888}
.card.flex.flexdone{border-color:#4ea84e}
.card.flex.flexdone .mbar{color:#69ff69}
/* v2.0: limit habit cards (fewer = better) */
.seg.seg4{grid-template-columns:repeat(4,1fr)}
.card.limit{border-color:#4ea84e}
.card.limit.limitedge{border-color:#c9a94e}
.card.limit.limitover{border-color:#c85a5a}
.chk.limitred{color:#ff6b6b}
.counter.limitctr{margin-top:12px}
.counter.limitctr button{font-size:28px;min-width:64px}
.counter.limitctr b{font-size:15px}
.card.limit:active{background:#2d2d2d}
.meta .since{letter-spacing:.06em;color:#9a9a9a}
.card.limit.limitover .meta .since{color:#c88}
/* v2.2: limit states + zero-confirm */
.card.limit.limitopen{border-color:#4a4a4a;border-style:dashed}
.chk.limitopen-b{color:#777}
.zerobtn{margin-top:10px;min-height:44px;font-size:10px;border-color:#4a4a4a;color:#bbb}
.zerobtn.zeroon{border-color:#4ea84e;color:#69ff69}
.zerobtn:active{background:#232323}
/* v2.2: quick capture + inbox + bucket picker */
.quickrow{display:flex;gap:8px;margin:0 0 14px}
.quickrow input{flex:1;background:#1c1c1c;border:1px solid #5a5a5a;color:#fff;padding:14px;font:inherit;font-size:16px}
.quickrow button{width:58px;background:#1c1c1c;border:1px solid #5a5a5a;color:#e6e6e6;font:inherit;font-size:22px;font-weight:800}
.quickrow button:active{background:#292929}
.quad.inbox{margin:0 0 14px;border-color:#6a6a6a}
.quad.inbox .qh b{font-size:11px;letter-spacing:.1em}
.tmove{background:none;border:0;color:#888;font-size:17px;padding:4px 6px;margin:-4px -4px -4px 0;line-height:1}
.ttext{cursor:pointer}
.tpick{display:flex;flex-wrap:wrap;gap:5px;padding:7px 0 10px}
.tpick button{background:#1c1c1c;border:1px solid #5a5a5a;color:#ddd;font:inherit;font-size:9px;padding:9px 8px;min-height:38px;letter-spacing:.04em}
.tpick button.sel{border-color:#69ff69;color:#69ff69;font-weight:800}
.tpick .tpdel{border-color:#6b3f3f;color:#e6a5a5;margin-left:auto}
/* ── v2.6: Eisenhower-Matrix — vier Quadranten auf einem Bildschirm ──
   Wichtigkeit wird über Dunkelheit codiert: I am dunkelsten, IV am hellsten.
   Dazu ein gedämpfter Farbakzent je Quadrant für die schnelle Orientierung. */
.todoscreen{height:calc(100dvh - 92px);max-width:640px;margin:auto;
  padding:14px 14px 0;display:flex;flex-direction:column;gap:9px}
@supports not (height: 100dvh){ .todoscreen{height:calc(100vh - 92px)} }
.tdhead{flex:0 0 auto}
.tdhead .brand{font-size:10px;letter-spacing:.2em;color:#777}
.tdstat{display:flex;justify-content:space-between;align-items:baseline;
  margin-top:5px;padding-bottom:7px;border-bottom:1px solid #4a4a4a}
.tdtitle{font-size:14px;font-weight:800;letter-spacing:.14em;display:flex;align-items:center;gap:6px}
.tdnums{font-size:10px;letter-spacing:.08em;color:#8a8a8a}
.todoscreen .quickrow{flex:0 0 auto;margin:0}
.todoscreen .quickrow input{padding:11px 12px;font-size:16px}
.todoscreen .quickrow button{width:50px;font-size:20px}
/* Eingang: kompakt, wächst nur bis zu einer festen Höhe */
.quad.inbox{flex:0 0 auto;max-height:118px;display:flex;flex-direction:column;
  margin:0;border-color:#6e6e6e;background:#1a1a1a}
.quad.inbox .qbody{flex:1;min-height:0;overflow-y:auto;max-height:none}
.quad.inbox .qnum{color:#69ff69}
/* Die Matrix nimmt den gesamten verbleibenden Platz ein */
.matrix{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:7px;margin:0 0 9px}
.quad{display:flex;flex-direction:column;min-height:0;overflow:hidden;
  border:1px solid #4a4a4a;padding:0;background:#212121}
.qh2{flex:0 0 auto;display:grid;grid-template-columns:14px 1fr auto;gap:6px;align-items:center;
  padding:7px 8px 6px;border-bottom:1px solid rgba(255,255,255,.07)}
.qnum{font-size:10px;font-weight:800;text-align:center;line-height:1}
.qlab{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.qlab b{font-size:8.5px;font-weight:800;letter-spacing:.07em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qlab i{font-size:8px;font-style:normal;letter-spacing:.05em;color:#8a8a8a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qcount{font-size:11px;font-weight:800;min-width:12px;text-align:right}
.qbody{flex:1;min-height:0;overflow-y:auto;padding:3px 8px 7px}
/* Quadrant I — wichtigste, dunkelste Fläche, roter Akzent */
.quad.q1{background:#0d0d0d;border-color:#7a4a4a}
.quad.q1 .qnum,.quad.q1 .qcount,.quad.q1 .qlab b{color:#e88}

<script>
/* INHALT
     1. KONFIGURATION
     2. HILFSFUNKTIONEN
     3. SPEICHER & INDEX
     4. ZUSTAND
     5. BERECHNUNG
     6. ANZEIGE
     7. ANIMATION
     8. AKTIONEN
     9. NAVIGATION & EINGABE
     10. TIMER & OFFLINE
     11. START
*/

/* ══════════════════════════════════════════════════════════════════
   1. KONFIGURATION
   Feste Werte: Speicher-Schlüssel, Version, Tagesgrenze, Reiter, Grenzwerte.
   ══════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
   HABITDOS v3.2 — Terminal Habit Tracker
   ═══════════════════════════════════════════════════════════════ */

const HKEY="habitdos.v1_5.habits",RKEY="habitdos.v1_5.records",TKEY="habitdos.v1_5.todos",MEM={};
const SCROLLKEY="habitdos.v1_7.scroll";
const APP_VERSION="3.2";
/* ── v3.1: Serien, die den Habit-Typ respektieren ──
   Täglich / feste Tage : zählt fällige Tage; nicht fällige Tage werden
                          übersprungen, ein heute noch offener Tag bricht nicht.
   Flexibel (x/Woche)   : zählt Wochen mit erreichtem Ziel; die laufende
                          Woche bricht nicht, solange sie noch offen ist.
   Limit                : zählt erfasste Tage unter dem Limit; nicht erfasste
                          Tage sind neutral (weder Erfolg noch Bruch).
   Ein Wechsel des Habit-Typs (über die Versionierung) beendet eine Serie.
   Alle Schleifen haben eine harte Obergrenze. */
const STREAK_GUARD=3650;
/* ── v2.5: Der Tag wechselt um 03:00 Uhr, nicht um Mitternacht ──
   Alles zwischen 00:00 und 02:59 zählt noch zum Vortag. Die Umrechnung
   passiert an genau dieser Stelle; alle übrigen Berechnungen benutzen
   today() und logicalDay() und sind dadurch automatisch richtig. */
const DAY_ROLLOVER_HOUR=3;
const NO_RECS=[];
const TAB_ORDER = ["today","todo","week","month","history","habits","stats"];
const MORE_TABS = ["history","habits","stats"];
/* v2.1 (A2/A3): sanitize & validate an imported backup before it touches app state. */
const VALID_TYPES=["daily","times","days","limit"];
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/;
const SWIPE_THRESHOLD=60;  // min horizontal px
const SWIPE_MAX_Y=80;      // max vertical drift
const SWIPE_MAX_TIME=400;  // max duration ms

/* v2.2: completed todos disappear 24 hours after they were ticked. */
const TODO_KEEP_MS=24*60*60*1000;
/* ══════════════════════════════════════════════════════════════════
   2. HILFSFUNKTIONEN
   Datum, Text, IDs — reine Funktionen ohne Zugriff auf App-Daten.
   ══════════════════════════════════════════════════════════════════ */

const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0");

const uid=()=>Date.now()+"-"+Math.random().toString(36).slice(2);
const cloneFreq=f=>JSON.parse(JSON.stringify(f));
const isoDate=d=>k(d);

function isFuture(d){return isoDate(d)>isoDate(today())}
const day=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const k=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const add=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return day(x)};
const mon=d=>{let x=day(d),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x};
// Rechnet einen echten Zeitpunkt auf den Tag um, zu dem er zählt.
// v3.1: in Ortszeit rechnen, nicht in Millisekunden — sonst ist die Stunde nach
// der Sommerzeitumstellung (29.03., 03:00–03:59) dem Vortag zugeordnet.
const logicalDay=d=>{const x=day(d);return d.getHours()<DAY_ROLLOVER_HOUR?add(x,-1):x};
const today=()=>logicalDay(new Date()),weekdays=["SO","MO","DI","MI","DO","FR","SA"];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function bar(done,target,w=14){
  if(!target)return"·".repeat(w);
  let f=Math.max(0,Math.min(w,Math.round((done/target)*w)));
  return "█".repeat(f)+"░".repeat(w-f);
}
/* ── v2.4: Animationen ──
   Alle Effekte laufen NACH dem Rendern auf dem fertigen DOM und verändern
   niemals Daten. Bei aktivierter Systemeinstellung "Bewegung reduzieren"
   werden sie komplett übersprungen. */
function barFill(done,target,w){
  if(!target)return -1;                       // -1 = "keine Daten" (Punkte-Balken)
  return Math.max(0,Math.min(w,Math.round((done/target)*w)));
}
function week(d){let m=mon(d);return Array.from({length:7},(_,i)=>add(m,i))}
function monthDays(m){
  let n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  return Array.from({length:n},(_,i)=>new Date(m.getFullYear(),m.getMonth(),i+1));
}

function weekNumber(d){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));
  const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));
  return Math.ceil((((x-y)/86400000)+1)/7);
}

/* v3.1: echtes Kalenderdatum, nicht nur das Format — "2026-13-99" passte
   bisher durch. Ein gültiges Datum übersteht Hin- und Rückumwandlung. */
const isValidDateKey=s=>DATE_RE.test(String(s))&&k(parse(String(s)))===String(s);
/* ══════════════════════════════════════════════════════════════════
   3. SPEICHER & INDEX
   localStorage lesen/schreiben, Fehlererkennung, O(1)-Index über records.
   ══════════════════════════════════════════════════════════════════ */

function getStore(k,f){try{let v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}try{let v=sessionStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}return MEM[k]??f}
// v3.1: Speicherfehler (voll/blockiert) werden gemeldet statt verschluckt.
// Die frühere sessionStorage-Kopie entfällt: sie verdoppelte den Platzbedarf
// und wird beim Schließen ohnehin verworfen.
let storageFailed=false;
function putStore(k,v){
  MEM[k]=v;
  try{localStorage.setItem(k,JSON.stringify(v));storageFailed=false;return true}
  catch(e){storageFailed=true;return false}
}

/* v3.1: vor den Zustandsvariablen deklariert — save() wird schon beim Laden gebraucht */
let _recIdx=null,_recIdxRef=null,_recIdxLen=-1;
function save(){invalidateRecIndex();putStore(HKEY,habits);putStore(RKEY,records);putStore(TKEY,todos)}

/* v3.1: Index über records — Zugriff in O(1) statt linearer Suche.
   Schlüssel "habitId|YYYY-MM-DD" -> LISTE von Einträgen (es kann aus älteren
   Versionen/Importen mehrere pro Tag geben; die Liste erhält die bisherige
   Semantik von records.some/find exakt).
   Der Index verweist auf dieselben Objekte wie records: Feldänderungen
   (r.ok, r.count) sind sofort sichtbar. Neu aufgebaut wird nur, wenn sich die
   Menge ändert — erkannt über save() und zusätzlich über Identität/Länge. */
function invalidateRecIndex(){_recIdx=null}
function recIndex(){
  if(_recIdx&&_recIdxRef===records&&_recIdxLen===records.length)return _recIdx;
  _recIdx=new Map();
  for(const r of records){
    const key=r.h+"|"+r.d;
    const list=_recIdx.get(key);
    if(list)list.push(r);else _recIdx.set(key,[r]);
  }
  _recIdxRef=records;_recIdxLen=records.length;
  return _recIdx;
}
function recsFor(h,d){return recIndex().get(h.id+"|"+k(d))||NO_RECS}
/* ══════════════════════════════════════════════════════════════════
   4. ZUSTAND
   Alle veränderlichen Variablen der App an einem Ort.
   ══════════════════════════════════════════════════════════════════ */

let animPrev={};              // zuletzt gezeigte Werte je Element-Schlüssel
let justToggledId=null;       // Habit, der gerade angetippt wurde
let prevDayDone=null;         // war der Tag beim letzten Rendern schon komplett?

let habits=getStore(HKEY,null)||[
  {id:uid(),name:"Lesen",freq:{type:"daily"},arch:false},
  {id:uid(),name:"Sport",freq:{type:"times",count:3},arch:false},
  {id:uid(),name:"Wasser",freq:{type:"daily"},arch:false},
  {id:uid(),name:"Meditieren",freq:{type:"times",count:3},arch:false}
];
let records=getStore(RKEY,[])||[],todos=getStore(TKEY,[])||[];
let tab="today",prevTab=null;
let month=new Date(today().getFullYear(),today().getMonth(),1);
let viewedWeek=mon(today());   // v1.8: navigable week in WEEK tab
let historyYear=today().getFullYear();
let historyMonthDate=new Date(today().getFullYear(),today().getMonth(),1);
let historyWeekDate=mon(today());

/* Per-habit monthly history (16) */
let historyHabitId=null;
/* ── Swipe Navigation ── */
let touchStartX=0,touchStartY=0,touchStartTime=0,touchBlocked=false;
let lastRenderedTab=null;
let pickerTodoId=null;
/* ── Habit Editor ── */
let editId=null,editFreq={type:"daily"},editDays=[];

/* ── Init ── */
/* v2.1 (B5): keep the "time since last count" label fresh without a full re-render */
let sinceTimer=null;
let lastSeenDay=null;
/* ── v2.3: Offline-Betrieb via Service Worker ──
   Nach dem ersten Laden liegt die App auf dem Gerät und startet ohne Netz.
   Schlägt die Registrierung fehl (z.B. bei file:// oder ohne HTTPS), läuft
   alles unverändert weiter — nur eben ohne Offline-Start. */
let swState = "unsupported";
/* ══════════════════════════════════════════════════════════════════
   5. BERECHNUNG
   Fachlogik: Fälligkeit, Fortschritt, Limits, Serien, Statistik. Liest Daten, ändert nichts.
   ══════════════════════════════════════════════════════════════════ */

function freqForDate(h,d){
  if(h.versions&&h.versions.length){
    let best=h.versions[0];
    h.versions.forEach(v=>{if(v.from<=isoDate(d)&&v.from>=best.from)best=v});
    return best.freq;
  }
  return h.freq;
}
function dueWithFreq(freq,d){
  if(freq.type==="daily")return true;
  if(freq.type==="times")return true;
  if(freq.type==="limit")return true;
  return Array.isArray(freq.days)&&freq.days.includes(d.getDay()+1);
}
function weekBelongsToMonth(d,m){
  return mon(d).getMonth()===m.getMonth() && mon(d).getFullYear()===m.getFullYear();
}
function monthWeekStarts(m){
  const first=monthDays(m)[0], last=monthDays(m).at(-1);
  let out=[], w=mon(first);
  while(w<=last){
    if(weekBelongsToMonth(w,m))out.push(new Date(w));
    w=add(w,7);
  }
  return out;
}
function weekProgVersioned(h,d){
  const ds=week(d), groups={};
  ds.forEach(x=>{
    const f=freqForDate(h,x), key=JSON.stringify(f);
    (groups[key]??={freq:f,days:[]}).days.push(x);
  });
  let doneN=0,target=0;
  Object.values(groups).forEach(g=>{
    if(g.freq.type==="times"){
      const n=g.days.filter(x=>done(h,x)).length;
      doneN+=Math.min(n,g.freq.count); target+=g.freq.count;
    }else if(g.freq.type==="limit"){
      // v2.1 (A4): only evaluate days that were actually tracked and not in the future.
      const days=g.days.filter(x=>!isFuture(x)&&limitEvaluated(h,x));
      doneN+=days.filter(x=>limitOk(h,x)).length; target+=days.length;
    }else{
      const dueDays=g.freq.type==="daily"?g.days:g.days.filter(x=>dueWithFreq(g.freq,x));
      doneN+=dueDays.filter(x=>done(h,x)).length; target+=dueDays.length;
    }
  });
  return {done:doneN,target};
}
function habitStartDay(h){
  let start=null;
  if(h.createdDay)start=parse(h.createdDay);
  else if(h.created){const c=new Date(h.created);if(!isNaN(c))start=logicalDay(c);}
  for(const r of records){
    if(r.h!==h.id||!/^\d{4}-\d{2}-\d{2}$/.test(r.d))continue;
    const d=parse(r.d); if(!start||d<start)start=d;
  }
  return start||today();
}
function dayStreak(h){
  const start=habitStartDay(h), end=today();
  const plain=d=>!isFlexible(h,d)&&!isLimit(h,d);
  let cur=0,d=end,g=0;
  if(due(h,d)&&!done(h,d))d=add(d,-1);                // heute noch offen
  while(g++<STREAK_GUARD&&d>=start&&plain(d)){
    if(due(h,d)){if(!done(h,d))break;cur++}
    d=add(d,-1);
  }
  let best=0,run=0;d=start;g=0;
  while(g++<STREAK_GUARD&&d<=end){
    if(!plain(d))run=0;
    else if(due(h,d)){
      if(done(h,d)){run++;if(run>best)best=run}
      else if(k(d)!==k(end))run=0;                       // heute offen bricht nicht
    }
    d=add(d,1);
  }
  return {current:cur,best:Math.max(best,cur),unit:"T"};
}
function weekStreak(h){
  const start=mon(habitStartDay(h)), curW=mon(today());
  const met=w=>{const p=weekProgVersioned(h,w);return p.target>0&&p.done>=p.target};
  let cur=0,w=curW,g=0;
  if(!met(w))w=add(w,-7);                               // laufende Woche offen
  while(g++<600&&w>=start&&isFlexible(h,w)){if(!met(w))break;cur++;w=add(w,-7)}
  let best=0,run=0;w=start;g=0;
  while(g++<600&&w<=curW){
    if(!isFlexible(h,w))run=0;
    else if(met(w)){run++;if(run>best)best=run}
    else if(k(w)!==k(curW))run=0;
    w=add(w,7);
  }
  return {current:cur,best:Math.max(best,cur),unit:"W"};
}
function limitStreak(h){
  const start=limitStartDate(h), end=today();
  let cur=0,d=end,g=0;
  while(g++<STREAK_GUARD&&d>=start&&isLimit(h,d)){
    if(limitEvaluated(h,d)){if(!limitOk(h,d))break;cur++}
    d=add(d,-1);
  }
  let best=0,run=0;d=start;g=0;
  while(g++<STREAK_GUARD&&d<=end){
    if(!isLimit(h,d))run=0;
    else if(limitEvaluated(h,d)){if(limitOk(h,d)){run++;if(run>best)best=run}else run=0}
    d=add(d,1);
  }
  return {current:cur,best:Math.max(best,cur),unit:"T"};
}
function habitStats(h){
  if(isLimit(h)){
    // For a limit habit, a "successful" day = at or under the max, counted from
    // the first logged day up to today. Streak = consecutive successful days.
    const logged=records.filter(r=>r.h===h.id&&typeof r.count==="number").map(r=>parse(r.d)).sort((a,b)=>a-b);
    const firstDay=logged.length?logged[0]:today();
    const {current,best,unit}=limitStreak(h);
    const overDays=logged.filter(x=>!limitOk(h,x)).length;
    const totalCount=records.filter(r=>r.h===h.id&&typeof r.count==="number").reduce((s,r)=>s+r.count,0);
    let targets=0,fulfilled=0;
    for(let y=firstDay.getFullYear(); y<=today().getFullYear(); y++){
      for(let m=0;m<12;m++){
        const mm=new Date(y,m,1);
        if(mm>today())continue;
        monthWeekStarts(mm).forEach(w=>{const p=weekProgVersioned(h,w);targets+=p.target;fulfilled+=p.done;});
      }
    }
    return {current,best,unit,totalDone:overDays,totalCount,p:targets?Math.round(fulfilled/targets*100):0,limit:true};
  }
  const all=records.filter(r=>r.h===h.id&&r.ok).map(r=>parse(r.d)).sort((a,b)=>a-b);
  const {current,best,unit}=isFlexible(h)?weekStreak(h):dayStreak(h);
  let totalDone=all.length;
  let targets=0,fulfilled=0;
  for(let y=all.length?all[0].getFullYear():today().getFullYear(); y<=today().getFullYear(); y++){
    for(let m=0;m<12;m++){
      const mm=new Date(y,m,1);
      if(mm>today())continue;
      monthWeekStarts(mm).forEach(w=>{
        const p=weekProgVersioned(h,w);
        targets+=p.target; fulfilled+=p.done;
      });
    }
  }
  return {current,best,unit,totalDone,p:targets?Math.round(fulfilled/targets*100):0};
}
function monthProgVersioned(h,m){
  let doneN=0,target=0;
  monthDays(m).forEach(d=>{
    if(isFuture(d))return;
    const f=freqForDate(h,d);
    if(f.type==="limit"){
      if(!limitEvaluated(h,d))return;   // v2.2: only counted or confirmed days are scored
      target++; if(limitOk(h,d))doneN++;
    }else if(f.type!=="times"){
      if(dueWithFreq(f,d)){target++;if(done(h,d))doneN++}
    }
  });
  monthWeekStarts(m).forEach(w=>{
    const ds=week(w).filter(d=>d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear());
    const groups={};
    ds.forEach(x=>{const f=freqForDate(h,x),key=JSON.stringify(f);(groups[key]??={freq:f,days:[]}).days.push(x)});
    Object.values(groups).forEach(g=>{
      if(g.freq.type==="times"){
        target+=g.freq.count;
        doneN+=Math.min(g.days.filter(x=>done(h,x)).length,g.freq.count);
      }
    });
  });
  return {done:doneN,target,p:target?Math.round(doneN/target*100):0};
}
function monthOverall(m){
  const ps=active().map(h=>monthProgVersioned(h,m));
  return total(ps);
}
function yearOverall(y){
  let vals=[];
  for(let m=0;m<12;m++){
    const d=new Date(y,m,1);
    if(d>today())break;
    vals.push({month:d,p:monthOverall(d)});
  }
  return vals;
}

function active(){return habits.filter(h=>!h.arch)}
function due(h,d){return dueWithFreq(freqForDate(h,d),d)}
function done(h,d){return recsFor(h,d).some(r=>r.ok)}

/* ── v2.0/2.1: limit-type habits (fewer = better) ── */
function isLimit(h,d=today()){return freqForDate(h,d).type==="limit";}
function limitMax(h,d=today()){const f=freqForDate(h,d);return f.type==="limit"?(f.max??0):0;}
// daily count for a limit habit (records carry {count} instead of {ok})
function limitCount(h,d){
  const r=recsFor(h,d).find(r=>typeof r.count==="number");
  return r?r.count:0;
}
// v2.1 (A1): the first day a limit habit may be evaluated (first log, else created, else today)
function limitStartDate(h){
  const logged=records
    .filter(r=>r.h===h.id&&typeof r.count==="number")
    .map(r=>r.d).sort();
  if(logged.length)return parse(logged[0]);
  if(h.createdDay)return parse(h.createdDay);            // v2.5: logischer Tag, zeitzonensicher
  if(h.created)return logicalDay(new Date(h.created));   // Rückfall für ältere Einträge
  return today();
}
function limitActiveOn(h,d){return isoDate(d)>=isoDate(limitStartDate(h));}
// A record for this limit habit exists on day d (day was actually tracked)?
/* v2.2: a day is "evaluated" if it was counted (>0) OR explicitly confirmed as zero.
   Untracked days count neither positive nor negative. */
function limitConfirmed(h,d){
  return recsFor(h,d).some(r=>r.confirmed===true);
}
function limitEvaluated(h,d){
  return limitCount(h,d)>0 || limitConfirmed(h,d);
}
// "success" for a limit habit on a day = stayed at or under the max
function limitOk(h,d){return limitCount(h,d)<=limitMax(h,d);}

/* v2.1 (B3): time since the last count, in 5-minute steps */
function limitLastStamp(h){
  const recs=records.filter(r=>r.h===h.id&&Array.isArray(r.ts)&&r.ts.length);
  if(!recs.length)return null;
  let latest=null;
  recs.forEach(r=>r.ts.forEach(s=>{ if(typeof s==="string"&&(!latest||s>latest))latest=s; }));
  return latest?new Date(latest):null;
}
function limitSinceText(h,now=new Date()){
  const last=limitLastStamp(h);
  if(!last||isNaN(last))return "NOCH NICHT ERFASST";
  const rawMin=Math.floor((now-last)/60000);
  if(rawMin<0)return "GERADE EBEN";                       // clock moved back
  const dayDiff=Math.round((logicalDay(now)-logicalDay(last))/86400000);
  if(dayDiff===1)return "GESTERN";
  if(dayDiff>1)return `VOR ${dayDiff} TAGEN`;
  if(rawMin<5)return "GERADE EBEN";
  if(rawMin<60)return `VOR ${Math.floor(rawMin/5)*5} MIN`;
  if(rawMin<90){
    const m=Math.floor((rawMin-60)/5)*5;
    return m?`VOR 1 STD ${m} MIN`:"VOR 1 STD";
  }
  const halfHours=Math.floor(rawMin/30)/2;                // round down to half hours
  return `VOR ${String(halfHours).replace(".",",")} STD`;
}

function total(ps){
  let a=ps.reduce((s,x)=>s+x.done,0),b=ps.reduce((s,x)=>s+x.target,0);
  return{done:a,target:b,p:b?Math.round(a/b*100):0};
}
function dayComplete(d){
  // v2.2: obligations = daily / fixed-weekday habits, plus limit habits that were
  // actually evaluated that day (counted or confirmed as zero). An untracked limit
  // day is neutral: it neither completes nor breaks the day.
  let dueH=active().filter(h=>!isFlexible(h,d)&&due(h,d)
    &&(!isLimit(h,d)||(limitActiveOn(h,d)&&limitEvaluated(h,d))));
  if(!dueH.length)return false;
  return dueH.every(h=>successToday(h,d));
}
function globalStreak(){
  let n=0,d=today(),guard=0;
  while(dayComplete(d) && guard++ < 3650){n++;d=add(d,-1)}   // A1: hard safety cap (~10y)
  return n;
}
/* ── v1.9: TODAY = only today's obligations (Option C) ── */
// A habit is "flexible" if today's active frequency is a weekly-count goal.
function isFlexible(h,d=today()){return freqForDate(h,d).type==="times";}
// v2.0: unified "success today" — limit habits succeed by staying under max.
function successToday(h,d=today()){
  // v2.2: a limit habit only succeeds on a day that was counted or confirmed as zero.
  // An untracked day is neutral (handled by dayComplete/scoring), never an automatic win.
  return isLimit(h,d) ? (limitEvaluated(h,d)&&limitOk(h,d)) : done(h,d);
}
// Obligations = daily + fixed-weekday + limit habits that are due today (not flexible).
function todayObligations(){return active().filter(h=>!isFlexible(h)&&due(h,today()));}
// Flexible habits still open this week (shown as optional chips).
function todayFlexibles(){return active().filter(h=>isFlexible(h));}
// TODAY percentage counts only today's obligations: each is 1 target, success=1/0.
// v2.2: a limit habit joins the target only once it was counted or confirmed.
function todayProgress(){
  const obl=todayObligations().filter(h=>!isLimit(h)||limitEvaluated(h,today()));
  const done_=obl.filter(h=>successToday(h)).length;
  return{done:done_,target:obl.length,p:obl.length?Math.round(done_/obl.length*100):0};
}

function weekStatus(wStart){
  const curW=mon(today());
  if(k(wStart)===k(curW))return"current";
  if(wStart>curW)return"future";
  return"archived";
}
function monthStatus(m){
  const cur=new Date(today().getFullYear(),today().getMonth(),1);
  if(m.getFullYear()===cur.getFullYear()&&m.getMonth()===cur.getMonth())return"current";
  if(m>cur)return"future";
  return"archived";
}
/* overall % for one week restricted to a given month */
function weekOverallInMonth(wStart){
  const ps=active().map(h=>weekProgVersioned(h,wStart));
  return total(ps);
}
/* best & worst overall month across recorded history (12) */
function bestWorstMonths(){
  if(!records.length)return null;
  const dates=records.filter(r=>r.ok).map(r=>parse(r.d));
  if(!dates.length)return null;
  let min=dates[0],max=dates[0];
  dates.forEach(d=>{if(d<min)min=d;if(d>max)max=d;});
  let vals=[];
  let m=new Date(min.getFullYear(),min.getMonth(),1);
  const end=new Date(today().getFullYear(),today().getMonth(),1);
  while(m<=end){
    const o=monthOverall(m);
    if(o.target>0)vals.push({label:m.toLocaleDateString("de-DE",{month:"short",year:"numeric"}).toUpperCase(),p:o.p});
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  if(!vals.length)return null;
  let best=vals[0],worst=vals[0];
  vals.forEach(v=>{if(v.p>best.p)best=v;if(v.p<worst.p)worst=v;});
  return{best,worst};
}

function historyWeeks(y){
  let out=[];
  const start=new Date(y,0,1), end=new Date(y,11,31), w=mon(start);
  for(let d=new Date(w);d<=end;d=add(d,7)){
    if(d<today() && d.getFullYear()===y && d.getMonth()>=0) out.push(d);
  }
  return out.reverse();
}

/* v1.8: all-time aggregate metrics */
function allTimeStats(){
  const okRecs=records.filter(r=>r.ok);
  const checks=okRecs.length;
  if(!checks)return{checks:0,p:0,bestStreak:0,weeks100:0,months100:0};
  const dates=okRecs.map(r=>parse(r.d));
  let min=dates[0];dates.forEach(d=>{if(d<min)min=d});
  let targets=0,fulfilled=0,weeks100=0,months100=0;
  const acts=active();
  // iterate months from first record to current
  let m=new Date(min.getFullYear(),min.getMonth(),1);
  const end=new Date(today().getFullYear(),today().getMonth(),1);
  while(m<=end){
    const mo=monthOverall(m);
    if(mo.target>0){targets+=mo.target;fulfilled+=mo.done;if(mo.p===100)months100++;}
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  // count 100% weeks
  let w=mon(min);
  const wend=mon(today());
  while(w<=wend){
    const wo=total(acts.map(h=>weekProgVersioned(h,w)));
    if(wo.target>0&&wo.p===100)weeks100++;
    w=add(w,7);
  }
  const bestStreak=acts.reduce((a,h)=>Math.max(a,habitStats(h).best),0);
  return{checks,p:targets?Math.round(fulfilled/targets*100):0,bestStreak,weeks100,months100};
}

  if(f.type==="times")return`${f.count}× / WOCHE · FLEXIBEL`;
  if(f.type==="limit")return`MAX ${f.max}× / TAG · LIMIT`;

function mark(h,d){
  if(isLimit(h,d)){
    const c=limitCount(h,d), mx=limitMax(h,d);

    if(!rec)return'<span class="chk na">·</span>';

  if(f.type==="limit")return`${limitCount(h,today())}/${f.max} HEUTE`;

}

                      : (conf&&c===0 ? 'BESTÄTIGT: 0 HEUTE'

        ? `<button class="wide zerobtn${conf?' zeroon':''}" data-act="limitZeroById" data-id="${esc(h.id)}">${conf?'✓ 0 BESTÄTIGT — TIPPEN ZUM WIDERRUFEN':'0 BESTÄTIGEN'}</button>`

    }).join("")}`;
  }
  return`<main>${header("TODAY",new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(today()))}${streakLine}<div class="hero"><div class="hero-top"><small>TODAY</small><span class="hero-pct" data-pct="${x.p}" data-suffix="%">${x.p}%</span></div><div class="hero-bar" data-fill="${barFill(x.done,x.target,20)}" data-w="20">${bar(x.done,x.target,20)}</div><div class="hero-sub">${heroSub}</div></div>${milestoneBanner(streak)}${sofortSection()}${oblCards}${flexBlock}<button class="wide" onclick="editor()">+ HABIT HINZUFÜGEN</button></main>`;

  const firstY=okRecs.length?Math.min(...okRecs.map(d=>d.getFullYear())):today().getFullYear();

  let yearsBlocks="";

function quadrant(q){
  const items=todos.filter(t=>t.q===q).sort((a,b)=>(a.done===b.done)?0:a.done?1:-1);

  const [l1,l2]=qshort(q);
  return`<div class="quad q${q}">`+
    `<div class="qh2"><span class="qnum">${qroman(q)}</span>`+
      `<span class="qlab"><b>${l1}</b><i>${l2}</i></span>`+

    `<div class="qbody">${items.length?items.map(t=>todoRow(t)).join(""):'<div class="qempty">–</div>'}</div>`+
  `</div>`;
}

function tabs(){

  /* v3.0: drei eindeutige Zustände statt zwei.
     sel = grün, das ist gerade angetippt/aktiv

  const mainBtns=main.map(x=>{

function render(){
  // v2.2: keep the current scroll position when re-rendering the SAME tab
  // (checking a habit, counting a cigarette, ticking a todo). Only a real tab
  // change restores that tab's stored position.
  const sameTab = (lastRenderedTab===tab);
  const keepY = sameTab ? window.scrollY : null;
  let html="";
  switch(tab){
    case "today":html=todayView();break;
    case "todo":html=todoView();break;
    case "week":html=weekView();break;
    case "month":html=monthView();break;
    case "history":html=historyView();break;
    case "historyWeek":html=archivedWeekView(historyWeekDate);break;
    case "historyMonth":html=archivedMonthView(historyMonthDate);break;
    case "habits":html=habitsView();break;
    case "stats":html=statsView();break;
    case "habitHistory":html=habitHistoryView();break;
    default:html=todayView();
  }
  // v3.1: fehlgeschlagenes Speichern sichtbar machen
  const warn=storageFailed?'<div class="storewarn">! SPEICHERN FEHLGESCHLAGEN — bitte über HABITS → DATEN EXPORTIEREN sichern</div>':'';
  document.body.innerHTML=warn+html+tabs();
  lastRenderedTab=tab;
  if(keepY!==null){
    window.scrollTo(0,keepY);
    requestAnimationFrame(()=>window.scrollTo(0,keepY));
  }else{
    restoreScroll();
  }
  try{runAnimations()}catch(e){}   // v2.4: Animationen dürfen nie die App blockieren
}

/* ══════════════════════════════════════════════════════════════════
   7. ANIMATION
   Effekte nach dem Rendern. Ändern nie Daten, respektieren 'Bewegung reduzieren'.
   ══════════════════════════════════════════════════════════════════ */

function reducedMotion(){
  try{return window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}
  catch(e){return false}
}
function animateNumber(el,from,to,suffix,ms){
  if(from===to||!(ms>0)){el.textContent=to+suffix;return}
  const start=performance.now();
  let frames=0;
  function step(now){
    const p=Math.min(1,(now-start)/ms);
    const eased=1-Math.pow(1-p,3);            // schnell anlaufen, sanft auslaufen
    el.textContent=Math.round(from+(to-from)*eased)+suffix;
    // Sicherheitsnetz: endet auch, falls die Zeitquelle nicht fortschreitet
    if(p<1&&++frames<120)requestAnimationFrame(step);
    else el.textContent=to+suffix;
  }
  requestAnimationFrame(step);
}
function animateBar(el,from,to,w,ms){
  if(from===to||from<0||to<0){return}
  const steps=Math.abs(to-from);
  const per=Math.max(40,Math.min(90,ms/Math.max(1,steps)));
  let cur=from;
  const dir=to>from?1:-1;
  function tick(){
    cur+=dir;
    el.textContent="█".repeat(Math.max(0,cur))+"░".repeat(Math.max(0,w-cur));
    if(cur!==to)setTimeout(tick,per);
  }
  el.textContent="█".repeat(Math.max(0,from))+"░".repeat(Math.max(0,w-from));
  setTimeout(tick,per);
}
function animateCheckbox(wrap){
  const el=wrap.querySelector(".chk")||wrap;   // Farbklasse muss erhalten bleiben
  const final=el.textContent;
  if(final.indexOf("X")<0)return;              // nur beim Abhaken, nicht beim Lösen
  el.textContent="[·]";
  setTimeout(()=>{el.textContent=final},110);
}
function showDayComplete(streak){
  if(document.querySelector(".dayoverlay"))return;
  const ov=document.createElement("div");
  ov.className="dayoverlay";
  ov.innerHTML=`<div class="dobox"><div class="doline">&gt; TAG ABGESCHLOSSEN</div>`+
    `<div class="dobar">${"█".repeat(20)}</div>`+
    `<div class="dopct">100%</div>`+
    (streak>=2?`<div class="dostreak">SERIE: ${streak} TAGE</div>`:"")+
    `<div class="docur"><span class="cursor"></span></div></div>`;
  ov.addEventListener("click",()=>ov.remove());
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add("on"));
  setTimeout(()=>{ov.classList.remove("on");setTimeout(()=>ov.remove(),260)},1700);
}
function runAnimations(){
  const skip=reducedMotion();
  // 1) Prozentzahl hochzählen
  document.querySelectorAll(".hero-pct[data-pct]").forEach(el=>{
    const to=Number(el.getAttribute("data-pct"));
    const suffix=el.getAttribute("data-suffix")||"";
    const key="pct:"+tab;
    const from=(animPrev[key]==null)?to:animPrev[key];
    animPrev[key]=to;
    if(!skip)animateNumber(el,from,to,suffix,420);
    else el.textContent=to+suffix;
  });
  // 2) Balken füllen
  document.querySelectorAll(".hero-bar[data-fill]").forEach(el=>{
    const to=Number(el.getAttribute("data-fill"));
    const w=Number(el.getAttribute("data-w"))||20;
    const key="bar:"+tab;
    const from=(animPrev[key]==null)?to:animPrev[key];
    animPrev[key]=to;
    if(!skip)animateBar(el,from,to,w,320);
  });
  // 3) Kästchen-Mikroanimation auf dem gerade angetippten Habit
  if(justToggledId&&!skip){
    const el=document.querySelector(`[data-habit-chk="${CSS&&CSS.escape?CSS.escape(justToggledId):justToggledId}"]`);
    if(el)animateCheckbox(el);
  }
  justToggledId=null;
  // 4) Tagesabschluss — nur beim Übergang auf 100 %, nicht bei jedem Öffnen
  if(tab==="today"){
    const p=todayProgress();
    const nowDone=(p.target>0&&p.p===100);
    if(prevDayDone===false&&nowDone&&!skip)showDayComplete(globalStreak());
    prevDayDone=nowDone;
  }
}
/* ══════════════════════════════════════════════════════════════════
   8. AKTIONEN
   Alles, was Daten verändert: Abhaken, Zählen, Aufgaben, Editor, Import/Export.
   ══════════════════════════════════════════════════════════════════ */

// Confirm a zero-day (or un-confirm it again)
function limitConfirmZero(h,d=today()){
  const key=k(d);
  let i=records.findIndex(r=>r.h===h.id&&r.d===key&&(typeof r.count==="number"||r.confirmed===true));
  if(i>=0){
    if(records[i].confirmed){                       // toggle off
      if(!records[i].count)records.splice(i,1);
      else delete records[i].confirmed;
    }else records[i].confirmed=true;
  }else{
    records.push({h:h.id,d:key,count:0,confirmed:true});
  }
  save();render();
}

// v2.1 (B2): +1 appends a timestamp
function limitInc(h,d=today()){
  const key=k(d);
  let i=records.findIndex(r=>r.h===h.id&&r.d===key&&typeof r.count==="number");
  const stamp=new Date().toISOString();
  if(i>=0){
    records[i].count=records[i].count+1;
    if(records[i].confirmed)delete records[i].confirmed;   // v2.2: real count supersedes "confirmed 0"
    (records[i].ts??=[]).push(stamp);
  }
  else records.push({h:h.id,d:key,count:1,ts:[stamp]});
  save();render();
}
// v2.1 (B2): -1 removes the most recent timestamp
function limitDec(h,d=today()){
  const key=k(d);
  let i=records.findIndex(r=>r.h===h.id&&r.d===key&&typeof r.count==="number");
  if(i<0)return;
  const next=Math.max(0,records[i].count-1);
  if(next===0&&!records[i].confirmed){ records.splice(i,1); }
  else{
    records[i].count=next;
    if(Array.isArray(records[i].ts)&&records[i].ts.length){records[i].ts.sort();records[i].ts.pop();}
  }
  save();render();
}
function toggle(h,d=today()){
  if(isLimit(h,d))return;                                 // A5: never write ok on a limit habit
  if(!due(h,d))return;
  let i=records.findIndex(r=>r.h===h.id&&r.d===k(d));
  if(i>=0)records[i].ok=!records[i].ok;
  else records.push({h:h.id,d:k(d),ok:true});
  save();render();
}

  if(again){try{again.focus({preventScroll:true})}catch(e){again.focus()}}   // stay in the field
}

function normalizeImportedHabit(h){
  if(!h||typeof h!=="object")return null;
  const out={
    id:String(h.id||""),                       // real sanitizing happens in sanitizeImport
    name:String(h.name==null?"Unbenannt":h.name).slice(0,120),
    arch:!!h.arch,
    created:(typeof h.created==="string"&&h.created)?h.created:new Date().toISOString()
  };
  if(typeof h.createdDay==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(h.createdDay))out.createdDay=h.createdDay;
  let f=(h.freq&&VALID_TYPES.includes(h.freq.type))?h.freq:{type:"daily"};
  if(f.type==="times")f={type:"times",count:Math.max(1,Math.min(7,Number(f.count)||3))};
  else if(f.type==="limit")f={type:"limit",max:Math.max(0,Math.min(99,Number(f.max)??5))};
  else if(f.type==="days"){
    const days=Array.isArray(f.days)?[...new Set(f.days.filter(n=>n>=1&&n<=7))].sort((a,b)=>a-b):[];
    f=days.length?{type:"days",days}:{type:"daily"};
  }else f={type:"daily"};
  out.freq=f;
  out.versions=(Array.isArray(h.versions)?h.versions.filter(v=>v&&v.from&&v.freq&&VALID_TYPES.includes(v.freq.type)):[]);
  if(!out.versions.length)out.versions=[{from:"2000-01-01",freq:cloneFreq(f)}];
  return out;
}
function sanitizeImport(x){
  const idMap={}, safe=s=>String(s).replace(/[^A-Za-z0-9._-]/g,"");
  let dropped=0;
  // habits
  const habs=[];
  (Array.isArray(x.habits)?x.habits:[]).forEach(raw=>{
    const h=normalizeImportedHabit(raw);
    if(!h){dropped++;return;}
    const old=String(raw&&raw.id!=null?raw.id:"");
    let nid=safe(old);
    if(!nid||idMap[old]!==undefined||habs.some(e=>e.id===nid))nid=uid();
    idMap[old]=nid; h.id=nid;
    habs.push(h);
  });
  const validIds=new Set(habs.map(h=>h.id));
  // records
  const recs=[];
  (Array.isArray(x.records)?x.records:[]).forEach(r=>{
    if(!r||typeof r!=="object"){dropped++;return;}
    let hid=idMap[String(r.h)]??safe(r.h);
    if(!validIds.has(hid)){dropped++;return;}
    if(!isValidDateKey(r.d)){dropped++;return;}
    const out={h:hid,d:String(r.d)};
    if(typeof r.count==="number"&&isFinite(r.count)){
      out.count=Math.max(0,Math.floor(r.count));
      if(Array.isArray(r.ts)){
        const ts=r.ts.filter(s=>typeof s==="string"&&!isNaN(Date.parse(s)));
        if(ts.length)out.ts=ts;
      }
    }else{
      out.ok=!!r.ok;
    }
    recs.push(out);
  });
  // todos
  const tds=[];
  (Array.isArray(x.todos)?x.todos:[]).forEach(t=>{
    if(!t||typeof t!=="object"){dropped++;return;}
    let tid=safe(t.id); if(!tid||tds.some(e=>e.id===tid))tid=uid();
    const q=[0,1,2,3,4].includes(t.q)?t.q:0;     // v2.2: 0 = AKTUELL (quick inbox)
    const out={id:tid,text:String(t.text==null?"":t.text).slice(0,500),q,done:!!t.done};
    if(typeof t.created==="string"&&!isNaN(Date.parse(t.created)))out.created=t.created;
    if(out.done){
      out.doneAt=(typeof t.doneAt==="string"&&!isNaN(Date.parse(t.doneAt)))?t.doneAt:new Date().toISOString();
    }
    tds.push(out);
  });
  return {habits:habs,records:recs,todos:tds,dropped};
}
function restore(e){
  let file=e.target.files[0];if(!file)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let x=JSON.parse(r.result);
      if(!x||typeof x!=="object"||!Array.isArray(x.habits)||!Array.isArray(x.records))throw 0;
      const clean=sanitizeImport(x);
      if(!clean.habits.length && (x.habits.length>0))throw 0;   // structurally unusable
      habits=clean.habits;records=clean.records;todos=clean.todos;
      save();render();
      alert(clean.dropped>0
        ? `HabitDOS-Daten importiert. ${clean.dropped} ungültige Einträge übersprungen.`
        : "HabitDOS-Daten wurden importiert.");
    }catch(err){alert("Ungültige HabitDOS-Backup-Datei.");}
  };
  r.readAsText(file);
}

/* ── Global helpers ── */
function toggleById(id){let h=habits.find(x=>x.id===id);if(h){justToggledId=id;toggle(h);}}
function limitIncById(id){let h=habits.find(x=>x.id===id);if(h)limitInc(h);}
function limitDecById(id){let h=habits.find(x=>x.id===id);if(h)limitDec(h);}
function limitZeroById(id){let h=habits.find(x=>x.id===id);if(h)limitConfirmZero(h);}
function toggleTodo(id){
  let t=todos.find(x=>x.id===id);
  if(t){
    t.done=!t.done;
    if(t.done)t.doneAt=new Date().toISOString();   // v2.2: needed for the 24h cleanup
    else delete t.doneAt;
    save();render();
  }
}
function purgeOldTodos(){
  const now=Date.now();
  const before=todos.length;
  todos=todos.filter(t=>{
    if(!t.done)return true;
    if(!t.doneAt){t.doneAt=new Date().toISOString();return true;}  // legacy: start the clock now
    const ts=Date.parse(t.doneAt);
    if(isNaN(ts))return true;
    return (now-ts)<TODO_KEEP_MS;
  });
  if(todos.length!==before)save();
}
/* v2.2: move a todo between AKTUELL (0) and the four quadrants. */
function moveTodo(id,q){
  const t=todos.find(x=>x.id===id);
  if(!t)return;
  t.q=q;
  pickerTodoId=null;
  save();render();
}
function togglePicker(id){
  pickerTodoId = (pickerTodoId===id) ? null : id;
  render();
}
function delTodo(id){
  if(!confirm("Aufgabe löschen?"))return;
  todos=todos.filter(x=>x.id!==id);save();render();
}

function backup(){
  let data={habits,records,todos,version:APP_VERSION,exported:k(today())};
  let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  let a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`habitdos-backup-${k(today())}.json`;
  a.click();
}

function editor(id){
  editId=id||null;
  if(editId){
    let h=habits.find(x=>x.id===editId);
    if(!h)return;
    editFreq=cloneFreq(h.freq);
    editDays=editFreq.type==="days"?[...editFreq.days]:[];
  }else{
    editFreq={type:"daily"};editDays=[];
  }
  renderEditor();
}

function setFreqType(t){
  editFreq={type:t};
  if(t==="times")editFreq.count=3;
  if(t==="days")editDays=[];
  if(t==="limit")editFreq.max=5;
  renderEditor();
}
function changeCount(n){
  editFreq.count=Math.max(1,Math.min(7,(editFreq.count||3)+n));
  renderEditor();
}
function changeLimit(n){
  editFreq.max=Math.max(0,Math.min(99,(editFreq.max??5)+n));
  renderEditor();
}
function toggleDay(d){
  if(editDays.includes(d))editDays=editDays.filter(x=>x!==d);
  else editDays.push(d);
  editDays.sort((a,b)=>a-b);
  renderEditor();
}
function cancelEditor(){render();}
function saveHabit(){
  let name=$("#ename").value.trim();
  if(!name){alert("Name erforderlich.");return;}
  let freq=cloneFreq(editFreq);
  if(freq.type==="days")freq.days=[...editDays];
  if(editId){
    let h=habits.find(x=>x.id===editId);
    if(h){
      let oldFreq=JSON.stringify(h.freq);
      let newFreq=JSON.stringify(freq);
      if(oldFreq!==newFreq){
        if(!h.versions)h.versions=[{from:"2000-01-01",freq:cloneFreq(h.freq)}];
        h.versions.push({from:k(today()),freq:cloneFreq(freq)});
      }
      h.name=name;h.freq=freq;
    }
  }else{
    habits.push({id:uid(),name,freq,arch:false,created:new Date().toISOString(),createdDay:k(today()),versions:[{from:"2000-01-01",freq:cloneFreq(freq)}]});
  }
  save();render();
}
function deleteHabit(){
  if(!confirm("Habit wirklich löschen? Alle Daten gehen verloren."))return;
  habits=habits.filter(x=>x.id!==editId);
  records=records.filter(r=>r.h!==editId);
  save();render();
}
function archiveHabit(){
  let h=habits.find(x=>x.id===editId);
  if(h){h.arch=true;save();render();}
}
function unarchiveHabit(){
  let h=habits.find(x=>x.id===editId);
  if(h){h.arch=false;save();render();}
}

/* ── Todo Editor ── */

/* ══════════════════════════════════════════════════════════════════
   9. NAVIGATION & EINGABE
   Reiterwechsel, Perioden-Navigation, Gesten, Tastatur, zentraler Klick-Listener.
   ══════════════════════════════════════════════════════════════════ */

function weekNav(n){viewedWeek=add(viewedWeek,n*7);render();}

function historyYearChange(n){historyYear=Math.max(2020,Math.min(today().getFullYear(),historyYear+n));render()}
function historyMonth(n){historyMonthDate=new Date(historyMonthDate.getFullYear(),historyMonthDate.getMonth()+n,1);render()}
function openHistoryMonth(y,m){historyMonthDate=new Date(y,m,1);tab="historyMonth";render()}
function openHistoryWeek(s){historyWeekDate=parse(s);tab="historyWeek";render()}

function openHabitHistory(id){historyHabitId=id;tab="habitHistory";render();}
function toggleMore(){window._moreOpen=!window._moreOpen;render()}

document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  // v2.2: gestures starting on a counter card never switch tabs (mis-taps while counting)
  touchBlocked = !!(e.target&&e.target.closest&&e.target.closest(".noswipe"));
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchStartTime=Date.now();
},{passive:true});

document.addEventListener("touchend",e=>{
  if(!touchStartX && !touchStartY)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  touchStartX=touchStartY=0;
  if(touchBlocked){touchBlocked=false;return;}   // v2.2: started on a counter card
  if(dt>SWIPE_MAX_TIME)return;
  if(Math.abs(dy)>SWIPE_MAX_Y)return;
  if(Math.abs(dx)<SWIPE_THRESHOLD)return;
  // v1.8: on WEEK / MONTH, horizontal swipe navigates the period, not the tab
  if(tab==="week"){
    if(dx<0)animateSwipe("left",()=>weekNav(1));
    else animateSwipe("right",()=>weekNav(-1));
    return;
  }
  if(tab==="month"){
    if(dx<0)animateSwipe("left",()=>changeMonth(1));
    else animateSwipe("right",()=>changeMonth(-1));
    return;
  }
  // Otherwise: switch tabs
  const idx=TAB_ORDER.indexOf(tab);
  if(idx<0)return;
  if(dx<0 && idx<TAB_ORDER.length-1){
    animateSwipe("left",()=>setTab(TAB_ORDER[idx+1]));
  }else if(dx>0 && idx>0){
    animateSwipe("right",()=>setTab(TAB_ORDER[idx-1]));
  }
},{passive:true});

function animateSwipe(dir,cb){
  const main=document.querySelector("main");
  if(!main){cb();return;}
  main.classList.add(dir==="left"?"swipe-left":"swipe-right");
  setTimeout(()=>{
    cb();
    requestAnimationFrame(()=>{
      const m=document.querySelector("main");
      if(m){m.classList.remove("swipe-left","swipe-right");}
    });
  },120);
}

/* ── Keyboard shortcuts ── */
document.addEventListener("keydown",e=>{
  const idx=TAB_ORDER.indexOf(tab);
  if(e.key==="ArrowRight" && idx<TAB_ORDER.length-1){e.preventDefault();setTab(TAB_ORDER[idx+1]);}
  else if(e.key==="ArrowLeft" && idx>0){e.preventDefault();setTab(TAB_ORDER[idx-1]);}
});

/* ── Render ── */
function setTab(t){
  if(tab===t)return;
  purgeOldTodos();                 // v3.2: Aufräumen hier statt in der Anzeige
  saveScroll();
  prevTab=tab;
  tab=t;
  if(t==="week")viewedWeek=mon(today());
  if(t==="month")month=new Date(today().getFullYear(),today().getMonth(),1);
  window._moreOpen=MORE_TABS.includes(t);
  render();
}

function changeMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render();}

function showHabitStats(){tab="stats";render();}

/* ── v3.2: Zentraler Klick-Listener ──
   Elemente tragen nur noch Daten (data-act, data-id), keinen ausführbaren Code
   mit Nutzerwerten. Aufgerufen werden ausschließlich Funktionen aus ACTIONS —
   ein manipulierter Wert kann damit weder Code einschleusen noch beliebige
   Funktionen erreichen. */
const ACTIONS={
  toggleById:     id=>toggleById(id),
  limitIncById:   id=>limitIncById(id),
  limitDecById:   id=>limitDecById(id),
  limitZeroById:  id=>limitZeroById(id),
  editor:         id=>editor(id),
  openHabitHistory:id=>openHabitHistory(id),
  toggleTodo:     id=>toggleTodo(id),
  delTodo:        id=>delTodo(id),
  togglePicker:   id=>togglePicker(id),
  moveTodo:       (id,ds)=>moveTodo(id,Number(ds.q))
};
document.addEventListener("click",e=>{
  const el=e.target&&e.target.closest?e.target.closest("[data-act]"):null;
  if(!el)return;
  const fn=Object.prototype.hasOwnProperty.call(ACTIONS,el.dataset.act)?ACTIONS[el.dataset.act]:null;
  if(!fn)return;
  fn(el.dataset.id,el.dataset);
});

/* ══════════════════════════════════════════════════════════════════
   10. TIMER & OFFLINE
   Minutentakt (Zeitanzeige, Tageswechsel) und Service Worker.
   ══════════════════════════════════════════════════════════════════ */

function refreshSinceLabels(){
  if(tab!=="today")return;
  if(!active().some(h=>isLimit(h)))return;
  document.querySelectorAll("[data-since-habit]").forEach(el=>{
    const h=habits.find(x=>x.id===el.getAttribute("data-since-habit"));
    if(h)el.textContent="LETZTE: "+limitSinceText(h);
  });
}
function startSinceTimer(){
  if(sinceTimer)clearInterval(sinceTimer);
  lastSeenDay=k(today());
  sinceTimer=setInterval(()=>{
    // v2.5: Läuft die App über die 03:00-Grenze, den neuen Tag übernehmen.
    const nowDay=k(today());
    if(nowDay!==lastSeenDay){lastSeenDay=nowDay;prevDayDone=null;purgeOldTodos();render();return}
    refreshSinceLabels();
  },60000);
}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden)return;
  purgeOldTodos();
  if(tab==="today"||tab==="todo")render();
});
function initServiceWorker(){
  if(!("serviceWorker" in navigator))return;
  swState = "pending";
  navigator.serviceWorker.register("./sw.js")
    .then(reg=>{
      swState = navigator.serviceWorker.controller ? "ready" : "installing";
      reg.addEventListener("updatefound",()=>{
        const nw=reg.installing;
        if(!nw)return;
        nw.addEventListener("statechange",()=>{
          if(nw.state==="installed"&&navigator.serviceWorker.controller){
            swState="update";        // neue Version liegt bereit
            if(tab==="habits")render();
          }
        });
      });
      if(tab==="habits")render();
    })
    .catch(()=>{ swState="failed"; });
}
/* ══════════════════════════════════════════════════════════════════
   11. START
   Ausführung beim Laden: Migration, ID-Prüfung, Timer, erstes Rendern.
   ══════════════════════════════════════════════════════════════════ */

habits.forEach(h=>{if(!h.versions)h.versions=[{from:"2000-01-01",freq:cloneFreq(h.freq)}]});
/* v3.1: IDs auch beim Laden prüfen — nicht nur beim Import. Daten, die vor
   v2.1 (ohne Import-Filter) gespeichert wurden, könnten sonst unsichere IDs
   enthalten. Nur ungültige IDs werden ersetzt, Verweise mitgezogen. */
(function sanitizeIdsOnLoad(){
  const ok=id=>typeof id==="string"&&/^[A-Za-z0-9._-]+$/.test(id);
  const map={};let changed=false;
  habits.forEach(h=>{if(!ok(h.id)){const n=uid();map[String(h.id)]=n;h.id=n;changed=true}});
  if(changed)records.forEach(r=>{if(map[String(r.h)])r.h=map[String(r.h)]});
  todos.forEach(t=>{if(!ok(t.id)){t.id=uid();changed=true}});
  if(changed)save();
})();

initServiceWorker();
startSinceTimer();
purgeOldTodos();
save();render();
</script>
