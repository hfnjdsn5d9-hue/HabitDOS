}
const kReadMac=(prefix,max)=>kMac(["p","f","c"].map(s=>{const el=document.getElementById(prefix+s);return el&&el.value.trim()!==""?el.value:null}),max);
function kcalPanelHtml(){
  const p=kcalPanel;
  const err=`<div class="ferr" id="kerr" role="alert"></div>`;
  if(p.kind==="amt"){
    const f=p.food, isG=f.unit==="g";
    const chips=(isG?[50,100,150,200,250]:[0.5,1,2,3]).map(v=>`<button onclick="kcalSetAmt(${v})">${kFmtAmt(v)}${isG?" g":""}</button>`).join("")+
      (isG&&f.pg?`<button onclick="kcalSetAmt(${f.pg})">1 PORTION · ${f.pg} g</button>`:"");
    return `<div class="kpanel noswipe" role="group" aria-label="Menge eintragen">`+
      `<div class="row"><b>${esc(f.n)}</b><span class="tlmeta">${kPerTxt(f)}</span></div>`+
      `<div class="kbasis">${f.m?`${isG?"pro 100 g":"pro Stück"}: ${kMacTxt(f.m)}`:"Keine Makroangaben"}</div>`+
      `<div class="kamt"><input id="kamt" class="input" type="text" inputmode="decimal" autocomplete="off" value="${kFmtAmt(p.amt)}" aria-label="Menge in ${isG?"Gramm":"Stück"}" oninput="kcalPreview()" onkeydown="if(event.key==='Enter'){event.preventDefault();kcalCommit()}"><span class="kunit">${isG?"g":"Stk"}</span></div>`+
      `<div class="kchips">${chips}</div>`+
      `<div class="kprev" id="kprev" aria-live="polite">= ${kFmt(kCalc(f.per,f.unit,p.amt))} kcal</div>`+
      (f.m?`<div class="kprevm" id="kprevm">${kMacTxt(kMacScale(f.m,f.unit,p.amt))}</div>`:"")+err+
      `<div class="kbtns"><button class="wide primary" onclick="kcalCommit()">${p.editId?"SPEICHERN":"EINTRAGEN"}</button>`+
      `<button class="wide secondary" onclick="kcalClosePanel()">ABBRECHEN</button>`+
      (p.editId?`<button class="wide danger" onclick="kcalDeleteEntry()">EINTRAG LÖSCHEN</button>`:"")+`</div></div>`;
  }
  if(p.kind==="quick"){
    return `<div class="kpanel noswipe" role="group" aria-label="kcal direkt eintragen">`+
      `<div class="row"><b>KCAL DIREKT EINTRAGEN</b></div>`+
      `<label class="field"><span class="flabel">BEZEICHNUNG (OPTIONAL)</span><input id="kqn" class="input" autocomplete="off" value="${esc(p.n||"")}" placeholder="z. B. Mittagessen Mensa"></label>`+
      `<label class="field"><span class="flabel">KCAL</span><input id="kqk" class="input" type="text" inputmode="numeric" autocomplete="off" value="${p.kcal!=null?p.kcal:""}" onkeydown="if(event.key==='Enter'){event.preventDefault();kcalCommitQuick()}"></label>`+
      `<div class="label">MAKROS IN G (OPTIONAL)</div>${kMacInputs("kq",p.m,"")}${err}`+
      `<div class="kbtns"><button class="wide primary" onclick="kcalCommitQuick()">${p.editId?"SPEICHERN":"EINTRAGEN"}</button>`+
      `<button class="wide secondary" onclick="kcalClosePanel()">ABBRECHEN</button>`+
      (p.editId?`<button class="wide danger" onclick="kcalDeleteEntry()">EINTRAG LÖSCHEN</button>`:"")+`</div></div>`;
  }
  // kind==="food": eigenes Lebensmittel anlegen/bearbeiten
  const isG=p.unit!=="stk";
  return `<div class="kpanel noswipe" role="group" aria-label="Eigenes Lebensmittel">`+
    `<div class="row"><b>${p.id?"LEBENSMITTEL BEARBEITEN":"EIGENES LEBENSMITTEL"}</b></div>`+
    `<label class="field"><span class="flabel">NAME</span><input id="kfn" class="input" autocomplete="off" value="${esc(p.n||"")}" placeholder="z. B. Snickers"></label>`+
    `<div class="label">ANGABE</div><div class="seg">`+
      `<button class="${isG?"sel":""}" aria-pressed="${isG}" onclick="kcalFoodUnit('g')">PRO 100 G</button>`+
      `<button class="${!isG?"sel":""}" aria-pressed="${!isG}" onclick="kcalFoodUnit('stk')">PRO STÜCK</button></div>`+
    `<label class="field"><span class="flabel">KCAL ${isG?"PRO 100 G":"PRO STÜCK"}</span><input id="kfp" class="input" type="text" inputmode="decimal" autocomplete="off" value="${p.per!=null?kFmtAmt(p.per):""}" placeholder="leer = aus Makros berechnen"></label>`+
    `<div class="label">MAKROS IN G ${isG?"PRO 100 G":"PRO STÜCK"} (OPTIONAL)</div>${kMacInputs("km",p.m,"")}`+
    (isG?`<label class="field"><span class="flabel">PORTION IN G (OPTIONAL)</span><input id="kfg" class="input" type="text" inputmode="numeric" autocomplete="off" value="${p.pg||""}" placeholder="z. B. 50 für einen Riegel"></label>`:"")+err+
    `<div class="kbtns"><button class="wide primary" onclick="kcalSaveFood()">SPEICHERN</button>`+
    `<button class="wide secondary" onclick="kcalClosePanel()">ABBRECHEN</button>`+
    (p.id?`<button class="wide danger" onclick="kcalDeleteFood()">LEBENSMITTEL LÖSCHEN</button>`:"")+`</div>`+
    `<div class="hint">Werte stehen auf der Packung unter „Nährwerte“: Eiweiß, Fett, Kohlenhydrate. Bleibt kcal leer, wird es aus den Makros berechnet (4 / 9 / 4 kcal pro g). Bereits eingetragene Mahlzeiten ändern sich durch Bearbeiten nicht.</div></div>`;
}
function kcalView(){
  const dk=kcalDayKey(), tdk=k(today()), isToday=dk===tdk, dDate=parse(dk);
  const entries=kcal.log.filter(e=>e.d===dk).sort((a,b)=>((a.t||"")<(b.t||"")?-1:1));
  const tot=entries.reduce((s,e)=>s+e.kcal,0), g=kcal.goal, over=g&&tot>g;
  const dateShort=new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}).format(dDate).toUpperCase().replace(/\.,?/,"").replace(",","");
  const sum=`<div class="sum${over?" over":""}"><span class="sum-l"><b class="hero-pct">${kFmt(tot)}</b>`+
    (g?`<span class="hero-bar" aria-hidden="true">${bar(Math.min(tot,g),g,10)}</span>`:"")+`</span>`+
    `<span class="sum-r">${g?`/ ${kFmt(g)} · ${over?`${kFmt(tot-g)} DRÜBER`:`${kFmt(g-tot)} ÜBRIG`}`:"KCAL · KEIN ZIEL"}</span></div>`;
  // v3.6: Makros im Kopf, sobald Ziele gesetzt sind oder der Tag Makros enthält
  const mgs=kMacGoals(), mac=kcalDayMacros(entries), mg=mgs||[null,null,null];
  const showMac=!!mgs||mac.sum.some(v=>v>0);
  const macHtml=showMac?`<div class="kmac">`+MAC_L.map((l,i)=>{
      const v=mac.sum[i], gg=mg[i];
      return `<div><span class="kml">${l}${mac.miss?"*":""}</span>`+
        `<span class="kmv">${kFmtG(v)}${gg?`<small> / ${gg} g</small>`:"<small> g</small>"}</span>`+
        (gg?`<span class="kmb" aria-hidden="true">${bar(Math.min(v,gg),gg,8)}</span>`:"")+`</div>`}).join("")+`</div>`:"";
  const nav=periodNav({prev:"kcalDayNav(-1)",next:"kcalDayNav(1)",prevL:"Vorheriger Tag",nextL:"Nächster Tag",
    label:isToday?"HEUTE":dDate.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"}).toUpperCase(),
    jump:isToday?"":"kcalDay=null;render()",jumpL:"ZU HEUTE"});
  const search=`<div class="quickrow noswipe"><input id="kq" type="search" enterkeyhint="search" value="${esc(kcalQuery)}" placeholder="Lebensmittel suchen …" autocomplete="off" aria-label="Lebensmittel suchen" oninput="kcalSearchInput(this.value)">`+
    `<button class="kqbtn" onclick="kcalOpenQuick()" aria-label="kcal direkt eintragen">+KCAL</button></div>`;
  const list=`<div id="kres">${kcalPanel?kcalPanelHtml():kcalListHtml()}</div>`;
  const rows=entries.length?entries.map(e=>
    `<button class="tlrow" data-act="kcalEditEntry" data-id="${esc(e.id)}"><span class="tlname">${esc(e.n)}</span><span class="tlmeta">${kAmtTxt(e)}</span><span class="kkcal">${kFmt(e.kcal)}</span></button>`).join("")
    :`<div class="hint">Noch nichts eingetragen.</div>`;
  // letzte 7 Tage bis heute
  const days=Array.from({length:7},(_,i)=>add(today(),i-6));
  const totals=days.map(d=>kcalDayTotal(k(d)));
  const ref=g||Math.max(1,...totals);
  const logged=totals.filter(t=>t>0);
  const avg=logged.length?Math.round(logged.reduce((a,b)=>a+b,0)/logged.length):0;
  const week=days.map((d,i)=>{const key=k(d),t=totals[i];
    return `<button class="kday${key===dk?" cur":""}${g&&t>g?" over":""}" onclick="kcalDayGo('${key}')" aria-label="${d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}: ${kFmt(t)} kcal">`+
      `<span class="wlabel">${weekdays[d.getDay()]} ${pad(d.getDate())}</span><span class="wbar${t?"":" lv0"}" aria-hidden="true">${t?bar(Math.min(t,ref),ref,14):"·".repeat(14)}</span><span class="wpct">${t?kFmt(t):"–"}</span></button>`}).join("");
  const own=kcal.foods.slice().sort((a,b)=>a.n.localeCompare(b.n,"de"));
  const catLine=kcalCat?`${esc(kcalCat.source)} · ${kFmt(kcalCat.items.length)} Einträge · importiert ${new Date(kcalCat.imported).toLocaleDateString("de-DE")}`:"Kein Katalog importiert.";
  const settings=`<details class="archive"${window._kcalSetOpen?" open":""} ontoggle="window._kcalSetOpen=this.open"><summary>EINSTELLUNGEN & KATALOG</summary>`+
    `<div class="label">TAGESZIELE</div><div class="noswipe">`+
      `<label class="field"><span class="flabel">KCAL</span><input id="kgoal" class="input" type="text" inputmode="numeric" autocomplete="off" value="${g||""}" placeholder="kein Ziel" oninput="kcalPctPreview()" onkeydown="if(event.key==='Enter'){event.preventDefault();kcalSaveGoal()}"></label>`+
      `<div class="label" style="margin-top:var(--s3)">MAKROZIELE</div>`+
      `<div class="seg">${[["pct","IN % DER KCAL"],["g","IN GRAMM"]].map(([m,l])=>`<button class="${kMacMode()===m?"sel":""}" aria-pressed="${kMacMode()===m}" onclick="kcalMacModeSet('${m}')">${l}</button>`).join("")}</div>`+
      (kMacMode()==="pct"
        ? `<div style="margin-top:var(--s3)">${kMacInputs("kg",kcal.mpct,"%","kcalPctPreview()")}</div><div class="kpctsum" id="kpctsum" aria-live="polite">${kcalPctPreviewText()}</div>`
        : `<div style="margin-top:var(--s3)">${kMacInputs("kg",kcal.mgoal,"G")}</div>`)+
      `<div class="ferr" id="kgerr" role="alert"></div>`+
      `<button class="wide primary" onclick="kcalSaveGoal()">ZIELE SPEICHERN</button></div>`+
    (kMacMode()==="g"&&kcal.mgoal&&kcal.mgoal.every(v=>v!=null)?`<div class="hint" style="margin-top:var(--s2)">Deine Makroziele ergeben ${kFmt(kcal.mgoal.reduce((s,v,i)=>s+v*MAC_KCAL[i],0))} kcal (4 / 9 / 4 kcal pro g).</div>`:"")+
    (kMacMode()==="pct"?`<div class="hint" style="margin-top:var(--s2)">Die Gramm werden aus kcal-Ziel und Anteil berechnet (Eiweiß und Kohlenhydrate 4 kcal/g, Fett 9 kcal/g) und passen sich automatisch an, wenn du das kcal-Ziel oder die Verteilung änderst.</div>`:"")+
    `<div class="hint" style="margin-top:var(--s2)">Leer lassen = kein Ziel. Die Ziele zählen nicht in die Tagesquote auf TODAY.</div>`+
    `<div class="label">EIGENE LEBENSMITTEL · ${own.length}</div>`+
    (own.length?own.map(f=>`<button class="tlrow" data-act="kcalEditFood" data-id="${esc(f.id)}"><span class="tlname">★ ${esc(f.n)}</span><span class="tlmeta">${kPerTxt(f)}</span></button>`).join(""):`<div class="hint" style="margin-top:0">Noch keine.</div>`)+
    `<button class="wide secondary" onclick="kcalOpenFood(null,false)">+ EIGENES LEBENSMITTEL</button>`+
    `<div class="label">KATALOG</div><div class="kcat">${catLine}</div>`+
    (kcalCatMsg?`<div class="kmsg" role="status">${esc(kcalCatMsg)}</div>`:"")+
    `<label class="wide secondary file">${kcalCat?"KATALOG ERSETZEN":"KATALOG IMPORTIEREN"}<input type="file" accept=".csv,.tsv,.txt,.json,text/csv,application/json" onchange="kcalImportCat(event)"></label>`+
    (kcalCat?`<button class="wide danger" onclick="kcalRemoveCat()">KATALOG ENTFERNEN</button>`:"")+
    `<div class="hint">Der Katalog liegt nur auf diesem Gerät, nicht auf GitHub. Er ist im Backup (HABITS → DATEN EXPORTIEREN) enthalten. Akzeptiert werden CSV mit Spalten für Name und kcal pro 100 g oder JSON.${kcalCat?" Datenbasis: "+esc(kcalCat.source)+".":""}</div>`+
    `</details>`;
  const missNote=showMac&&mac.miss?`<div class="hint">* ${mac.miss} ${mac.miss===1?"Eintrag hat":"Einträge haben"} keine vollständigen Makroangaben – die Makro-Summen oben sind daher zu niedrig.</div>`:"";
  return `<main>${header("KCAL",dateShort,"",sum+macHtml)}${nav}${search}${list}`+
    `<div class="section-title">${isToday?"HEUTE":"EINTRÄGE"} · ${entries.length}</div>${rows}${missNote}`+
    `<div class="section-title">LETZTE 7 TAGE${avg?` · Ø ${kFmt(avg)}`:""}</div><div class="weekrows">${week}</div>`+
    settings+`</main>`;
}

/* ── Aktionen ── */
function kcalSearchInput(v){
  kcalQuery=v;
  kcalPanel=null;                                   // Tippen schließt ein offenes Feld
  const box=document.getElementById("kres");
  if(box)box.innerHTML=kcalListHtml();              // nur die Liste, damit der Fokus bleibt
}
function kcalFocus(id){
  const el=document.getElementById(id);
  if(!el)return;
  try{el.focus({preventScroll:true})}catch(e){el.focus()}
  try{el.select()}catch(e){}
  const p=document.querySelector(".kpanel"); if(p&&p.scrollIntoView)p.scrollIntoView({block:"nearest"});
}
function kcalPick(id){
  id=String(id||"");
  let food=null,amt=null;
  if(id.startsWith("f:")){const f=kcal.foods.find(x=>x.id===id.slice(2));if(f)food={n:f.n,per:f.per,unit:f.unit,pg:f.pg,m:f.m,src:"f"}}
  else if(id.startsWith("c:")&&kcalCat){const it=kcalCat.items[Number(id.slice(2))];if(it)food={n:it[0],per:it[1],unit:"g",m:kMac(it.slice(2,5),100),src:"c"}}
  else if(id.startsWith("e:")){const e=kcal.log.find(x=>x.id===id.slice(2));if(e&&e.per!=null){
    const f=kcal.foods.find(x=>x.n===e.n&&x.unit===e.unit);
    food={n:e.n,per:e.per,unit:e.unit,pg:f&&f.per===e.per?f.pg:undefined,m:e.m,src:e.src};amt=e.amt}}
  if(!food)return;
  kcalPanel={kind:"amt",food,amt:amt!=null?amt:(food.unit==="g"?(food.pg||100):1)};
  render();kcalFocus("kamt");
}
function kcalSetAmt(v){const el=document.getElementById("kamt");if(el){el.value=kFmtAmt(v);kcalPreview()}}
function kcalPreview(){
  const el=document.getElementById("kamt"),out=document.getElementById("kprev");
  if(!el||!out||!kcalPanel||kcalPanel.kind!=="amt")return;
  const a=kNum(el.value);
  out.textContent=a>0?`= ${kFmt(kCalc(kcalPanel.food.per,kcalPanel.food.unit,a))} kcal`:"= – kcal";
  const om=document.getElementById("kprevm"), f=kcalPanel.food;
  if(om&&f.m)om.textContent=a>0?kMacTxt(kMacScale(f.m,f.unit,a)):"";
}
function kcalErr(msg,fieldId){
  const er=document.getElementById("kerr"); if(er)er.textContent=msg;
  const f=fieldId&&document.getElementById(fieldId); if(f){f.setAttribute("aria-invalid","true");f.focus()}
}
function kcalCommit(){
  const p=kcalPanel; if(!p||p.kind!=="amt")return;
  const a=kNum((document.getElementById("kamt")||{}).value);
  if(!(a>0)||a>100000)return kcalErr("Bitte eine Menge größer als 0 eingeben.","kamt");
  const kc=kCalc(p.food.per,p.food.unit,a);
  if(p.editId){
    const e=kcal.log.find(x=>x.id===p.editId); if(e){e.amt=a;e.kcal=kc}
  }else{
    const e={id:uid(),d:kcalDayKey(),t:new Date().toISOString(),n:p.food.n,unit:p.food.unit,amt:a,per:p.food.per,kcal:kc};
    if(p.food.src)e.src=p.food.src;
    if(p.food.m)e.m=p.food.m.slice();                 // Makros pro Basis, wie kcal
    kcal.log.push(e);
  }
  kcalPanel=null;kcalQuery="";saveKcal();render();
}
function kcalOpenQuick(){kcalPanel={kind:"quick"};render();kcalFocus("kqk")}
function kcalCommitQuick(){
  const p=kcalPanel; if(!p||p.kind!=="quick")return;
  const kc=kNum((document.getElementById("kqk")||{}).value);
  if(!(kc>0)||kc>50000)return kcalErr("Bitte eine kcal-Zahl größer als 0 eingeben.","kqk");
  const n=String((document.getElementById("kqn")||{}).value||"").trim().slice(0,120)||"Direkteintrag";
  const m=kReadMac("kq",5000);
  if(p.editId){
    const e=kcal.log.find(x=>x.id===p.editId); if(e){e.n=n;e.amt=Math.round(kc);e.kcal=Math.round(kc);if(m)e.m=m;else delete e.m}
  }else{
    const e={id:uid(),d:kcalDayKey(),t:new Date().toISOString(),n,unit:"kcal",amt:Math.round(kc),per:null,kcal:Math.round(kc)};
    if(m)e.m=m;
    kcal.log.push(e);
  }
  kcalPanel=null;saveKcal();render();
}
function kcalEditEntry(id){
  const e=kcal.log.find(x=>x.id===id); if(!e)return;
  if(e.unit==="kcal"||e.per==null){kcalPanel={kind:"quick",editId:e.id,n:e.n,kcal:e.kcal,m:e.m};render();kcalFocus("kqk");return}
  kcalPanel={kind:"amt",editId:e.id,food:{n:e.n,per:e.per,unit:e.unit,m:e.m},amt:e.amt};
  render();kcalFocus("kamt");
}
function kcalDeleteEntry(){
  const p=kcalPanel; if(!p||!p.editId)return;
  if(!confirm("Eintrag löschen?"))return;
  kcal.log=kcal.log.filter(x=>x.id!==p.editId);
  kcalPanel=null;saveKcal();render();
}
function kcalClosePanel(){kcalPanel=null;render()}
function kcalOpenFood(id,fromSearch){
  const f=id?kcal.foods.find(x=>x.id===id):null;
  kcalPanel=f?{kind:"food",id:f.id,n:f.n,per:f.per,unit:f.unit,pg:f.pg,m:f.m}
             :{kind:"food",n:fromSearch?kcalQuery.trim().slice(0,120):"",unit:"g",fromSearch:!!fromSearch};
  window._kcalSetOpen=window._kcalSetOpen||(!fromSearch&&!f?true:window._kcalSetOpen);
  render();window.scrollTo(0,0);kcalFocus(f||fromSearch?"kfp":"kfn");
}
function kcalEditFood(id){kcalOpenFood(id,false)}
function kcalReadFoodForm(){
  const p=kcalPanel;
  p.n=String((document.getElementById("kfn")||{}).value||"");
  const per=kNum((document.getElementById("kfp")||{}).value); p.per=isFinite(per)?per:null;
  const pgEl=document.getElementById("kfg"); if(pgEl){const pg=kNum(pgEl.value);p.pg=pg>0?Math.round(pg):undefined}
  p.m=["p","f","c"].map(s=>{const el=document.getElementById("km"+s);const v=el?kNum(el.value):NaN;return v>=0?v:null});
}
function kcalFoodUnit(u){if(!kcalPanel||kcalPanel.kind!=="food")return;kcalReadFoodForm();kcalPanel.unit=u;render();kcalFocus("kfp")}
function kcalSaveFood(){
  const p=kcalPanel; if(!p||p.kind!=="food")return;
  kcalReadFoodForm();
  const n=p.n.trim().slice(0,120);
  if(!n)return kcalErr("Bitte einen Namen eingeben.","kfn");
  const maxM=p.unit==="stk"?2000:100;
  if(p.m&&p.m.some(v=>v!=null&&v>maxM))return kcalErr(`Makros dürfen höchstens ${maxM} g ${p.unit==="stk"?"pro Stück":"pro 100 g"} betragen.`,"kfp");
  if(p.per==null&&p.m&&p.m.every(v=>v!=null))p.per=Math.round(p.m.reduce((s,v,i)=>s+v*MAC_KCAL[i],0));   // kcal aus Makros
  if(!(p.per>=0)||p.per>20000)return kcalErr(`Bitte die kcal ${p.unit==="stk"?"pro Stück":"pro 100 g"} eingeben – oder alle drei Makros.`,"kfp");
  const food={id:p.id||uid(),n,per:Math.round(p.per*10)/10,unit:p.unit==="stk"?"stk":"g"};
  if(food.unit==="g"&&p.pg>0&&p.pg<=5000)food.pg=p.pg;
  const fm=kMac(p.m,maxM); if(fm)food.m=fm;
  const i=kcal.foods.findIndex(x=>x.id===food.id);
  // v3.6: bekommt ein Lebensmittel neu Makros, alte Einträge ohne Makros auf Nachfrage ergänzen
  // (nur bei gleicher Basis, damit kcal und Makros zusammenpassen)
  if(i>=0&&food.m){
    const prev=kcal.foods[i];
    const olds=kcal.log.filter(e=>!e.m&&e.n===prev.n&&e.unit===food.unit&&e.per===food.per);
    if(olds.length&&confirm(`${olds.length} bisherige${olds.length===1?"r Eintrag":" Einträge"} von „${prev.n}“ ohne Makros. Makros dort ergänzen?`))
      olds.forEach(e=>{e.m=food.m.slice()});
  }
  if(i>=0)kcal.foods[i]=food;else kcal.foods.push(food);
  saveKcal();
  if(p.fromSearch){                                 // neu aus der Suche: gleich die Menge abfragen
    kcalQuery="";kcalPanel={kind:"amt",food:{n:food.n,per:food.per,unit:food.unit,pg:food.pg,m:food.m,src:"f"},amt:food.unit==="g"?(food.pg||100):1};
    render();kcalFocus("kamt");return;
  }
  kcalPanel=null;render();
}
function kcalDeleteFood(){
  const p=kcalPanel; if(!p||!p.id)return;
  if(!confirm("Eigenes Lebensmittel löschen? Bereits eingetragene Mahlzeiten bleiben erhalten."))return;
  kcal.foods=kcal.foods.filter(x=>x.id!==p.id);
  kcalPanel=null;saveKcal();render();
}
/* v3.7: Live-Vorschau der %-Verteilung (ohne Neuzeichnen, Fokus bleibt) */
function kcalPctRead(){
  const gv=kNum((document.getElementById("kgoal")||{}).value);
  const pc=["p","f","c"].map(x=>{const el=document.getElementById("kg"+x);return el?kNum(el.value):NaN});
  return {goal:gv>0?Math.round(gv):null,pc};
}
function kcalPctPreviewText(st){
  const {goal,pc}=st||{goal:kcal.goal,pc:kcal.mpct||[NaN,NaN,NaN]};
  if(!pc.some(v=>v>=0))return "Anteile eingeben, z. B. 30 / 30 / 40.";
  const sum=pc.reduce((a,v)=>a+(v>=0?v:0),0);
  const sumTxt=`Summe ${kFmtAmt(sum)} %${Math.round(sum)!==100?" – sollte 100 % sein":""}`;
  if(!goal)return `${sumTxt} · Für Gramm-Werte ein kcal-Ziel eingeben.`;
  return `${sumTxt} → `+kPctToG(goal,pc.map(v=>v>=0?v:0)).map((v,i)=>`${MAC_S[i]} ${v} g`).join(" · ");
}
function kcalPctPreview(){
  const el=document.getElementById("kpctsum"); if(!el)return;
  const st=kcalPctRead();
  el.textContent=kcalPctPreviewText(st);
  const sum=st.pc.reduce((a,v)=>a+(v>=0?v:0),0);
  el.classList.toggle("bad",st.pc.some(v=>v>=0)&&Math.round(sum)!==100);
}
/* Moduswechsel übernimmt die bisherigen Ziele umgerechnet */
function kcalMacModeSet(m){
  if(kMacMode()===m)return;
  const gv=kNum((document.getElementById("kgoal")||{}).value);
  if(gv>0)kcal.goal=Math.min(20000,Math.round(gv));
  if(m==="pct"){
    const cur=kcal.mgoal; if(cur&&cur.every(v=>v!=null)){const pc=kGToPct(cur);if(pc)kcal.mpct=pc}
  }else{
    const gg=kMacGoals(); if(gg)kcal.mgoal=gg;
  }
  kcal.mmode=m;saveKcal();render();
}
function kcalSaveGoal(){
  const v=String((document.getElementById("kgoal")||{}).value||"").trim();
  const g=kNum(v);
  const err=msg=>{const e=document.getElementById("kgerr");if(e)e.textContent=msg};
  const goal=(v===""||!(g>0))?null:Math.min(20000,Math.round(g));
  if(kMacMode()==="pct"){
    const pc=["p","f","c"].map(x=>{const el=document.getElementById("kg"+x);const t=el?el.value.trim():"";return t===""?null:kNum(t)});
    if(pc.every(x=>x==null)){delete kcal.mpct}
    else{
      if(pc.some(x=>!(x>=0)||x>100))return err("Bitte alle drei Anteile zwischen 0 und 100 % eingeben.");
      const sum=pc.reduce((a,b)=>a+b,0);
      if(Math.round(sum)!==100)return err(`Die Anteile ergeben ${kFmtAmt(sum)} %, bitte auf 100 % bringen.`);
      if(!goal)return err("Für die %-Verteilung braucht es ein kcal-Ziel.");
      kcal.mpct=pc.map(x=>Math.round(x*10)/10);
    }
    kcal.mmode="pct";
  }else{
    const mg=kReadMac("kg",2000);                    // v3.6: Makroziele in g pro Tag
    if(mg&&mg.some(x=>x>0))kcal.mgoal=mg.map(x=>x>0?Math.round(x):null);else delete kcal.mgoal;
    kcal.mmode="g";
  }
  kcal.goal=goal;
  saveKcal();render();
}
function kcalDayNav(n){
  const d=add(kcalDay||today(),n);
  kcalDay=(k(d)>=k(today()))?null:d;                // nie in die Zukunft; "heute" folgt dem Datum
  kcalPanel=null;render();
}
function kcalDayGo(key){
  if(!isValidDateKey(key))return;
  kcalDay=(key>=k(today()))?null:parse(key);
  kcalPanel=null;render();window.scrollTo(0,0);
}

/* ── Katalog-Import: CSV (Komma, Semikolon oder Tab) oder JSON ── */
function kcalParseCsv(txt){
  const lines=txt.split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2)throw{userMsg:"Die Datei enthält keine Datenzeilen."};
  const h=lines[0];
  const cnt=c=>h.split(c).length;
  const delim=[";","\t",","].reduce((best,c)=>cnt(c)>cnt(best)?c:best,",");
  const split=line=>{                                // CSV-Zeile mit Anführungszeichen
    const out=[];let cur="",q=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
      else if(ch==='"')q=true;
      else if(ch===delim){out.push(cur);cur=""}
      else cur+=ch;
    }
    out.push(cur);return out.map(s=>s.trim());
  };
  const head=split(h), hf=head.map(kFold);
  const kcalCol=hf.findIndex(x=>/kcal|kilokalorie/.test(x));
  let nameCol=hf.findIndex(x=>/bezeichnung|lebensmittel|^name|name.*de|deutsch/.test(x)&&!/engl|english/.test(x));
  if(nameCol<0)nameCol=hf.findIndex(x=>/name|text|food/.test(x));
  if(kcalCol<0||nameCol<0)throw{userMsg:`Spalten für Name und kcal nicht erkannt. Gefunden: ${head.slice(0,8).join(" | ").slice(0,200)}`};
  // v3.6: Makro-Spalten (optional) — Eiweiß, Fett, Kohlenhydrate (bevorzugt "verfügbar")
  const pCol=hf.findIndex(x=>/protein|eiweiss/.test(x)&&!/kj|kcal/.test(x));
  const fCol=hf.findIndex(x=>/(^|[^a-z])(fett|fat|lipid)/.test(x)&&!/saure|acid|frei|kj|kcal/.test(x));
  const cAll=hf.map((x,i)=>/kohlenhydrat|carbohydrate/.test(x)&&!/ballast|fib|kj|kcal/.test(x)?i:-1).filter(i=>i>=0);
  const cCol=cAll.find(i=>/verfugbar|available/.test(hf[i]))??(cAll.length?cAll[0]:-1);
  const macCols=[pCol,fCol,cCol];
  const items=[];
  for(let i=1;i<lines.length&&items.length<KCAL_MAX_CAT;i++){
    const c=split(lines[i]);
    const n=c[nameCol], v=kNum(c[kcalCol]);
    if(n&&v>=0&&v<=1000)items.push([n,v,...macCols.map(ci=>ci>=0?kNum(c[ci]):null)]);
  }
  return {items,col:head[kcalCol],macCols:macCols.map(ci=>ci>=0?head[ci]:null)};
}
function kcalParseJson(j){
  if(j&&!Array.isArray(j)&&Array.isArray(j.items))return {items:j.items,source:j.source};
  const arr=Array.isArray(j)?j:(j&&Array.isArray(j.foods)?j.foods:null);
  if(!arr)throw{userMsg:"JSON ohne erkennbare Lebensmittelliste."};
  return {items:arr.map(o=>Array.isArray(o)?o:[o&&(o.n??o.name??o.bezeichnung),o&&(o.kcal??o.per??o.energie_kcal),
    o&&(o.p??o.protein??o.eiweiss),o&&(o.f??o.fat??o.fett),o&&(o.c??o.carbs??o.kh??o.kohlenhydrate)])};
}
function kcalImportCat(e){
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  const finish=txt=>{
    let res=null,source=file.name.replace(/\.[^.]+$/,"").slice(0,80);
    try{
      txt=String(txt).replace(/^\uFEFF/,"");
      res=/^\s*[\[{]/.test(txt)?kcalParseJson(JSON.parse(txt)):kcalParseCsv(txt);
      if(res.source)source=String(res.source);
    }catch(err){kcalCatMsg="Import fehlgeschlagen: "+((err&&err.userMsg)||"Datei nicht lesbar.");render();return}
    const next=normalizeCat({source,imported:new Date().toISOString(),items:res.items});
    if(!next){kcalCatMsg="Import fehlgeschlagen: keine gültigen Einträge mit kcal gefunden.";render();return}
    if(!putStore(KCKEY,next)){
      kcalCatMsg="Import fehlgeschlagen: Der Speicher des Browsers ist voll.";
      if(kcalCat)putStore(KCKEY,kcalCat);else{try{localStorage.removeItem(KCKEY)}catch(x){}delete MEM[KCKEY]}
      storageFailed=false;                            // nur der Katalog passte nicht, sonst ist alles gespeichert
      render();return;
    }
    setKcalCat(next);
    const withMac=next.items.filter(it=>it.length>2).length;
    kcalCatMsg=`${kFmt(next.items.length)} Einträge importiert${res.col?` (kcal aus Spalte „${res.col}“)`:""}. `+
      (res.macCols?(res.macCols.some(Boolean)?`Makros: ${MAC_L.map((l,i)=>`${l} ${res.macCols[i]?`„${res.macCols[i]}“`:"nicht gefunden"}`).join(", ")}. `:"Keine Makro-Spalten gefunden. "):"")+
      `${kFmt(withMac)} Einträge mit Makros.`;
    window._kcalSetOpen=true;render();
  };
  // Erst UTF-8 versuchen; enthält das Ergebnis Ersatzzeichen, als Windows-1252 neu lesen (Umlaute aus Excel-CSV)
  const r=new FileReader();
  r.onload=()=>{
    const t=String(r.result);
    if(t.includes("\uFFFD")){const r2=new FileReader();r2.onload=()=>finish(r2.result);r2.readAsText(file,"windows-1252")}
    else finish(t);
  };
  r.readAsText(file,"utf-8");
}
function kcalRemoveCat(){
  if(!confirm("Katalog von diesem Gerät entfernen? Eigene Lebensmittel und Einträge bleiben erhalten."))return;
  setKcalCat(null);kcalCatMsg="Katalog entfernt.";
  try{localStorage.removeItem(KCKEY)}catch(e){}
  delete MEM[KCKEY];
  render();
}

/* v3.1: IDs auch beim Laden prüfen — nicht nur beim Import. Daten, die vor
   v2.1 (ohne Import-Filter) gespeichert wurden, könnten sonst unsichere IDs
   enthalten. Nur ungültige IDs werden ersetzt, Verweise mitgezogen. */
(function sanitizeIdsOnLoad(){
  const ok=id=>typeof id==="string"&&/^[A-Za-z0-9._-]+$/.test(id);
  const map={};let changed=false;
  habits.forEach(h=>{if(!ok(h.id)){const n=uid();map[String(h.id)]=n;h.id=n;changed=true}});
  if(changed)records.forEach(r=>{if(map[String(r.h)])r.h=map[String(r.h)]});
  todos.forEach(t=>{if(!ok(t.id)){t.id=uid();changed=true}});
  if(changed)save();
})();

startSinceTimer();
purgeOldTodos();
save();render();
