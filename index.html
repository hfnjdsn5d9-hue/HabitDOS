<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HabitDOS">
<meta name="theme-color" content="#0a0a0a">
<title>HabitDOS HTML v3.7</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   HABITDOS v3.7 — STILE
   Aufbau: 1 Tokens · 2 Basis · 3 Seitenkopf & Zusammenfassung
           4 Bausteine · 5 TODAY · 6 WEEK/MONTH/HISTORY/STATS
           7 Editor · 8 TODO-Matrix · 9 Navigation · 10 Overlays
           11 Hover · 12 Bewegung reduzieren
   ══════════════════════════════════════════════════════════════════ */

/* ── 1. Tokens ── */
:root{
  /* Flächen */
  --bg:#0a0a0a;--surface:#131313;--surface-2:#1b1b1b;
  --line:#262626;--line-2:#3a3a3a;
  /* Text — fg-3 ist die hellste Stufe, die auf allen Flächen ≥ 4,5:1 erreicht.
     fg-off nur für Dekoration (leere Balkenfelder), nie für Information. */
  --fg:#e6e6e6;--fg-2:#b0b0b0;--fg-3:#8c8c8c;--fg-off:#4a4a4a;
  /* Akzent: ein Grün, eine gedämpfte Stufe */
  --acc:#00ff41;--acc-2:#4ea84e;--acc-glow:rgba(0,255,65,.35);
  /* Status */
  --warn:#d9b264;--bad:#ff6b6b;--bad-line:#6b3030;--info:#8ab4d8;
  /* Abstände */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  /* Schrift */
  --t-xs:11px;--t-sm:13px;--t-md:15px;--t-lg:20px;--t-xl:24px;
  /* Maße */
  --tap:44px;--pad:16px;
  --nav-h:calc(54px + max(8px, env(safe-area-inset-bottom)));
  --font:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Courier New",monospace;
}

/* ── 2. Basis ── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
/* v3.4: touch-action:manipulation schaltet das Doppeltipp-Zoomen ab
   (schnelles +/+ zoomte bisher hinein). Zwei-Finger-Zoom bleibt erhalten. */
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--s5))}
button,input,label,summary,a,[data-act]{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
main{max-width:640px;margin:0 auto;padding:0 var(--pad) var(--s5)}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.02em;line-height:1.6;margin-top:var(--s4)}
.green,.donegreen{color:var(--acc)!important;text-shadow:0 0 10px var(--acc-glow)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line-2)}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--acc);animation:blink 1.1s steps(1) infinite;vertical-align:-.2em;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* ── 3. Seitenkopf (alle Seiten gleich) & Zusammenfassung ── */
.phead{position:sticky;top:0;z-index:20;background:var(--bg);
  margin:0 calc(var(--pad) * -1) var(--s4);
  padding:max(var(--s3), env(safe-area-inset-top)) var(--pad) var(--s3);
  border-bottom:1px solid var(--line)}
.phead-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);min-height:32px}
.phead-title{font-size:var(--t-md);font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  display:flex;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
.phead-title .p{color:var(--acc);margin-right:.6em}
.phead-title .t{overflow:hidden;text-overflow:ellipsis}
.phead-ctx{font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.06em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;min-width:0}
.phead-btn{flex:0 0 auto;min-height:var(--tap);padding:0 var(--s3);background:none;border:1px solid var(--line-2);
  color:var(--fg-2);font-size:var(--t-xs);font-weight:800;letter-spacing:.06em}
.phead-btn:active{background:var(--surface-2)}

/* Eine Zusammenfassung für TODAY, WEEK, MONTH und die Archive */
.sum{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding-top:var(--s2)}
.sum.box{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--acc-2);
  padding:var(--s3) var(--s4);margin:0 0 var(--s4)}
.sum.box.done{border-color:var(--acc-2);border-left-color:var(--acc)}
.sum-l{display:flex;align-items:baseline;gap:var(--s3);min-width:0}
.hero-pct{font-size:var(--t-xl);font-weight:800;line-height:1;letter-spacing:-.02em;color:var(--fg);min-width:3.4ch}
.hero-bar{font-size:var(--t-sm);letter-spacing:1px;line-height:1;color:var(--acc);white-space:nowrap;min-width:0;overflow:hidden}
.sum-r{font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.06em;text-align:right;white-space:nowrap}
.sum.done .hero-pct{color:var(--acc);text-shadow:0 0 8px var(--acc-glow)}
.sum.done .sum-r{color:var(--acc)}

/* Abschnittsüberschrift (TODAY-Liste und alle übrigen Seiten) */
.section-title,.tlsec{font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.14em;font-weight:800;
  margin:var(--s5) 0 var(--s2);display:flex;align-items:center;gap:var(--s2)}
.section-title::before,.tlsec::before{content:"──"}
.section-title::after,.tlsec::after{content:"";flex:1;border-top:1px solid var(--line)}
.tlsec{margin:var(--s4) 0 0;padding:0 var(--s1)}

/* ── 4. Bausteine ── */
.card,.detail-card{display:block;width:100%;text-align:left;background:var(--surface);color:var(--fg);
  border:1px solid var(--line);padding:var(--s4);margin:0 0 var(--s2)}
button.card:active{background:var(--surface-2);border-color:var(--line-2)}
.card.archived{border-style:dashed}
.card.archived .row b{color:var(--fg-2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.row b{font-size:var(--t-md);font-weight:800;letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row>span{flex:0 0 auto;font-weight:800}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s1) var(--s3);margin-top:var(--s2);
  font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.04em}
.mbar,.mini-bar{letter-spacing:1px;color:var(--acc);font-size:var(--t-sm);font-weight:800;white-space:nowrap;overflow:hidden}
.mini-bar{margin-top:var(--s2)}

.chk{font-weight:800;letter-spacing:1px}
.chk.na{color:var(--fg-3);font-weight:400}
.chk.limitred{color:var(--bad)}

.wide{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;
  background:var(--surface);color:var(--fg);border:1px solid var(--line-2);padding:var(--s3);margin-top:var(--s2);
  font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-align:center}
.wide:active{background:var(--surface-2)}
.wide.primary{border-color:var(--acc-2);color:var(--acc)}
.wide.secondary{background:transparent;border-color:var(--line);color:var(--fg-2);font-weight:400;letter-spacing:.04em}
.wide.danger{background:transparent;border-color:var(--bad-line);color:var(--bad)}
.file{position:relative;cursor:pointer}
.file input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file:focus-within{outline:2px solid var(--acc);outline-offset:2px}

.status-tag{display:inline-block;font-size:var(--t-xs);font-weight:400;letter-spacing:.1em;padding:0 6px;
  border:1px solid var(--line-2);color:var(--fg-3);margin-left:var(--s2);vertical-align:1px}
.status-tag.current{border-color:var(--acc-2);color:var(--acc)}
.readonly{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:var(--s2) 0;margin:0 0 var(--s4);
  font-size:var(--t-xs);letter-spacing:.1em;color:var(--fg-3);font-weight:800}

/* Periodennavigation ‹ KW 41 › — überall gleich */
.periodnav{display:grid;grid-template-columns:var(--tap) 1fr var(--tap);align-items:center;gap:var(--s2);margin:0 0 var(--s4)}
.periodnav>button{height:var(--tap);background:var(--surface);border:1px solid var(--line-2);
  color:var(--fg);font-size:var(--t-lg);font-weight:800;line-height:1;padding:0}
.periodnav>button:active{background:var(--surface-2)}
.pmid{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;
  font-size:var(--t-sm);font-weight:800;letter-spacing:.06em;min-width:0}
.pmid small{font-size:var(--t-xs);font-weight:400;color:var(--fg-3);letter-spacing:.02em}
.pjump{margin-top:var(--s1);min-height:32px;padding:0 var(--s3);background:none;border:1px solid var(--acc-2);
  color:var(--acc);font-size:var(--t-xs);font-weight:800;letter-spacing:.06em}
.pjump:active{background:var(--surface-2)}

.empty{border:1px dashed var(--line-2);padding:var(--s5) var(--s4);text-align:center;color:var(--fg-2);
  font-size:var(--t-sm);margin:var(--s2) 0 var(--s4)}
.empty .wide{margin-top:var(--s4)}

.milestone{border:1px dashed var(--acc-2);background:var(--surface);color:var(--acc);text-align:center;
  font-size:var(--t-xs);font-weight:800;letter-spacing:.14em;padding:var(--s3);margin:var(--s3) 0 0}

/* Farbstufen für Heatmap & Habit-Verlauf (vorher Inline-Styles) */
.lv0{color:var(--fg-off)}.lv1{color:var(--fg-3)}.lv2{color:var(--fg-2)}.lv3{color:var(--acc-2)}.lv4{color:var(--acc)}

/* ── 5. TODAY ── */
.tlrow{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:48px;padding:0 var(--s1);margin:0;
  background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font-size:var(--t-md);text-align:left}
button.tlrow:active{background:var(--surface-2)}
.tlrow:focus-visible{outline-offset:-2px}
.tlck{flex:0 0 auto;min-width:32px;font-weight:800}
.tlname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tlmeta{flex:0 0 auto;font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.04em;white-space:nowrap}
.tlrow.done .tlname,.tlrow.done .tlmeta{color:var(--fg-3)}
.tlbar{color:var(--acc-2);letter-spacing:1px}
.tlrow.reached .tlmeta,.tlrow.reached .tlbar{color:var(--acc)}
.tllimit{gap:6px;min-height:56px}
.tlcount{flex:0 0 auto;min-width:40px;font-weight:800;font-size:var(--t-sm)}
.tllimit.st-open .tlcount{color:var(--fg-3)}
.tllimit.st-ok .tlcount{color:var(--acc)}
.tllimit.st-edge .tlcount{color:var(--warn)}
.tllimit.st-over .tlcount{color:var(--bad)}
.tlbtn{flex:0 0 auto;width:var(--tap);height:var(--tap);border:1px solid var(--line-2);background:var(--surface);
  color:var(--fg);font-size:var(--t-lg);font-weight:800;line-height:1;padding:0}
.tlbtn:active{background:var(--surface-2);border-color:var(--fg-3)}
.tlzero{font-size:var(--t-xs);color:var(--fg-2)}
.tlzero.on{border-color:var(--acc-2);color:var(--acc)}

/* ── 6. WEEK / MONTH / HISTORY / STATS ── */
.table{overflow-x:auto;margin:0 0 var(--s2)}
.wh,.wr{display:grid;grid-template-columns:minmax(84px,1fr) repeat(7,minmax(26px,36px));align-items:center}
.wh{font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.04em;font-weight:800;border-bottom:1px solid var(--line-2)}
.wh span{text-align:center;line-height:1.3;padding:var(--s1) 0}
.wh span:first-child{text-align:left}
.wr{border-bottom:1px solid var(--line);min-height:52px}
.wr>span{align-self:stretch;display:flex;align-items:center;justify-content:center;font-size:var(--t-sm)}
.wr>div{display:flex;flex-direction:column;gap:2px;min-width:0;padding:var(--s2) var(--s2) var(--s2) 0}
.wr b{font-size:var(--t-sm);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr small{color:var(--fg-3);font-size:var(--t-xs);line-height:1.3}
.wh .today,.wr .today{background:var(--surface)}
.wh .today{color:var(--acc)}

.weekrows{margin:0 0 var(--s2)}
.weekrow{display:grid;grid-template-columns:48px 1fr 48px;gap:var(--s2);align-items:center;padding:var(--s2) 0;
  border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.weekrow:last-child{border:0}
.weekrow .wlabel{color:var(--fg-3);letter-spacing:.04em}
.weekrow .wbar{letter-spacing:1px;color:var(--acc-2);white-space:nowrap;overflow:hidden}
.weekrow .wpct{text-align:right;font-weight:800}
.weekrow.cur .wlabel,.weekrow.cur .wbar{color:var(--acc)}

.cmp-row{display:grid;grid-template-columns:1fr 64px 64px;gap:var(--s2);align-items:baseline;padding:var(--s2) 0;
  border-bottom:1px solid var(--line);font-size:var(--t-sm)}
.cmp-row .cmp-m{letter-spacing:.06em;color:var(--fg-2)}
.cmp-row .cmp-p{text-align:right;font-weight:800}
.cmp-row .cmp-d{text-align:right;font-size:var(--t-xs);color:var(--fg-3)}
.cmp-row .cmp-d.up{color:var(--acc)}
.cmp-row .cmp-d.down{color:var(--bad)}
.superlate{display:grid;grid-template-columns:104px 1fr;gap:var(--s2);padding:var(--s2) 0;font-size:var(--t-xs);
  letter-spacing:.04em;color:var(--fg-3);border-bottom:1px solid var(--line)}
.superlate:last-child{border:0}
.superlate b{color:var(--fg)}

.history-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);width:100%;min-height:56px;
  background:var(--surface);border:1px solid var(--line);padding:var(--s3) var(--s4);margin:0 0 var(--s2);
  text-align:left;color:var(--fg)}
.history-row:active{background:var(--surface-2);border-color:var(--line-2)}
.history-row b{font-size:var(--t-sm);font-weight:800}
.history-row small{display:block;margin-top:2px;color:var(--fg-3);font-size:var(--t-xs)}
.history-pct{font-size:var(--t-lg);font-weight:800;white-space:nowrap}

.heatmap{margin:0 0 var(--s2)}
.heat-row,.habit-hist-row{display:grid;grid-template-columns:48px 1fr 44px;gap:var(--s2);align-items:center;
  padding:6px 0;font-size:var(--t-sm)}
.heat-row .hm,.habit-hist-row .hh-m{color:var(--fg-3);letter-spacing:.04em}
.heat-row .hbar,.habit-hist-row .hh-bar{letter-spacing:1px;white-space:nowrap;overflow:hidden}
.heat-row .hp,.habit-hist-row .hh-p{text-align:right;font-weight:800;font-size:var(--t-xs)}
.habit-hist-row{border-bottom:1px solid var(--line)}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s2)}
.stat{background:var(--surface);border:1px solid var(--line);padding:var(--s3) var(--s4)}
.stat small{display:block;margin-bottom:var(--s1);font-size:var(--t-xs);letter-spacing:.1em;color:var(--fg-3);font-weight:800}
.stat b{font-size:var(--t-xl);font-weight:800}
.habit-pick{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);width:100%;min-height:var(--tap);
  text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--fg);padding:var(--s2) var(--s4);
  margin:0 0 var(--s2);font-size:var(--t-sm)}
.habit-pick:active{background:var(--surface-2)}
.habit-pick span:first-child{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-pick span:last-child{font-weight:800;color:var(--fg-2)}

/* Archiv-Abschnitt in HABITS */
.archive{margin-top:var(--s3)}
.archive>summary{list-style:none;min-height:var(--tap);display:flex;align-items:center;gap:var(--s2);cursor:pointer;
  font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.14em;font-weight:800}
.archive>summary::-webkit-details-marker{display:none}
.archive>summary::before{content:"▸"}
.archive[open]>summary::before{content:"▾"}

/* ── 7. Habit-Editor ── */
.field{display:block;margin:0 0 var(--s1)}
.flabel,.label{display:block;font-size:var(--t-xs);color:var(--fg-3);letter-spacing:.1em;font-weight:800;margin:var(--s5) 0 var(--s2)}
.field .flabel{margin-top:var(--s2)}
.input{display:block;width:100%;min-height:52px;background:var(--surface);border:1px solid var(--line-2);border-radius:0;
  color:var(--fg);padding:var(--s3) var(--s4);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.input::placeholder{color:var(--fg-3)}
.input:focus{border-color:var(--acc);outline:none}
.input[aria-invalid="true"]{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:var(--t-xs);letter-spacing:.04em;min-height:1.5em;margin-top:var(--s1)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
@media (min-width:480px){.seg.seg4{grid-template-columns:repeat(4,1fr)}}
.seg button{min-height:52px;background:var(--surface);color:var(--fg-2);border:1px solid var(--line);padding:var(--s2);
  font-size:var(--t-xs);font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.seg button::before{content:"□ "}
.seg button.sel{color:var(--acc);border-color:var(--acc)}
.seg button.sel::before{content:"■ "}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1)}
.days button{min-height:60px;background:var(--surface);border:1px solid var(--line);color:var(--fg-2);padding:0;
  font-size:var(--t-xs);font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.days button::before{content:"□";font-size:var(--t-sm)}
.days button.sel{color:var(--acc);border-color:var(--acc)}
.days button.sel::before{content:"■"}
.counter{display:grid;grid-template-columns:56px 1fr 56px;align-items:center;border:1px solid var(--line)}
.counter button{height:52px;background:none;border:0;color:var(--fg);font-size:var(--t-xl);font-weight:800;padding:0}
.counter button:active{background:var(--surface-2)}
.counter b{text-align:center;font-size:var(--t-lg);font-weight:800}
.ezone{margin-top:var(--s6);padding-top:var(--s2);border-top:1px dashed var(--line-2)}

/* ── 8. TODO-Matrix ──
   Wichtigkeit wird über Dunkelheit codiert: I am dunkelsten, IV am hellsten,
   dazu ein gedämpfter Farbakzent je Quadrant. */
.todoscreen{height:calc(100dvh - var(--nav-h) - var(--s5));max-width:640px;margin:0 auto;padding:0 var(--pad);
  display:flex;flex-direction:column;gap:var(--s2)}
@supports not (height:100dvh){.todoscreen{height:calc(100vh - var(--nav-h) - var(--s5))}}
.todoscreen .phead{position:static;flex:0 0 auto;margin-bottom:0}
.quickrow{display:flex;gap:var(--s2);flex:0 0 auto}
.quickrow input{flex:1;min-width:0;min-height:var(--tap);background:var(--surface);border:1px solid var(--line-2);border-radius:0;
  color:var(--fg);padding:0 var(--s3);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.quickrow input::placeholder{color:var(--fg-3)}
.quickrow input:focus{border-color:var(--acc);outline:none}
.quickrow button{flex:0 0 auto;width:52px;min-height:var(--tap);background:var(--surface);border:1px solid var(--line-2);
  color:var(--fg);font-size:var(--t-lg);font-weight:800;padding:0}
.quickrow button:active{background:var(--surface-2)}
.matrix{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--s2)}
.quad{display:flex;flex-direction:column;min-height:0;overflow:hidden;border:1px solid var(--line-2);background:var(--surface)}
.quad.inbox{flex:0 0 auto;max-height:136px;border-color:#5a5a5a;background:var(--surface-2)}
.quad.inbox .qnum,.quad.inbox .qcount,.quad.inbox .qlab b{color:var(--acc)}
.qh2{flex:0 0 auto;display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;
  padding:6px var(--s2);border-bottom:1px solid rgba(255,255,255,.08)}
.qnum{font-size:var(--t-xs);font-weight:800;text-align:center;line-height:1}
.qlab{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.qlab b,.qlab i{font-size:var(--t-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qlab b{font-weight:800;letter-spacing:.06em}

  });
  let doneN=0,target=0;
  Object.values(groups).forEach(g=>{
    if(g.freq.type==="times"){
      const n=g.days.filter(x=>done(h,x)).length;
      doneN+=Math.min(n,g.freq.count); target+=g.freq.count;
    }else if(g.freq.type==="limit"){
      // v2.1 (A4): only evaluate days that were actually tracked and not in the future.
      const days=g.days.filter(x=>!isFuture(x)&&limitEvaluated(h,x));
      doneN+=days.filter(x=>limitOk(h,x)).length; target+=days.length;
    }else{
      const dueDays=g.freq.type==="daily"?g.days:g.days.filter(x=>dueWithFreq(g.freq,x));
      doneN+=dueDays.filter(x=>done(h,x)).length; target+=dueDays.length;
    }
  });
  return {done:doneN,target};
}
function habitStartDay(h){
  let start=null;
  if(h.createdDay)start=parse(h.createdDay);
  else if(h.created){const c=new Date(h.created);if(!isNaN(c))start=logicalDay(c);}
  for(const r of records){
    if(r.h!==h.id||!/^\d{4}-\d{2}-\d{2}$/.test(r.d))continue;
    const d=parse(r.d); if(!start||d<start)start=d;
  }
  return start||today();
}
function dayStreak(h){
  const start=habitStartDay(h), end=today();
  const plain=d=>!isFlexible(h,d)&&!isLimit(h,d);
  let cur=0,d=end,g=0;
  if(due(h,d)&&!done(h,d))d=add(d,-1);                // heute noch offen
  while(g++<STREAK_GUARD&&d>=start&&plain(d)){
    if(due(h,d)){if(!done(h,d))break;cur++}
    d=add(d,-1);
  }
  let best=0,run=0;d=start;g=0;
  while(g++<STREAK_GUARD&&d<=end){
    if(!plain(d))run=0;
    else if(due(h,d)){
      if(done(h,d)){run++;if(run>best)best=run}
      else if(k(d)!==k(end))run=0;                       // heute offen bricht nicht
    }
    d=add(d,1);
  }
  return {current:cur,best:Math.max(best,cur),unit:"T"};
}
function weekStreak(h){
  const start=mon(habitStartDay(h)), curW=mon(today());
  const met=w=>{const p=weekProgVersioned(h,w);return p.target>0&&p.done>=p.target};
  let cur=0,w=curW,g=0;
  if(!met(w))w=add(w,-7);                               // laufende Woche offen
  while(g++<600&&w>=start&&isFlexible(h,w)){if(!met(w))break;cur++;w=add(w,-7)}
  let best=0,run=0;w=start;g=0;
  while(g++<600&&w<=curW){
    if(!isFlexible(h,w))run=0;
    else if(met(w)){run++;if(run>best)best=run}
    else if(k(w)!==k(curW))run=0;
    w=add(w,7);
  }
  return {current:cur,best:Math.max(best,cur),unit:"W"};
}
function limitStreak(h){
  const start=limitStartDate(h), end=today();
  let cur=0,d=end,g=0;
  while(g++<STREAK_GUARD&&d>=start&&isLimit(h,d)){
    if(limitEvaluated(h,d)){if(!limitOk(h,d))break;cur++}
    d=add(d,-1);
  }
  let best=0,run=0;d=start;g=0;
  while(g++<STREAK_GUARD&&d<=end){
    if(!isLimit(h,d))run=0;
    else if(limitEvaluated(h,d)){if(limitOk(h,d)){run++;if(run>best)best=run}else run=0}
    d=add(d,1);
  }
  return {current:cur,best:Math.max(best,cur),unit:"T"};
}
function habitStats(h){
  if(isLimit(h)){
    // For a limit habit, a "successful" day = at or under the max, counted from
    // the first logged day up to today. Streak = consecutive successful days.
    const logged=records.filter(r=>r.h===h.id&&typeof r.count==="number").map(r=>parse(r.d)).sort((a,b)=>a-b);
    const firstDay=logged.length?logged[0]:today();
    const {current,best,unit}=limitStreak(h);
    const overDays=logged.filter(x=>!limitOk(h,x)).length;
    const totalCount=records.filter(r=>r.h===h.id&&typeof r.count==="number").reduce((s,r)=>s+r.count,0);
    let targets=0,fulfilled=0;
    for(let y=firstDay.getFullYear(); y<=today().getFullYear(); y++){
      for(let m=0;m<12;m++){
        const mm=new Date(y,m,1);
        if(mm>today())continue;
        monthWeekStarts(mm).forEach(w=>{const p=weekProgVersioned(h,w);targets+=p.target;fulfilled+=p.done;});
      }
    }
    return {current,best,unit,totalDone:overDays,totalCount,p:targets?Math.round(fulfilled/targets*100):0,limit:true};
  }
  const all=records.filter(r=>r.h===h.id&&r.ok).map(r=>parse(r.d)).sort((a,b)=>a-b);
  const {current,best,unit}=isFlexible(h)?weekStreak(h):dayStreak(h);
  let totalDone=all.length;
  let targets=0,fulfilled=0;
  for(let y=all.length?all[0].getFullYear():today().getFullYear(); y<=today().getFullYear(); y++){
    for(let m=0;m<12;m++){
      const mm=new Date(y,m,1);
      if(mm>today())continue;
      monthWeekStarts(mm).forEach(w=>{
        const p=weekProgVersioned(h,w);
        targets+=p.target; fulfilled+=p.done;
      });
    }
  }
  return {current,best,unit,totalDone,p:targets?Math.round(fulfilled/targets*100):0};
}
function monthProgVersioned(h,m){
  let doneN=0,target=0;
  monthDays(m).forEach(d=>{
    if(isFuture(d))return;
    const f=freqForDate(h,d);
    if(f.type==="limit"){
      if(!limitEvaluated(h,d))return;   // v2.2: only counted or confirmed days are scored
      target++; if(limitOk(h,d))doneN++;
    }else if(f.type!=="times"){
      if(dueWithFreq(f,d)){target++;if(done(h,d))doneN++}
    }
  });
  monthWeekStarts(m).forEach(w=>{
    const ds=week(w).filter(d=>d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear());
    const groups={};
    ds.forEach(x=>{const f=freqForDate(h,x),key=JSON.stringify(f);(groups[key]??={freq:f,days:[]}).days.push(x)});
    Object.values(groups).forEach(g=>{
      if(g.freq.type==="times"){
        target+=g.freq.count;
        doneN+=Math.min(g.days.filter(x=>done(h,x)).length,g.freq.count);
      }
    });
  });
  return {done:doneN,target,p:target?Math.round(doneN/target*100):0};
}
function monthOverall(m){
  const ps=active().map(h=>monthProgVersioned(h,m));
  return total(ps);
}
function yearOverall(y){
  let vals=[];
  for(let m=0;m<12;m++){
    const d=new Date(y,m,1);
    if(d>today())break;
    vals.push({month:d,p:monthOverall(d)});
  }
  return vals;
}

function active(){return habits.filter(h=>!h.arch)}
function due(h,d){return dueWithFreq(freqForDate(h,d),d)}
function done(h,d){return recsFor(h,d).some(r=>r.ok)}

/* ── v2.0/2.1: limit-type habits (fewer = better) ── */
function isLimit(h,d=today()){return freqForDate(h,d).type==="limit";}
function limitMax(h,d=today()){const f=freqForDate(h,d);return f.type==="limit"?(f.max??0):0;}
// daily count for a limit habit (records carry {count} instead of {ok})
function limitCount(h,d){
  const r=recsFor(h,d).find(r=>typeof r.count==="number");
  return r?r.count:0;
}
// v2.1 (A1): the first day a limit habit may be evaluated (first log, else created, else today)
function limitStartDate(h){
  const logged=records
    .filter(r=>r.h===h.id&&typeof r.count==="number")
    .map(r=>r.d).sort();
  if(logged.length)return parse(logged[0]);
  if(h.createdDay)return parse(h.createdDay);            // v2.5: logischer Tag, zeitzonensicher
  if(h.created)return logicalDay(new Date(h.created));   // Rückfall für ältere Einträge
  return today();
}
function limitActiveOn(h,d){return isoDate(d)>=isoDate(limitStartDate(h));}
// A record for this limit habit exists on day d (day was actually tracked)?
/* v2.2: a day is "evaluated" if it was counted (>0) OR explicitly confirmed as zero.
   Untracked days count neither positive nor negative. */
function limitConfirmed(h,d){
  return recsFor(h,d).some(r=>r.confirmed===true);
}
function limitEvaluated(h,d){
  return limitCount(h,d)>0 || limitConfirmed(h,d);
}
// "success" for a limit habit on a day = stayed at or under the max
function limitOk(h,d){return limitCount(h,d)<=limitMax(h,d);}

/* v2.1 (B3): time since the last count, in 5-minute steps */
function limitLastStamp(h){
  const recs=records.filter(r=>r.h===h.id&&Array.isArray(r.ts)&&r.ts.length);
  if(!recs.length)return null;
  let latest=null;
  recs.forEach(r=>r.ts.forEach(s=>{ if(typeof s==="string"&&(!latest||s>latest))latest=s; }));
  return latest?new Date(latest):null;
}
function limitSinceText(h,now=new Date()){
  const last=limitLastStamp(h);
  if(!last||isNaN(last))return "NOCH NICHT ERFASST";
  const rawMin=Math.floor((now-last)/60000);
  if(rawMin<0)return "GERADE EBEN";                       // clock moved back
  const dayDiff=Math.round((logicalDay(now)-logicalDay(last))/86400000);
  if(dayDiff===1)return "GESTERN";
  if(dayDiff>1)return `VOR ${dayDiff} TAGEN`;
  if(rawMin<5)return "GERADE EBEN";
  if(rawMin<60)return `VOR ${Math.floor(rawMin/5)*5} MIN`;
  if(rawMin<90){
    const m=Math.floor((rawMin-60)/5)*5;
    return m?`VOR 1 STD ${m} MIN`:"VOR 1 STD";
  }
  const halfHours=Math.floor(rawMin/30)/2;                // round down to half hours
  return `VOR ${String(halfHours).replace(".",",")} STD`;
}

function total(ps){
  let a=ps.reduce((s,x)=>s+x.done,0),b=ps.reduce((s,x)=>s+x.target,0);
  return{done:a,target:b,p:b?Math.round(a/b*100):0};
}
function dayComplete(d){
  // v2.2: obligations = daily / fixed-weekday habits, plus limit habits that were
  // actually evaluated that day (counted or confirmed as zero). An untracked limit
  // day is neutral: it neither completes nor breaks the day.
  let dueH=active().filter(h=>!isFlexible(h,d)&&due(h,d)
    &&(!isLimit(h,d)||(limitActiveOn(h,d)&&limitEvaluated(h,d))));
  if(!dueH.length)return false;
  return dueH.every(h=>successToday(h,d));
}
function globalStreak(){
  let n=0,d=today(),guard=0;
  while(dayComplete(d) && guard++ < 3650){n++;d=add(d,-1)}   // A1: hard safety cap (~10y)
  return n;
}
/* ── v1.9: TODAY = only today's obligations (Option C) ── */
// A habit is "flexible" if today's active frequency is a weekly-count goal.
function isFlexible(h,d=today()){return freqForDate(h,d).type==="times";}
// v2.0: unified "success today" — limit habits succeed by staying under max.
function successToday(h,d=today()){
  // v2.2: a limit habit only succeeds on a day that was counted or confirmed as zero.
  // An untracked day is neutral (handled by dayComplete/scoring), never an automatic win.
  return isLimit(h,d) ? (limitEvaluated(h,d)&&limitOk(h,d)) : done(h,d);
}
// Obligations = daily + fixed-weekday + limit habits that are due today (not flexible).
function todayObligations(){return active().filter(h=>!isFlexible(h)&&due(h,today()));}
// Flexible habits still open this week (shown as optional chips).
function todayFlexibles(){return active().filter(h=>isFlexible(h));}
// TODAY percentage counts only today's obligations: each is 1 target, success=1/0.
// v2.2: a limit habit joins the target only once it was counted or confirmed.
function todayProgress(){
  const obl=todayObligations().filter(h=>!isLimit(h)||limitEvaluated(h,today()));
  const done_=obl.filter(h=>successToday(h)).length;
  return{done:done_,target:obl.length,p:obl.length?Math.round(done_/obl.length*100):0};
}

function weekStatus(wStart){
  const curW=mon(today());
  if(k(wStart)===k(curW))return"current";
  if(wStart>curW)return"future";
  return"archived";
}
function monthStatus(m){
  const cur=new Date(today().getFullYear(),today().getMonth(),1);
  if(m.getFullYear()===cur.getFullYear()&&m.getMonth()===cur.getMonth())return"current";
  if(m>cur)return"future";
  return"archived";
}
/* overall % for one week restricted to a given month */
function weekOverallInMonth(wStart){
  const ps=active().map(h=>weekProgVersioned(h,wStart));
  return total(ps);
}
/* best & worst overall month across recorded history (12) */
function bestWorstMonths(){
  if(!records.length)return null;
  const dates=records.filter(r=>r.ok).map(r=>parse(r.d));
  if(!dates.length)return null;
  let min=dates[0],max=dates[0];
  dates.forEach(d=>{if(d<min)min=d;if(d>max)max=d;});
  let vals=[];
  let m=new Date(min.getFullYear(),min.getMonth(),1);
  const end=new Date(today().getFullYear(),today().getMonth(),1);
  while(m<=end){
    const o=monthOverall(m);
    if(o.target>0)vals.push({label:m.toLocaleDateString("de-DE",{month:"short",year:"numeric"}).toUpperCase(),p:o.p});
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  if(!vals.length)return null;
  let best=vals[0],worst=vals[0];
  vals.forEach(v=>{if(v.p>best.p)best=v;if(v.p<worst.p)worst=v;});
  return{best,worst};
}

function historyWeeks(y){
  let out=[];
  const start=new Date(y,0,1), end=new Date(y,11,31), w=mon(start);
  for(let d=new Date(w);d<=end;d=add(d,7)){
    if(d<today() && d.getFullYear()===y && d.getMonth()>=0) out.push(d);
  }
  return out.reverse();
}

/* v1.8: all-time aggregate metrics */
function allTimeStats(){
  const okRecs=records.filter(r=>r.ok);
  const checks=okRecs.length;
  if(!checks)return{checks:0,p:0,bestStreak:0,weeks100:0,months100:0};
  const dates=okRecs.map(r=>parse(r.d));
  let min=dates[0];dates.forEach(d=>{if(d<min)min=d});
  let targets=0,fulfilled=0,weeks100=0,months100=0;
  const acts=active();
  // iterate months from first record to current
  let m=new Date(min.getFullYear(),min.getMonth(),1);
  const end=new Date(today().getFullYear(),today().getMonth(),1);
  while(m<=end){
    const mo=monthOverall(m);
    if(mo.target>0){targets+=mo.target;fulfilled+=mo.done;if(mo.p===100)months100++;}
    m=new Date(m.getFullYear(),m.getMonth()+1,1);
  }
  // count 100% weeks
  let w=mon(min);
  const wend=mon(today());
  while(w<=wend){
    const wo=total(acts.map(h=>weekProgVersioned(h,w)));
    if(wo.target>0&&wo.p===100)weeks100++;
    w=add(w,7);
  }
  const bestStreak=acts.reduce((a,h)=>Math.max(a,habitStats(h).best),0);
  return{checks,p:targets?Math.round(fulfilled/targets*100):0,bestStreak,weeks100,months100};
}

function limitRow(h){
  const c=limitCount(h,today()), mx=limitMax(h), over=c>mx;
  const evaluated=limitEvaluated(h,today()), conf=limitConfirmed(h,today());
  const st=!evaluated?"open":(over?"over":(c===mx?"edge":"ok"));
  const count=evaluated?`${c}/${mx}`:`–/${mx}`;
  const zero=(c===0)

function todayView(){

  // Reihenfolge: offene zuerst, erledigte ans Ende — jeweils in der gewohnten Reihenfolge.
  const isDoneObl=h=>!isLimit(h)&&done(h,today());
  const oblSorted=[...obl.filter(h=>!isDoneObl(h)),...obl.filter(isDoneObl)];
  const dateShort=new Intl.DateTimeFormat("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"}).format(today()).toUpperCase().replace(/\.,?/,"").replace(",","");
  const statR=obl.length?`${x.done}/${x.target}${streak>=2?` · SERIE ${streak}`:""}`:"KEINE PFLICHT";
  const head=header("TODAY",dateShort,"",summary(x,statR,false));
  let body="";

  return `<main class="tl">${head}${milestoneBanner(streak)}${body}</main>`;

function monthView(){
  const st=monthStatus(month);
  const ps=active().map(h=>monthProgVersioned(h,month)), x=total(ps);
  const mlabel=month.toLocaleDateString("de-DE",{month:"long",year:"numeric"}).toUpperCase();
  const nav=periodNav({prev:"changeMonth(-1)",next:"changeMonth(1)",prevL:"Vorheriger Monat",nextL:"Nächster Monat",
    label:`${mlabel}${statusTag(st)}`,
    jump:st!=="current"?"month=new Date(today().getFullYear(),today().getMonth(),1);render()":"",jumpL:"ZUM AKTUELLEN MONAT"});
  if(!active().length)return `<main>${header("MONTH")}${nav}${emptyState("Noch keine Habits für die Monatsübersicht.")}</main>`;
  // week rows (10)
  const wStarts=monthWeekStarts(month);
  const weekRows=`<div class="section-title">WOCHEN</div><div class="weekrows">${wStarts.map(w=>{
    const wo=weekOverallInMonth(w), cur=k(mon(today()))===k(w);
    return `<div class="weekrow ${cur?"cur":""}"><span class="wlabel">KW${weekNumber(w)}</span><span class="wbar">${bar(wo.done,wo.target,18)}</span><span class="wpct">${wo.p}%</span></div>`;
  }).join("")}</div>`;
  // month comparison vs previous (11)
  const prevM=new Date(month.getFullYear(),month.getMonth()-1,1);
  let cmp="";
  if(prevM<=new Date(today().getFullYear(),today().getMonth(),1)){
    const prevP=monthOverall(prevM).p, curP=x.p, d=curP-prevP;
    const dCls=d>0?"up":d<0?"down":"";
    const dTxt=d===0?"±0":(d>0?`+${d}%`:`${d}%`);
    cmp=`<div class="section-title">VERGLEICH</div><div class="cmp-row"><span class="cmp-m">${prevM.toLocaleDateString("de-DE",{month:"short"}).toUpperCase()}</span><span class="cmp-p">${prevP}%</span><span class="cmp-d"></span></div><div class="cmp-row"><span class="cmp-m">${month.toLocaleDateString("de-DE",{month:"short"}).toUpperCase()}</span><span class="cmp-p">${curP}%</span><span class="cmp-d ${dCls}">${dTxt}</span></div>`;
  }
  // best / worst month across all history (12)
  const bw=bestWorstMonths();
  const bwBlock = bw ? `<div class="section-title">EXTREMWERTE</div><div class="superlate"><span>BESTER</span><b>${bw.best.label} · ${bw.best.p}%</b></div><div class="superlate"><span>SCHWÄCHSTER</span><b>${bw.worst.label} · ${bw.worst.p}%</b></div>` : "";
  return`<main>${header("MONTH")}${nav}${summary(x)}${weekRows}<div class="section-title">HABITS</div>${active().map(h=>{let p=monthProgVersioned(h,month);return`<div class="card"><div class="row"><b>${esc(h.name)}</b><span>${p.p}%</span></div><div class="meta"><span class="mbar">${bar(p.done,p.target,14)}</span><span>${p.done}/${p.target}</span></div></div>`}).join("")}${cmp}${bwBlock}<div class="hint">Flexible Habits werden nach Wochen ab Montag bewertet. Wischen wechselt den Monat.</div></main>`;
}

function habitHistoryView(){
  const h=habits.find(x=>x.id===historyHabitId);
  if(!h){tab="stats";return statsView();}
  const s=habitStats(h);
  // determine year span
  const okRecs=records.filter(r=>r.h===h.id&&r.ok).map(r=>parse(r.d));
  const firstY=okRecs.length?Math.min(...okRecs.map(d=>d.getFullYear())):today().getFullYear();
  const curY=today().getFullYear();
  let yearsBlocks="";
  for(let y=curY;y>=firstY;y--){
    let rows="";
    for(let mi=0;mi<12;mi++){
      const mm=new Date(y,mi,1);
      if(mm>today())continue;
      const p=monthProgVersioned(h,mm);
      if(p.target===0)continue;
      const label=mm.toLocaleDateString("de-DE",{month:"short"}).toUpperCase();
      rows+=`<div class="habit-hist-row"><span class="hh-m">${label}</span><span class="hh-bar ${heatCls(p.p)}" aria-hidden="true">${bar(p.p,100,16)}</span><span class="hh-p">${p.p}%</span></div>`;
    }
    if(rows)yearsBlocks+=`<div class="section-title">${y}</div>${rows}`;
  }
  if(!yearsBlocks)yearsBlocks='<div class="hint">Noch keine Daten für diesen Habit.</div>';
  // habit CV / version history (19)
  let cv="";
  if(h.versions&&h.versions.length>1){
    cv=`<div class="section-title">VERLAUF</div>`+h.versions.slice().sort((a,b)=>a.from<b.from?-1:1).map(v=>{

      return `<div class="superlate"><span>${d}</span><b>${freqLabel(v.freq)}</b></div>`;
    }).join("");
  }
  return `<main>${header("HABIT","EINZELVERLAUF")}<div class="detail-card"><div class="row"><b>${esc(h.name)}</b><span class="${s.p>=90?"green":""}">${s.p}%</span></div><div class="mini-bar">${bar(s.p,100,20)}</div><div class="meta"><span>${streakTxt(s,"STREAK")}</span><span>${streakTxt(s,"BEST")}</span><span>GESAMT ${s.totalDone}</span></div></div>${cv}${yearsBlocks}<button class="wide secondary" onclick="setTab('stats')">‹ STATS</button></main>`;
}

function quadrant(q){
  const items=todos.filter(t=>t.q===q).sort((a,b)=>(a.done===b.done)?0:a.done?1:-1);
  const open=items.filter(t=>!t.done).length;
  const [l1,l2]=qshort(q);
  return`<div class="quad q${q}">`+
    `<div class="qh2"><span class="qnum">${qroman(q)}</span>`+
      `<span class="qlab"><b>${l1}</b><i>${l2}</i></span>`+
      `<span class="qcount">${open}</span></div>`+
    `<div class="qbody">${items.length?items.map(t=>todoRow(t)).join(""):'<div class="qempty">leer</div>'}</div>`+
  `</div>`;
}
/* AKTUELL = quick inbox (q:0), not yet sorted into the matrix */
function inboxSection(){
  const items=todos.filter(t=>(t.q??0)===0).sort((a,b)=>(a.done===b.done)?0:a.done?1:-1);
  const open=items.filter(t=>!t.done).length;
  return `<div class="quad inbox"><div class="qh2"><span class="qnum">&gt;</span>`+
    `<span class="qlab"><b>AKTUELL</b><i>UNSORTIERT</i></span>`+
    `<span class="qcount">${open}</span></div>`+
    `<div class="qbody">${items.length?items.map(t=>todoRow(t)).join(""):'<div class="qempty">Nichts offen. Oben eintippen und Enter drücken.</div>'}</div></div>`;
}
function todoView(){
  const open=todos.filter(t=>!t.done).length;
  const inboxOpen=todos.filter(t=>(t.q??0)===0&&!t.done).length;
  const q1=todos.filter(t=>t.q===1&&!t.done).length;
  // v2.6: fester Bildschirm — Kopf schlank, Matrix füllt den Rest.
  return`<main class="todoscreen">`+
    header("MATRIX",`${open} OFFEN${q1?` · ${q1} SOFORT`:""}`)+

    (inboxOpen||todos.some(t=>(t.q??0)===0)?inboxSection():"")+

  `</main>`;
}
function tabs(){
  const main=[["today","TODAY"],["todo","TODO"],["kcal","KCAL"],["week","WEEK"],["month","MONTH"]];
  const more=[["history","HISTORY"],["habits","HABITS"],["stats","STATS"]];
  const navTab=PARENT_TAB[tab]||tab;              // v3.4: Unterseiten zählen zum Eltern-Reiter
  const moreSel=MORE_TABS.includes(navTab);       // ein Unterpunkt ist die aktive Seite
  const moreOpen=!!window._moreOpen;              // das Menü ist gerade aufgeklappt
  /* v3.0: drei eindeutige Zustände statt zwei.
     sel = grün, das ist gerade angetippt/aktiv
     cur = gedämpft, das ist die Seite dahinter, während das Menü offen ist
     (leer) = inaktiv */
  const mainBtns=main.map(x=>{
    const isCur=(navTab===x[0]);
    const cls=isCur ? (moreOpen ? "cur" : "sel") : "";
    return `<button class="${cls}" onclick="navTo('${x[0]}')"${isCur?' aria-current="page"':""}>${x[1]}</button>`;
  }).join("");
  /* v3.4: Das Menü öffnet nur auf Tipp; ist eine Unterseite aktiv, trägt der Knopf ihren Namen. */
  const moreCls=(moreOpen||moreSel) ? "sel" : "";
  const moreLabel=moreSel ? more.find(x=>x[0]===navTab)[1] : "MORE";
  const pop=moreOpen

}

    case "historyMonth":html=archivedMonthView(historyMonthDate);break;

    case "stats":html=statsView();break;
    case "habitHistory":html=habitHistoryView();break;

  editorOpen=false;

/* ══════════════════════════════════════════════════════════════════
   7. ANIMATION
   Effekte nach dem Rendern. Ändern nie Daten, respektieren 'Bewegung reduzieren'.
   ══════════════════════════════════════════════════════════════════ */

function reducedMotion(){
  try{return window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}
  catch(e){return false}
}
function animateNumber(el,from,to,suffix,ms){
  if(from===to||!(ms>0)){el.textContent=to+suffix;return}
  const start=performance.now();
  let frames=0;
  function step(now){
    const p=Math.min(1,(now-start)/ms);
    const eased=1-Math.pow(1-p,3);            // schnell anlaufen, sanft auslaufen
    el.textContent=Math.round(from+(to-from)*eased)+suffix;
    // Sicherheitsnetz: endet auch, falls die Zeitquelle nicht fortschreitet
    if(p<1&&++frames<120)requestAnimationFrame(step);
    else el.textContent=to+suffix;
  }
  requestAnimationFrame(step);
}
function animateBar(el,from,to,w,ms){
  if(from===to||from<0||to<0){return}
  const steps=Math.abs(to-from);
  const per=Math.max(40,Math.min(90,ms/Math.max(1,steps)));
  let cur=from;
  const dir=to>from?1:-1;
  function tick(){
    cur+=dir;
    el.textContent="█".repeat(Math.max(0,cur))+"░".repeat(Math.max(0,w-cur));
    if(cur!==to)setTimeout(tick,per);
  }
  el.textContent="█".repeat(Math.max(0,from))+"░".repeat(Math.max(0,w-from));
  setTimeout(tick,per);
}
function animateCheckbox(wrap){
  const el=wrap.querySelector(".chk")||wrap;   // Farbklasse muss erhalten bleiben
  const final=el.textContent;
  if(final.indexOf("X")<0)return;              // nur beim Abhaken, nicht beim Lösen
  el.textContent="[·]";
  setTimeout(()=>{el.textContent=final},110);
}
function showDayComplete(streak){
  if(document.querySelector(".dayoverlay"))return;
  const ov=document.createElement("div");
  ov.className="dayoverlay";
  ov.innerHTML=`<div class="dobox"><div class="doline">&gt; TAG ABGESCHLOSSEN</div>`+
    `<div class="dobar">${"█".repeat(20)}</div>`+
    `<div class="dopct">100%</div>`+
    (streak>=2?`<div class="dostreak">SERIE: ${streak} TAGE</div>`:"")+
    `<div class="docur"><span class="cursor"></span></div></div>`;
  ov.addEventListener("click",()=>ov.remove());
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add("on"));
  setTimeout(()=>{ov.classList.remove("on");setTimeout(()=>ov.remove(),260)},1700);
}
function runAnimations(){
  const skip=reducedMotion();
  // 1) Prozentzahl hochzählen
  document.querySelectorAll(".hero-pct[data-pct]").forEach(el=>{
    const to=Number(el.getAttribute("data-pct"));
    const suffix=el.getAttribute("data-suffix")||"";
    const key="pct:"+tab;
    const from=(animPrev[key]==null)?to:animPrev[key];
    animPrev[key]=to;
    if(!skip)animateNumber(el,from,to,suffix,420);
    else el.textContent=to+suffix;
  });
  // 2) Balken füllen
  document.querySelectorAll(".hero-bar[data-fill]").forEach(el=>{
    const to=Number(el.getAttribute("data-fill"));
    const w=Number(el.getAttribute("data-w"))||20;
    const key="bar:"+tab;
    const from=(animPrev[key]==null)?to:animPrev[key];
    animPrev[key]=to;
    if(!skip)animateBar(el,from,to,w,320);
  });
  // 3) Kästchen-Mikroanimation auf dem gerade angetippten Habit
  if(justToggledId&&!skip){
    const el=document.querySelector(`[data-habit-chk="${CSS&&CSS.escape?CSS.escape(justToggledId):justToggledId}"]`);
    if(el)animateCheckbox(el);
  }
  justToggledId=null;
  // 4) Tagesabschluss — nur beim Übergang auf 100 %, nicht bei jedem Öffnen
  if(tab==="today"){
    const p=todayProgress();
    const nowDone=(p.target>0&&p.p===100);
    if(prevDayDone===false&&nowDone&&!skip)showDayComplete(globalStreak());
    prevDayDone=nowDone;
  }
}
/* ══════════════════════════════════════════════════════════════════
   8. AKTIONEN
   Alles, was Daten verändert: Abhaken, Zählen, Aufgaben, Editor, Import/Export.
   ══════════════════════════════════════════════════════════════════ */

// Confirm a zero-day (or un-confirm it again)
function limitConfirmZero(h,d=today()){
  const key=k(d);
  let i=records.findIndex(r=>r.h===h.id&&r.d===key&&(typeof r.count==="number"||r.confirmed===true));
  if(i>=0){
    if(records[i].confirmed){                       // toggle off
      if(!records[i].count)records.splice(i,1);
      else delete records[i].confirmed;
    }else records[i].confirmed=true;
  }else{
    records.push({h:h.id,d:key,count:0,confirmed:true});
  }
  save();render();
}

// v2.1 (B2): +1 appends a timestamp
function limitInc(h,d=today()){
  const key=k(d);
  let i=records.findIndex(r=>r.h===h.id&&r.d===key&&typeof r.count==="number");
  const stamp=new Date().toISOString();
  if(i>=0){
    records[i].count=records[i].count+1;
    if(records[i].confirmed)delete records[i].confirmed;   // v2.2: real count supersedes "confirmed 0"
    (records[i].ts??=[]).push(stamp);
  }
  else records.push({h:h.id,d:key,count:1,ts:[stamp]});
  save();render();
}
// v2.1 (B2): -1 removes the most recent timestamp
function limitDec(h,d=today()){
  const key=k(d);
  let i=records.findIndex(r=>r.h===h.id&&r.d===key&&typeof r.count==="number");
  if(i<0)return;
  const next=Math.max(0,records[i].count-1);
  if(next===0&&!records[i].confirmed){ records.splice(i,1); }
  else{
    records[i].count=next;
    if(Array.isArray(records[i].ts)&&records[i].ts.length){records[i].ts.sort();records[i].ts.pop();}
  }
  save();render();
}
function toggle(h,d=today()){
  if(isLimit(h,d))return;                                 // A5: never write ok on a limit habit
  if(!due(h,d))return;
  let i=records.findIndex(r=>r.h===h.id&&r.d===k(d));
  if(i>=0)records[i].ok=!records[i].ok;
  else records.push({h:h.id,d:k(d),ok:true});
  save();render();
}
function quickAddTodo(){

function resetData(){

  habits=[];records=[];todos=[];

  putStore(SCROLLKEY,{});

}

function normalizeImportedHabit(h){
  if(!h||typeof h!=="object")return null;
  const out={
    id:String(h.id||""),                       // real sanitizing happens in sanitizeImport
    name:String(h.name==null?"Unbenannt":h.name).slice(0,120),
    arch:!!h.arch,
    created:(typeof h.created==="string"&&h.created)?h.created:new Date().toISOString()
  };
  if(typeof h.createdDay==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(h.createdDay))out.createdDay=h.createdDay;
  let f=(h.freq&&VALID_TYPES.includes(h.freq.type))?h.freq:{type:"daily"};
  if(f.type==="times")f={type:"times",count:Math.max(1,Math.min(7,Number(f.count)||3))};
  else if(f.type==="limit")f={type:"limit",max:Math.max(0,Math.min(99,Number(f.max)??5))};
  else if(f.type==="days"){
    const days=Array.isArray(f.days)?[...new Set(f.days.filter(n=>n>=1&&n<=7))].sort((a,b)=>a-b):[];
    f=days.length?{type:"days",days}:{type:"daily"};
  }else f={type:"daily"};
  out.freq=f;
  out.versions=(Array.isArray(h.versions)?h.versions.filter(v=>v&&v.from&&v.freq&&VALID_TYPES.includes(v.freq.type)):[]);
  if(!out.versions.length)out.versions=[{from:"2000-01-01",freq:cloneFreq(f)}];
  return out;
}
function sanitizeImport(x){
  const idMap={}, safe=s=>String(s).replace(/[^A-Za-z0-9._-]/g,"");
  let dropped=0;
  // habits
  const habs=[];
  (Array.isArray(x.habits)?x.habits:[]).forEach(raw=>{
    const h=normalizeImportedHabit(raw);
    if(!h){dropped++;return;}
    const old=String(raw&&raw.id!=null?raw.id:"");
    let nid=safe(old);
    if(!nid||idMap[old]!==undefined||habs.some(e=>e.id===nid))nid=uid();
    idMap[old]=nid; h.id=nid;
    habs.push(h);
  });
  const validIds=new Set(habs.map(h=>h.id));
  // records
  const recs=[];
  (Array.isArray(x.records)?x.records:[]).forEach(r=>{
    if(!r||typeof r!=="object"){dropped++;return;}
    let hid=idMap[String(r.h)]??safe(r.h);
    if(!validIds.has(hid)){dropped++;return;}
    if(!isValidDateKey(r.d)){dropped++;return;}
    const out={h:hid,d:String(r.d)};
    if(typeof r.count==="number"&&isFinite(r.count)){
      out.count=Math.max(0,Math.floor(r.count));
      if(Array.isArray(r.ts)){
        const ts=r.ts.filter(s=>typeof s==="string"&&!isNaN(Date.parse(s)));
        if(ts.length)out.ts=ts;
      }
    }else{
      out.ok=!!r.ok;
    }
    recs.push(out);
  });
  // todos
  const tds=[];
  (Array.isArray(x.todos)?x.todos:[]).forEach(t=>{
    if(!t||typeof t!=="object"){dropped++;return;}
    let tid=safe(t.id); if(!tid||tds.some(e=>e.id===tid))tid=uid();
    const q=[0,1,2,3,4].includes(t.q)?t.q:0;     // v2.2: 0 = AKTUELL (quick inbox)
    const out={id:tid,text:String(t.text==null?"":t.text).slice(0,500),q,done:!!t.done};
    if(typeof t.created==="string"&&!isNaN(Date.parse(t.created)))out.created=t.created;
    if(out.done){
      out.doneAt=(typeof t.doneAt==="string"&&!isNaN(Date.parse(t.doneAt)))?t.doneAt:new Date().toISOString();
    }
    tds.push(out);
  });
  return {habits:habs,records:recs,todos:tds,dropped};
}
function restore(e){
  let file=e.target.files[0];if(!file)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let x=JSON.parse(r.result);
      if(!x||typeof x!=="object"||!Array.isArray(x.habits)||!Array.isArray(x.records))throw 0;
      const clean=sanitizeImport(x);
      if(!clean.habits.length && (x.habits.length>0))throw 0;   // structurally unusable
      habits=clean.habits;records=clean.records;todos=clean.todos;
      // v3.5: kcal-Teil nur übernehmen, wenn das Backup ihn enthält —
      // ältere Backups lassen die kcal-Daten auf dem Gerät unangetastet.
      let kmsg="";
      if(x.kcal&&typeof x.kcal==="object"){kcal=normalizeKcal(x.kcal);kcalPanel=null;saveKcal();kmsg=` kcal: ${kcal.log.length} Einträge, ${kcal.foods.length} eigene Lebensmittel.`}
      if(x.kcalCatalog){const c=normalizeCat(x.kcalCatalog);if(c){if(putStore(KCKEY,c)){setKcalCat(c);kmsg+=` Katalog: ${c.items.length} Einträge.`}else{storageFailed=false;kmsg+=" Katalog passte nicht in den Speicher."}}}
      save();render();
      alert((clean.dropped>0
        ? `HabitDOS-Daten importiert. ${clean.dropped} ungültige Einträge übersprungen.`
        : "HabitDOS-Daten wurden importiert.")+kmsg);
    }catch(err){alert("Ungültige HabitDOS-Backup-Datei.");}
  };
  r.readAsText(file);
}

function toggleTodo(id){
  let t=todos.find(x=>x.id===id);
  if(t){
    t.done=!t.done;
    if(t.done)t.doneAt=new Date().toISOString();   // v2.2: needed for the 24h cleanup
    else delete t.doneAt;
    save();render();
  }
}
function purgeOldTodos(){
  const now=Date.now();
  const before=todos.length;
  todos=todos.filter(t=>{
    if(!t.done)return true;
    if(!t.doneAt){t.doneAt=new Date().toISOString();return true;}  // legacy: start the clock now
    const ts=Date.parse(t.doneAt);
    if(isNaN(ts))return true;
    return (now-ts)<TODO_KEEP_MS;
  });
  if(todos.length!==before)save();
}

function editor(id){

function setFreqType(t){
  editFreq={type:t};

  if(t==="days")editDays=[];

function changeCount(n){
  editFreq.count=Math.max(1,Math.min(7,(editFreq.count||3)+n));
  renderEditor();
}
function changeLimit(n){
  editFreq.max=Math.max(0,Math.min(99,(editFreq.max??5)+n));

}
function toggleDay(d){
  if(editDays.includes(d))editDays=editDays.filter(x=>x!==d);
  else editDays.push(d);
  editDays.sort((a,b)=>a-b);

}
function cancelEditor(){render();}
function saveHabit(){
  let name=$("#ename").value.trim();
  if(!name){                                         // v3.4: Hinweis am Feld statt alert()
    const inp=$("#ename"),er=$("#enameErr");
    if(er)er.textContent="Bitte einen Namen eingeben.";
    if(inp){inp.setAttribute("aria-invalid","true");inp.focus();}
    return;
  }
  let freq=cloneFreq(editFreq);
  if(freq.type==="days")freq.days=[...editDays];
  if(editId){
    let h=habits.find(x=>x.id===editId);
    if(h){
      let oldFreq=JSON.stringify(h.freq);
      let newFreq=JSON.stringify(freq);
      if(oldFreq!==newFreq){
        if(!h.versions)h.versions=[{from:"2000-01-01",freq:cloneFreq(h.freq)}];
        h.versions.push({from:k(today()),freq:cloneFreq(freq)});
      }
      h.name=name;h.freq=freq;
    }
  }else{
    habits.push({id:uid(),name,freq,arch:false,created:new Date().toISOString(),createdDay:k(today()),versions:[{from:"2000-01-01",freq:cloneFreq(freq)}]});
  }
  save();render();
}

function navTo(t){window._moreOpen=false;if(tab===t)render();else setTab(t);}
/* Tipp außerhalb der Navigation schließt ein offenes MORE-Menü (und löst sonst nichts aus) */
document.addEventListener("click",e=>{
  if(!window._moreOpen)return;
  const t=e.target;
  if(t&&t.closest&&t.closest("nav"))return;
  window._moreOpen=false;e.preventDefault();e.stopPropagation();render();
},true);

document.addEventListener("touchstart",e=>{
  if(e.touches.length!==1)return;
  // v2.2: gestures starting on a counter card never switch tabs (mis-taps while counting)
  touchBlocked = !!(e.target&&e.target.closest&&e.target.closest(".noswipe"));
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchStartTime=Date.now();
},{passive:true});

document.addEventListener("touchend",e=>{
  if(!touchStartX && !touchStartY)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const dt=Date.now()-touchStartTime;
  touchStartX=touchStartY=0;
  if(touchBlocked){touchBlocked=false;return;}   // v2.2: started on a counter card
  if(editorOpen)return;                          // v3.4: kein Reiterwechsel aus dem Editor
  if(dt>SWIPE_MAX_TIME)return;
  if(Math.abs(dy)>SWIPE_MAX_Y)return;
  if(Math.abs(dx)<SWIPE_THRESHOLD)return;
  // v1.8: on WEEK / MONTH, horizontal swipe navigates the period, not the tab
  if(tab==="week"){
    if(dx<0)animateSwipe("left",()=>weekNav(1));
    else animateSwipe("right",()=>weekNav(-1));
    return;
  }
  if(tab==="month"){
    if(dx<0)animateSwipe("left",()=>changeMonth(1));
    else animateSwipe("right",()=>changeMonth(-1));
    return;
  }
  // Otherwise: switch tabs
  const idx=TAB_ORDER.indexOf(tab);
  if(idx<0)return;
  if(dx<0 && idx<TAB_ORDER.length-1){
    animateSwipe("left",()=>setTab(TAB_ORDER[idx+1]));
  }else if(dx>0 && idx>0){
    animateSwipe("right",()=>setTab(TAB_ORDER[idx-1]));
  }
},{passive:true});

function animateSwipe(dir,cb){
  const main=document.querySelector("main");
  if(!main){cb();return;}
  main.classList.add(dir==="left"?"swipe-left":"swipe-right");
  setTimeout(()=>{
    cb();
    requestAnimationFrame(()=>{
      const m=document.querySelector("main");
      if(m){m.classList.remove("swipe-left","swipe-right");}
    });
  },120);
}

/* ── Keyboard shortcuts ── */
document.addEventListener("keydown",e=>{
  // v3.4: Esc schließt Menü bzw. Editor

  if(e.key==="ArrowRight" && idx<TAB_ORDER.length-1){e.preventDefault();setTab(TAB_ORDER[idx+1]);}
  else if(e.key==="ArrowLeft" && idx>0){e.preventDefault();setTab(TAB_ORDER[idx-1]);}
});

/* ── v3.2: Zentraler Klick-Listener ──
   Elemente tragen nur noch Daten (data-act, data-id), keinen ausführbaren Code
   mit Nutzerwerten. Aufgerufen werden ausschließlich Funktionen aus ACTIONS —

const ACTIONS={
  toggleById:     id=>toggleById(id),

};

function initServiceWorker(){

    .then(reg=>{

/* ══════════════════════════════════════════════════════════════════
   10b. KCAL — Kalorien-Tagebuch (v3.5)
   Eigenständiger Bereich: beeinflusst weder Tagesquote noch Serien.
   KKEY  : {goal, foods, log}  eigene Lebensmittel, Einträge, Tagesziel
   KCKEY : {source, imported, items:[[name, kcal/100 g], …]}  importierter Katalog
   Jeder Eintrag speichert seine kcal als Momentaufnahme: Ändern oder Löschen
   eines Lebensmittels bzw. Entfernen des Katalogs verändert die Historie nicht.
   Der Tag wechselt wie überall um 03:00 (today()).
   v3.6 — Makros (Eiweiß, Fett, Kohlenhydrate), überall optional:
   m = [eiweiß, fett, kh] in Gramm, bezogen auf dieselbe Basis wie die kcal
   (pro 100 g, pro Stück oder — bei Direkteinträgen — absolut). Einzelwerte
   dürfen null sein (= unbekannt). Ältere Daten ohne m bleiben gültig.
   v3.7 — Makroziele wahlweise als Verteilung in % der kcal (mmode "pct", mpct)
   oder fest in Gramm (mgoal). Im %-Modus werden die Gramm nie gespeichert,
   sondern immer aus kcal-Ziel × Anteil berechnet — sie folgen also automatisch.
   ══════════════════════════════════════════════════════════════════ */
const KKEY="habitdos.v3_5.kcal", KCKEY="habitdos.v3_5.kcalcat";
const KCAL_MAX_CAT=50000, KCAL_MAX_RESULTS=40;
const kSafeId=s=>String(s==null?"":s).replace(/[^A-Za-z0-9._-]/g,"");
const kNum=v=>{const n=parseFloat(String(v==null?"":v).trim().replace(/\s/g,"").replace(",","."));return isFinite(n)?n:NaN};
const kFmt=n=>Math.round(n).toLocaleString("de-DE");
const kFmtAmt=n=>(Math.round(n*10)/10).toLocaleString("de-DE");
const MAC_S=["E","F","KH"], MAC_L=["EIWEISS","FETT","KH"], MAC_KCAL=[4,9,4];
const kFmtG=n=>(n>=10?Math.round(n):Math.round(n*10)/10).toLocaleString("de-DE");
/* Makro-Array normalisieren: [e,f,kh] mit null für unbekannt; null, wenn alles fehlt */
function kMac(v,max){
  if(!Array.isArray(v))return null;
  const m=[0,1,2].map(i=>{const n=kNum(v[i]);return n>=0&&n<=max?Math.round(n*10)/10:null});
  return m.some(x=>x!=null)?m:null;
}
const kMacScale=(m,unit,amt)=>m?m.map(v=>v==null?null:(unit==="g"?v*amt/100:unit==="stk"?v*amt:v)):null;
const kMacTxt=m=>m?m.map((v,i)=>`${MAC_S[i]} ${v==null?"?":kFmtG(v)}`).join(" · ")+" g":"";
const kFold=s=>String(s).toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[\u0300-\u036f]/g,"");

function normalizeKcal(x){
  const o={goal:null,foods:[],log:[]};
  if(!x||typeof x!=="object")return o;
  const g=kNum(x.goal); if(g>0)o.goal=Math.min(20000,Math.round(g));
  const mg=kMac(x.mgoal,2000); if(mg)o.mgoal=mg.map(v=>v==null||v<=0?null:Math.round(v));
  if(o.mgoal&&!o.mgoal.some(v=>v!=null))delete o.mgoal;
  const mp=kMac(x.mpct,100); if(mp&&mp.every(v=>v!=null))o.mpct=mp;
  if(x.mmode==="pct"||x.mmode==="g")o.mmode=x.mmode;
  const fid=new Set();
  (Array.isArray(x.foods)?x.foods:[]).forEach(f=>{
    if(!f||typeof f!=="object")return;
    const n=String(f.n==null?"":f.n).trim().slice(0,120), per=kNum(f.per), unit=f.unit==="stk"?"stk":"g";
    if(!n||!(per>=0)||per>20000)return;
    let id=kSafeId(f.id); if(!id||fid.has(id))id=uid(); fid.add(id);
    const food={id,n,per:Math.round(per*10)/10,unit};
    const pg=kNum(f.pg); if(unit==="g"&&pg>0&&pg<=5000)food.pg=Math.round(pg);
    const m=kMac(f.m,unit==="g"?100:2000); if(m)food.m=m;
    o.foods.push(food);
  });
  const eid=new Set();
  (Array.isArray(x.log)?x.log:[]).forEach(e=>{
    if(!e||typeof e!=="object"||!isValidDateKey(e.d))return;
    const kc=kNum(e.kcal); if(!(kc>=0)||kc>50000)return;
    const unit=["g","stk","kcal"].includes(e.unit)?e.unit:"kcal";
    let id=kSafeId(e.id); if(!id||eid.has(id))id=uid(); eid.add(id);
    const amt=kNum(e.amt), per=kNum(e.per);
    const out={id,d:String(e.d),n:String(e.n==null?"Eintrag":e.n).trim().slice(0,120)||"Eintrag",unit,
      amt:amt>0?amt:(unit==="kcal"?Math.round(kc):0),per:unit==="kcal"?null:(per>=0?per:null),kcal:Math.round(kc)};
    if(typeof e.t==="string"&&!isNaN(Date.parse(e.t)))out.t=e.t;
    if(e.src==="c"||e.src==="f")out.src=e.src;
    const m=kMac(e.m,unit==="g"?100:5000); if(m)out.m=m;
    o.log.push(out);
  });
  return o;
}
function normalizeCat(x){
  if(!x||typeof x!=="object"||!Array.isArray(x.items))return null;
  const items=[];
  for(const it of x.items){
    if(items.length>=KCAL_MAX_CAT)break;
    if(!Array.isArray(it))continue;
    const n=String(it[0]==null?"":it[0]).trim().slice(0,160), v=kNum(it[1]);
    if(!(n&&v>=0&&v<=1000))continue;
    const m=kMac(it.slice(2,5),100);
    items.push(m?[n,Math.round(v*10)/10,m[0],m[1],m[2]]:[n,Math.round(v*10)/10]);
  }
  if(!items.length)return null;
  return {source:String(x.source||"Katalog").slice(0,80),
          imported:(typeof x.imported==="string"&&!isNaN(Date.parse(x.imported)))?x.imported:new Date().toISOString(),items};
}

let kcal=normalizeKcal(getStore(KKEY,null));
let kcalCat=normalizeCat(getStore(KCKEY,null));
let _catFold=null;            // gefaltete Katalognamen für die Suche, bei Bedarf gebaut
let kcalDay=null;             // null = folgt "heute" (auch über 03:00 hinweg)
let kcalQuery="";             // Suchtext bleibt beim Neuzeichnen erhalten
let kcalPanel=null;           // offenes Mengen- bzw. Formularfeld
let kcalCatMsg="";            // Rückmeldung nach Katalog-Import

function saveKcal(){return putStore(KKEY,kcal)}
function setKcalCat(c){kcalCat=c;_catFold=null}
function kcalDayKey(){return kcalDay?k(kcalDay):k(today())}
function kcalDayTotal(dk){let s=0;for(const e of kcal.log)if(e.d===dk)s+=e.kcal;return s}
/* v3.7: aktuelle Makroziele in Gramm — im %-Modus aus kcal-Ziel berechnet */
function kMacMode(){return kcal.mmode||(kcal.mgoal?"g":"pct")}
const kPctToG=(goal,pct)=>pct.map((v,i)=>Math.round(goal*v/100/MAC_KCAL[i]));
function kMacGoals(){
  if(kMacMode()==="pct")return (kcal.goal&&kcal.mpct)?kPctToG(kcal.goal,kcal.mpct):null;
  return kcal.mgoal||null;
}
/* Gramm → Anteile, die zusammen genau 100 ergeben */
function kGToPct(g){
  const kc=g.map((v,i)=>(v||0)*MAC_KCAL[i]), tot=kc.reduce((a,b)=>a+b,0);
  if(!tot)return null;
  const pc=kc.map(v=>Math.round(v/tot*100));
  pc[2]+=100-pc.reduce((a,b)=>a+b,0);
  return pc;
}
/* Makro-Summen eines Tages; miss = Einträge ohne vollständige Makros */
function kcalDayMacros(entries){
  const sum=[0,0,0];let miss=0;
  for(const e of entries){
    const m=kMacScale(e.m,e.unit,e.amt);
    if(!m||m.some(v=>v==null))miss++;
    if(m)m.forEach((v,i)=>{if(v!=null)sum[i]+=v});
  }
  return {sum,miss};
}
function kPerTxt(f){return f.unit==="stk"?`${kFmtAmt(f.per)} kcal/Stk`:`${kFmtAmt(f.per)} kcal/100 g`}
function kAmtTxt(e){return e.unit==="g"?`${kFmtAmt(e.amt)} g`:e.unit==="stk"?`${kFmtAmt(e.amt)} Stk`:"direkt"}
function kCalc(per,unit,amt){return Math.round(unit==="g"?per*amt/100:per*amt)}

/* ── Suche: alle Wörter müssen vorkommen; eigene Lebensmittel zuerst ── */
function kcalSearch(q){
  const toks=kFold(q).split(/\s+/).filter(Boolean);
  if(!toks.length)return[];
  const score=(f,raw)=>{let s=raw.length;if(f.startsWith(toks[0]))s-=1000;else if(f.includes(" "+toks[0]))s-=500;return s};
  const own=[];
  kcal.foods.forEach(f=>{const ff=kFold(f.n);if(toks.every(t=>ff.includes(t)))own.push({sc:score(ff,f.n),id:"f:"+f.id,n:f.n,per:f.per,unit:f.unit,m:f.m,own:true})});
  own.sort((a,b)=>a.sc-b.sc);
  const cat=[];
  if(kcalCat){
    if(!_catFold)_catFold=kcalCat.items.map(it=>kFold(it[0]));
    for(let i=0;i<_catFold.length;i++){
      const ff=_catFold[i];
      if(toks.every(t=>ff.includes(t)))cat.push({sc:score(ff,kcalCat.items[i][0]),id:"c:"+i,n:kcalCat.items[i][0],per:kcalCat.items[i][1],unit:"g",m:kMac(kcalCat.items[i].slice(2,5),100)});
    }
    cat.sort((a,b)=>a.sc-b.sc);
  }
  return own.concat(cat).slice(0,KCAL_MAX_RESULTS);
}
/* Zuletzt gegessen: jüngste unterschiedliche Lebensmittel (ohne Direkteinträge) */
function kcalRecents(max=8){
  const seen=new Set(),out=[];
  const sorted=kcal.log.filter(e=>e.unit!=="kcal"&&e.per!=null).sort((a,b)=>((b.t||b.d)>(a.t||a.d)?1:-1));
  for(const e of sorted){
    const key=e.n+"|"+e.unit+"|"+e.per;
    if(seen.has(key))continue;
    seen.add(key);out.push(e);
    if(out.length>=max)break;
  }
  return out;
}

function kcalResultRow(r){

/* drei Makro-Eingaben nebeneinander; ids: prefix+"p|f|c" */
function kMacInputs(prefix,vals,unitTxt,oninput=""){
  return `<div class="kmacin">`+["p","f","c"].map((s,i)=>
